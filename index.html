 {"id": "TEID-37-T3", "title": "Verify that write access is requested separately, only when the operator enables invoice sync or credit grants (TEID-39, TEID-40).", "ac": 3, "type": "Security"}, {"id": "TEID-37-T4", "title": "Verify that no card or bank details are ever stored in our system.", "ac": 4, "type": "Functional"}, {"id": "TEID-37-T5", "title": "Verify that disconnecting stops all access to Stripe immediately and is recorded in the audit log.", "ac": 5, "type": "Security"}]}, {"key": "TEID-38", "epic": "TEID-4", "summary": "Sync customers with Stripe", "desc": "As a billing operator, I want our customers linked to their Stripe customer records, so that invoices and payments line up with the right account.\n\n*Context*\n", "priority": "Highest", "points": 5, "release": "mvp", "area": "stripe", "ac": ["Existing Stripe customers can be matched to our customers automatically by ID or email, with a review screen for uncertain matches.", "New customers created in either system can be linked, with the operator choosing which system creates the Stripe record.", "A customer can never be linked to more than one Stripe customer."], "order": 37, "tests": [{"id": "TEID-38-T1", "title": "Verify that existing Stripe customers can be matched to our customers automatically by ID or email, with a review screen for uncertain matches.", "ac": 1, "type": "Functional"}, {"id": "TEID-38-T2", "title": "Verify that new customers created in either system can be linked, with the operator choosing which system creates the Stripe record.", "ac": 2, "type": "Functional"}, {"id": "TEID-38-T3", "title": "Verify that a customer can never be linked to more than one Stripe customer.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-98", "epic": "TEID-11", "summary": "Connector framework and contract test suite", "desc": "As a Teideal engineer, I want a common framework that every billing-system connector is built on, so that each new connector is read-only, reliable and consistent by construction.\n\n*Context*\nPrerequisite for the Metronome, Orb and Lago connectors. Generalises the connector approach in TEID-65.", "priority": "Highest", "points": 8, "release": "mvp", "area": "verify", "ac": ["The framework defines one data model for customers, prices, contracts, invoices, credits, payments and refunds.", "It provides shared handling for authentication, pagination, rate limits, retries, incremental sync and error reporting.", "A contract test suite checks that a connector is read-only, maps data correctly and survives API failures; a connector cannot ship until it passes.", "Sync health for every connector appears in the same console view."], "provisional": true, "order": 38, "tests": [{"id": "TEID-98-T1", "title": "Verify that the framework defines one data model for customers, prices, contracts, invoices, credits, payments and refunds.", "ac": 1, "type": "Functional"}, {"id": "TEID-98-T2", "title": "Verify that it provides shared handling for authentication, pagination, rate limits, retries, incremental sync and error reporting.", "ac": 2, "type": "Resilience"}, {"id": "TEID-98-T3", "title": "Verify that a contract test suite checks that a connector is read-only, maps data correctly and survives API failures; a connector cannot ship until it passes.", "ac": 3, "type": "Security"}, {"id": "TEID-98-T4", "title": "Verify that sync health for every connector appears in the same console view.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-65", "epic": "TEID-11", "summary": "Connect billing systems read-only", "desc": "As a finance lead, I want to connect our billing and payment systems to Teideal with read-only access, so that Teideal can check our billing without any risk of changing it.\n\n*Context*\nLaunch with Stripe Billing, then add Metronome, Orb and Lago in order of design-partner demand. A generic file and API importer covers homegrown systems.", "priority": "Highest", "points": 8, "release": "mvp", "area": "verify", "ac": ["An operator can connect Stripe Billing at launch, and any system through the generic CSV or API importer.", "Every connector uses read-only credentials, and Teideal contains no code path that writes to a connected billing system; an automated test on every release confirms this.", "Teideal pulls customers, prices, subscriptions, invoices, line items, credit notes, payments and refunds.", "The first sync can load up to 24 months of history; after that, new data is synced at least every hour.", "The connection screen shows the last successful sync and any errors in plain English."], "order": 39, "tests": [{"id": "TEID-65-T1", "title": "Verify that an operator can connect Stripe Billing at launch, and any system through the generic CSV or API importer.", "ac": 1, "type": "Functional"}, {"id": "TEID-65-T2", "title": "Verify that every connector uses read-only credentials, and Teideal contains no code path that writes to a connected billing system; an automated test on every release confirms this.", "ac": 2, "type": "Security"}, {"id": "TEID-65-T3", "title": "Verify that teideal pulls customers, prices, subscriptions, invoices, line items, credit notes, payments and refunds.", "ac": 3, "type": "Functional"}, {"id": "TEID-65-T4", "title": "Verify that the first sync can load up to 24 months of history; after that, new data is synced at least every hour.", "ac": 4, "type": "Performance"}, {"id": "TEID-65-T5", "title": "Verify that the connection screen shows the last successful sync and any errors in plain English.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-66", "epic": "TEID-11", "summary": "Independent usage feed", "desc": "As a developer at our customer, I want to give Teideal its own copy of raw usage events, separate from what our billing system received, so that verification compares billing against the source of truth rather than against itself.\n\n*Context*\nOptions: SDK dual-write (TEID-59), import from a data warehouse or storage bucket, or mirroring the customer's existing usage webhooks.", "priority": "Highest", "points": 8, "release": "mvp", "area": "verify", "ac": ["Usage can arrive by SDK dual-write, scheduled import from a warehouse or storage bucket, or webhook mirroring.", "The same idempotency rules as TEID-31 apply, so importing the same data twice never double-counts.", "Teideal reports event volumes per hour per source and flags gaps or sudden drops that suggest missing data.", "The operator can see, per customer, which periods have complete usage data and which do not."], "order": 40, "tests": [{"id": "TEID-66-T1", "title": "Verify that usage can arrive by SDK dual-write, scheduled import from a warehouse or storage bucket, or webhook mirroring.", "ac": 1, "type": "Functional"}, {"id": "TEID-66-T2", "title": "Verify that the same idempotency rules as TEID-31 apply, so importing the same data twice never double-counts.", "ac": 2, "type": "Functional"}, {"id": "TEID-66-T3", "title": "Verify that teideal reports event volumes per hour per source and flags gaps or sudden drops that suggest missing data.", "ac": 3, "type": "Functional"}, {"id": "TEID-66-T4", "title": "Verify that the operator can see, per customer, which periods have complete usage data and which do not.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-67", "epic": "TEID-11", "summary": "Capture contract terms for re-rating", "desc": "As a finance lead, I want to give Teideal the pricing and contract terms each customer is actually on, so that Teideal can calculate what each customer should have been charged.\n\n*Context*\nPrices come from the connected billing system where possible. Terms that live only in contracts (commits, negotiated discounts, free credits) are added by the operator using the TEID-1 model.", "priority": "Highest", "points": 8, "release": "mvp", "area": "verify", "ac": ["Prices and plans are imported from connected systems and converted into Teideal plan versions (TEID-1).", "An operator can add terms that are missing from the billing system, such as commits, discounts and credit grants, each with effective dates.", "Every customer is mapped to a set of terms; customers without a mapping are listed and excluded from verification until mapped.", "Any term the Teideal model cannot represent is flagged clearly rather than approximated."], "order": 41, "tests": [{"id": "TEID-67-T1", "title": "Verify that prices and plans are imported from connected systems and converted into Teideal plan versions (TEID-1).", "ac": 1, "type": "Functional"}, {"id": "TEID-67-T2", "title": "Verify that an operator can add terms that are missing from the billing system, such as commits, discounts and credit grants, each with effective dates.", "ac": 2, "type": "Functional"}, {"id": "TEID-67-T3", "title": "Verify that every customer is mapped to a set of terms; customers without a mapping are listed and excluded from verification until mapped.", "ac": 3, "type": "Functional"}, {"id": "TEID-67-T4", "title": "Verify that any term the Teideal model cannot represent is flagged clearly rather than approximated.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-68", "epic": "TEID-11", "summary": "Independent re-rating of usage", "desc": "As a finance lead, I want Teideal to calculate what each customer should have been charged, using its own ledger and not the billing system's output, so that we have a genuinely independent second opinion on every invoice.\n\n*Context*\nThis reuses the TEID-3 ledger. It must never take the billing system's calculated totals as input.", "priority": "Highest", "points": 13, "release": "mvp", "area": "verify", "ac": ["For each customer and period, Teideal calculates expected charges per line from raw usage and contract terms.", "The calculation handles tiers, proration, credits and their consumption order, commits and overage, and rate overrides.", "Running the same calculation again always produces the same result, to the cent.", "Every expected amount can be traced to the usage events and terms that produced it."], "order": 42, "tests": [{"id": "TEID-68-T1", "title": "Verify that for each customer and period, Teideal calculates expected charges per line from raw usage and contract terms.", "ac": 1, "type": "Functional"}, {"id": "TEID-68-T2", "title": "Verify that the calculation handles tiers, proration, credits and their consumption order, commits and overage, and rate overrides.", "ac": 2, "type": "Functional"}, {"id": "TEID-68-T3", "title": "Verify that running the same calculation again always produces the same result, to the cent.", "ac": 3, "type": "Functional"}, {"id": "TEID-68-T4", "title": "Verify that every expected amount can be traced to the usage events and terms that produced it.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-69", "epic": "TEID-11", "summary": "Three-way match: usage, invoiced, collected", "desc": "As a finance lead, I want every customer's usage, expected charge, invoiced amount and collected amount matched automatically, so that any error anywhere in the chain is caught within hours.\n\n*Context*\nReplaces the earlier Stripe-only reconciliation with a match that works across any connected system.", "priority": "Highest", "points": 13, "release": "mvp", "area": "verify", "ac": ["After every sync, Teideal compares expected charges, invoiced amounts and collected payments for each customer and period.", "The default tolerance is zero (to the cent); an operator can set a different tolerance with a recorded reason.", "Each mismatch is given a category: unbilled usage, overbilled, wrong price, missing credit, duplicate charge, uncollected, or refund without credit note.", "Mismatches create findings (TEID-71) automatically and can trigger alerts and webhooks (TEID-47, TEID-48)."], "order": 43, "tests": [{"id": "TEID-69-T1", "title": "Verify that after every sync, Teideal compares expected charges, invoiced amounts and collected payments for each customer and period.", "ac": 1, "type": "Functional"}, {"id": "TEID-69-T2", "title": "Verify that the default tolerance is zero (to the cent); an operator can set a different tolerance with a recorded reason.", "ac": 2, "type": "Functional"}, {"id": "TEID-69-T3", "title": "Verify that each mismatch is given a category: unbilled usage, overbilled, wrong price, missing credit, duplicate charge, uncollected, or refund without credit note.", "ac": 3, "type": "Functional"}, {"id": "TEID-69-T4", "title": "Verify that mismatches create findings (TEID-71) automatically and can trigger alerts and webhooks (TEID-47, TEID-48).", "ac": 4, "type": "Functional"}]}, {"key": "TEID-70", "epic": "TEID-11", "summary": "Leakage and overbilling in dollars", "desc": "As a founder, I want to see how much revenue we are losing and how much we may be overcharging, in dollars, so that I can decide what to fix first and justify the cost of Teideal.\n\n*Context*\nPreviously planned as a phase 2 AI feature; now core to the MVP.", "priority": "Highest", "points": 8, "release": "mvp", "area": "verify", "ac": ["A dashboard shows total unbilled revenue, total overbilling, and total uncollected revenue for any date range.", "Each total can be broken down by category, customer and product.", "Trends are shown month by month so improvements are visible after fixes.", "All figures can be exported, and every figure links to the findings behind it."], "order": 44, "tests": [{"id": "TEID-70-T1", "title": "Verify that a dashboard shows total unbilled revenue, total overbilling, and total uncollected revenue for any date range.", "ac": 1, "type": "Functional"}, {"id": "TEID-70-T2", "title": "Verify that each total can be broken down by category, customer and product.", "ac": 2, "type": "Functional"}, {"id": "TEID-70-T3", "title": "Verify that trends are shown month by month so improvements are visible after fixes.", "ac": 3, "type": "Functional"}, {"id": "TEID-70-T4", "title": "Verify that all figures can be exported, and every figure links to the findings behind it.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-71", "epic": "TEID-11", "summary": "Findings workflow", "desc": "As a finance lead, I want each mismatch to be a finding I can assign, discuss and resolve, so that problems get fixed rather than just reported.\n\n*Context*\n", "priority": "Highest", "points": 5, "release": "mvp", "area": "verify", "ac": ["Each finding shows the customer, period, category, amount, and the evidence from usage, ledger and billing system.", "Findings can be assigned to a person, commented on, and resolved as 'fixed in source', 'accepted' or 'not an error', with a mandatory note.", "A finding marked 'fixed in source' stays open until the next sync confirms the fix.", "All finding activity is kept in the audit log (TEID-42)."], "order": 45, "tests": [{"id": "TEID-71-T1", "title": "Verify that each finding shows the customer, period, category, amount, and the evidence from usage, ledger and billing system.", "ac": 1, "type": "Functional"}, {"id": "TEID-71-T2", "title": "Verify that findings can be assigned to a person, commented on, and resolved as 'fixed in source', 'accepted' or 'not an error', with a mandatory note.", "ac": 2, "type": "Functional"}, {"id": "TEID-71-T3", "title": "Verify that a finding marked 'fixed in source' stays open until the next sync confirms the fix.", "ac": 3, "type": "Functional"}, {"id": "TEID-71-T4", "title": "Verify that all finding activity is kept in the audit log (TEID-42).", "ac": 4, "type": "Security"}]}, {"key": "TEID-72", "epic": "TEID-11", "summary": "Monthly verification report", "desc": "As a finance lead, I want a monthly report stating how much revenue was verified and what was found, so that I can show our board and auditors that our billing is checked independently.\n\n*Context*\n", "priority": "High", "points": 5, "release": "mvp", "area": "verify", "ac": ["The report covers the share of revenue verified, the share matched to the cent, and the value of open and resolved findings.", "It explicitly lists what was not verified and why (for example, unmapped customers or missing usage data).", "Once issued, a report cannot be changed; each report carries a fingerprint so any later alteration can be detected.", "The report can be downloaded as PDF and CSV."], "order": 46, "tests": [{"id": "TEID-72-T1", "title": "Verify that the report covers the share of revenue verified, the share matched to the cent, and the value of open and resolved findings.", "ac": 1, "type": "Functional"}, {"id": "TEID-72-T2", "title": "Verify that it explicitly lists what was not verified and why (for example, unmapped customers or missing usage data).", "ac": 2, "type": "Functional"}, {"id": "TEID-72-T3", "title": "Verify that once issued, a report cannot be changed; each report carries a fingerprint so any later alteration can be detected.", "ac": 3, "type": "Functional"}, {"id": "TEID-72-T4", "title": "Verify that the report can be downloaded as PDF and CSV.", "ac": 4, "type": "Performance"}]}, {"key": "TEID-99", "epic": "TEID-11", "summary": "Metronome connector for Verify", "desc": "As a finance lead at a company using Metronome, I want to connect Metronome to Teideal Verify with read-only access, so that our Metronome billing can be verified independently.\n\n*Context*\nBuild order follows design-partner demand. Before building, confirm that Metronome's API terms permit third-party read access, now that it is part of Stripe.", "priority": "High", "points": 8, "release": "mvp", "area": "verify", "ac": ["An operator can connect Metronome with read-only credentials.", "Customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).", "The connector passes the full contract test suite, including the read-only check.", "Historical sync of up to 24 months and incremental sync at least hourly are supported.", "Verification runs end to end for at least one design partner using Metronome, with every difference either matched or explained."], "provisional": true, "order": 47, "tests": [{"id": "TEID-99-T1", "title": "Verify that an operator can connect Metronome with read-only credentials.", "ac": 1, "type": "Security"}, {"id": "TEID-99-T2", "title": "Verify that customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).", "ac": 2, "type": "Functional"}, {"id": "TEID-99-T3", "title": "Verify that the connector passes the full contract test suite, including the read-only check.", "ac": 3, "type": "Security"}, {"id": "TEID-99-T4", "title": "Verify that historical sync of up to 24 months and incremental sync at least hourly are supported.", "ac": 4, "type": "Functional"}, {"id": "TEID-99-T5", "title": "Verify that verification runs end to end for at least one design partner using Metronome, with every difference either matched or explained.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-100", "epic": "TEID-11", "summary": "Orb connector for Verify", "desc": "As a finance lead at a company using Orb, I want to connect Orb to Teideal Verify with read-only access, so that our Orb billing can be verified independently.\n\n*Context*\nBuild order follows design-partner demand. Before building, confirm that Orb's API terms permit third-party read access, now that it is part of Adyen.", "priority": "High", "points": 8, "release": "mvp", "area": "verify", "ac": ["An operator can connect Orb with read-only credentials.", "Customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).", "The connector passes the full contract test suite, including the read-only check.", "Historical sync of up to 24 months and incremental sync at least hourly are supported.", "Verification runs end to end for at least one design partner using Orb, with every difference either matched or explained."], "provisional": true, "order": 48, "tests": [{"id": "TEID-100-T1", "title": "Verify that an operator can connect Orb with read-only credentials.", "ac": 1, "type": "Security"}, {"id": "TEID-100-T2", "title": "Verify that customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).", "ac": 2, "type": "Functional"}, {"id": "TEID-100-T3", "title": "Verify that the connector passes the full contract test suite, including the read-only check.", "ac": 3, "type": "Security"}, {"id": "TEID-100-T4", "title": "Verify that historical sync of up to 24 months and incremental sync at least hourly are supported.", "ac": 4, "type": "Functional"}, {"id": "TEID-100-T5", "title": "Verify that verification runs end to end for at least one design partner using Orb, with every difference either matched or explained.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-101", "epic": "TEID-11", "summary": "Lago connector for Verify", "desc": "As a finance lead at a company using Lago, I want to connect Lago to Teideal Verify with read-only access, so that our Lago billing can be verified independently.\n\n*Context*\nBuild order follows design-partner demand. Must work with both Lago Cloud and self-hosted Lago.", "priority": "High", "points": 5, "release": "mvp", "area": "verify", "ac": ["An operator can connect Lago with read-only credentials.", "Customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).", "The connector passes the full contract test suite, including the read-only check.", "Historical sync of up to 24 months and incremental sync at least hourly are supported.", "Verification runs end to end for at least one design partner using Lago, with every difference either matched or explained."], "provisional": true, "order": 49, "tests": [{"id": "TEID-101-T1", "title": "Verify that an operator can connect Lago with read-only credentials.", "ac": 1, "type": "Security"}, {"id": "TEID-101-T2", "title": "Verify that customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).", "ac": 2, "type": "Functional"}, {"id": "TEID-101-T3", "title": "Verify that the connector passes the full contract test suite, including the read-only check.", "ac": 3, "type": "Security"}, {"id": "TEID-101-T4", "title": "Verify that historical sync of up to 24 months and incremental sync at least hourly are supported.", "ac": 4, "type": "Functional"}, {"id": "TEID-101-T5", "title": "Verify that verification runs end to end for at least one design partner using Lago, with every difference either matched or explained.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-59", "epic": "TEID-9", "summary": "Python and TypeScript SDKs", "desc": "As a developer at our customer, I want official SDKs that send usage events to Teideal alongside my existing billing system, so that Teideal gets an independent copy of usage with a few lines of code.\n\n*Context*\nMVP scope is event sending for Verify. Entitlement check, reserve and settle calls are added when TEID-2 is built.", "priority": "Highest", "points": 8, "release": "mvp", "area": "developer-experience", "ac": ["SDKs are available for Python and TypeScript.", "MVP: the SDK sends usage events with automatic retries that always reuse the same idempotency key.", "MVP: a dual-write helper sends each event to Teideal and the existing billing system, and a failure on the Teideal side never blocks or fails the customer's request.", "MVP: events are buffered locally if Teideal is unreachable and sent later without duplication.", "Phase 2: the SDK adds entitlement check, reserve and settle calls and the local entitlement cache used in degraded mode (TEID-27)."], "order": 50, "tests": [{"id": "TEID-59-T1", "title": "Verify that SDKs are available for Python and TypeScript.", "ac": 1, "type": "Functional"}, {"id": "TEID-59-T2", "title": "Verify that MVP: the SDK sends usage events with automatic retries that always reuse the same idempotency key.", "ac": 2, "type": "Resilience"}, {"id": "TEID-59-T3", "title": "Verify that MVP: a dual-write helper sends each event to Teideal and the existing billing system, and a failure on the Teideal side never blocks or fails the customer's request.", "ac": 3, "type": "Functional"}, {"id": "TEID-59-T4", "title": "Verify that MVP: events are buffered locally if Teideal is unreachable and sent later without duplication.", "ac": 4, "type": "Resilience"}, {"id": "TEID-59-T5", "title": "Verify that phase 2: the SDK adds entitlement check, reserve and settle calls and the local entitlement cache used in degraded mode (TEID-27).", "ac": 5, "type": "Functional"}]}, {"key": "TEID-60", "epic": "TEID-9", "summary": "Sandbox environment", "desc": "As a developer at our customer, I want a separate sandbox with its own keys, so that I can build and test without affecting real customers or money.\n\n*Context*\n", "priority": "Highest", "points": 5, "release": "mvp", "area": "developer-experience", "ac": ["Every account has a sandbox with separate API keys and data.", "The sandbox connects only to Stripe test mode and can never create live charges.", "Sandbox configuration can be copied to production after review."], "order": 51, "tests": [{"id": "TEID-60-T1", "title": "Verify that every account has a sandbox with separate API keys and data.", "ac": 1, "type": "Functional"}, {"id": "TEID-60-T2", "title": "Verify that the sandbox connects only to Stripe test mode and can never create live charges.", "ac": 2, "type": "Functional"}, {"id": "TEID-60-T3", "title": "Verify that sandbox configuration can be copied to production after review.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-62", "epic": "TEID-9", "summary": "Documentation and quick-start", "desc": "As a developer at our customer, I want clear documentation and a quick-start guide, so that I can integrate in one working day.\n\n*Context*\n", "priority": "High", "points": 5, "release": "mvp", "area": "developer-experience", "ac": ["Documentation covers every endpoint, error and reason code with examples.", "A quick-start guide takes a new developer from sign-up to a working entitlement check and event in under one hour.", "The guarantees we make (exactly-once, ordering, degraded mode) are documented along with how we test them."], "order": 52, "tests": [{"id": "TEID-62-T1", "title": "Verify that documentation covers every endpoint, error and reason code with examples.", "ac": 1, "type": "Functional"}, {"id": "TEID-62-T2", "title": "Verify that a quick-start guide takes a new developer from sign-up to a working entitlement check and event in under one hour.", "ac": 2, "type": "Functional"}, {"id": "TEID-62-T3", "title": "Verify that the guarantees we make (exactly-once, ordering, degraded mode) are documented along with how we test them.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-109", "epic": "TEID-88", "summary": "Data inventory and classification", "desc": "As a Teideal engineer, I want every stored field classified by sensitivity, so that we know where personal and financial data lives and protect it accordingly.", "priority": "Highest", "points": 3, "release": "mvp", "area": "privacy", "ac": ["Every stored field is classified as personal, financial, or operational in a maintained data map.", "A new field cannot be merged without a classification; an automated check enforces this.", "The data map is used to generate the list of personal data we process for the DPA and trust page."], "provisional": true, "order": 53, "tests": [{"id": "TEID-109-T1", "title": "Verify that every stored field is classified as personal, financial, or operational in a maintained data map.", "ac": 1, "type": "Functional"}, {"id": "TEID-109-T2", "title": "Verify that a new field cannot be merged without a classification; an automated check enforces this.", "ac": 2, "type": "Functional"}, {"id": "TEID-109-T3", "title": "Verify that the data map is used to generate the list of personal data we process for the DPA and trust page.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-110", "epic": "TEID-88", "summary": "Data minimisation for Verify", "desc": "As a finance lead, I want Teideal to collect only the data needed for verification, so that we share as little of our customers' personal data as possible.\n\n*Context*\nVerification needs amounts, dates and stable identifiers, not names or addresses.", "priority": "Highest", "points": 5, "release": "mvp", "area": "privacy", "ac": ["Connectors (TEID-65 and the new connectors) import only the fields needed for verification by default.", "Personal fields such as names, emails and addresses are excluded or pseudonymised unless the operator opts in.", "The console shows exactly which fields are collected from each connected system."], "provisional": true, "order": 54, "tests": [{"id": "TEID-110-T1", "title": "Verify that connectors (TEID-65 and the new connectors) import only the fields needed for verification by default.", "ac": 1, "type": "Functional"}, {"id": "TEID-110-T2", "title": "Verify that personal fields such as names, emails and addresses are excluded or pseudonymised unless the operator opts in.", "ac": 2, "type": "Functional"}, {"id": "TEID-110-T3", "title": "Verify that the console shows exactly which fields are collected from each connected system.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-111", "epic": "TEID-88", "summary": "Personal data held separately from the ledger", "desc": "As a finance lead, I want personal data stored apart from the immutable ledger, so that we can erase a person's data without altering the financial record.\n\n*Context*\nResolves the conflict between an append-only ledger (TEID-32) and the right to erasure.", "priority": "Highest", "points": 5, "release": "mvp", "area": "privacy", "ac": ["Ledger entries reference customers by a pseudonymous ID and contain no personal data.", "Personal data lives in a separate store linked to that ID.", "Erasing a person's data leaves every ledger amount, balance and report unchanged.", "An automated test erases a customer's personal data and confirms the ledger integrity checks (TEID-33) still pass."], "provisional": true, "order": 55, "tests": [{"id": "TEID-111-T1", "title": "Verify that ledger entries reference customers by a pseudonymous ID and contain no personal data.", "ac": 1, "type": "Functional"}, {"id": "TEID-111-T2", "title": "Verify that personal data lives in a separate store linked to that ID.", "ac": 2, "type": "Functional"}, {"id": "TEID-111-T3", "title": "Verify that erasing a person's data leaves every ledger amount, balance and report unchanged.", "ac": 3, "type": "Functional"}, {"id": "TEID-111-T4", "title": "Verify that an automated test erases a customer's personal data and confirms the ledger integrity checks (TEID-33) still pass.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-115", "epic": "TEID-88", "summary": "Data processing agreement and sub-processor list", "desc": "As a founder, I want a standard data processing agreement and public list of sub-processors, so that legal review does not delay design-partner contracts.", "priority": "Highest", "points": 2, "release": "mvp", "area": "privacy", "ac": ["A standard DPA covers GDPR and India's DPDP Act, reviewed by legal counsel.", "A public sub-processor list names each provider, its purpose and data location.", "Customers are notified at least 30 days before a new sub-processor is added."], "provisional": true, "order": 56, "tests": [{"id": "TEID-115-T1", "title": "Verify that a standard DPA covers GDPR and India's DPDP Act, reviewed by legal counsel.", "ac": 1, "type": "Functional"}, {"id": "TEID-115-T2", "title": "Verify that a public sub-processor list names each provider, its purpose and data location.", "ac": 2, "type": "Functional"}, {"id": "TEID-115-T3", "title": "Verify that customers are notified at least 30 days before a new sub-processor is added.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-112", "epic": "TEID-88", "summary": "Retention and automated deletion", "desc": "As a finance lead, I want data kept only as long as needed and deleted automatically after that, so that we meet legal retention duties without keeping data forever.\n\n*Context*\nDefault periods to be confirmed with legal counsel for each operating market.", "priority": "High", "points": 5, "release": "mvp", "area": "privacy", "ac": ["Retention periods are defined separately for raw usage events, financial records and personal data.", "An Owner can shorten retention within legal limits.", "Data past its retention period is deleted automatically, including from backups within the backup cycle.", "Every deletion run is logged with what was deleted and when."], "provisional": true, "order": 57, "tests": [{"id": "TEID-112-T1", "title": "Verify that retention periods are defined separately for raw usage events, financial records and personal data.", "ac": 1, "type": "Functional"}, {"id": "TEID-112-T2", "title": "Verify that an Owner can shorten retention within legal limits.", "ac": 2, "type": "Functional"}, {"id": "TEID-112-T3", "title": "Verify that data past its retention period is deleted automatically, including from backups within the backup cycle.", "ac": 3, "type": "Resilience"}, {"id": "TEID-112-T4", "title": "Verify that every deletion run is logged with what was deleted and when.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-113", "epic": "TEID-88", "summary": "Data subject requests", "desc": "As a finance lead, I want to find, export or erase all personal data about a specific individual, so that we can meet access and erasure requests on time.", "priority": "High", "points": 5, "release": "mvp", "area": "privacy", "ac": ["An operator can search for an individual across all personal data held for their tenant.", "The operator can export that data in a readable format.", "The operator can erase it; erasure completes within 7 days, well within the one-month GDPR deadline.", "Each request and its outcome is recorded in the audit log (TEID-42)."], "provisional": true, "order": 58, "tests": [{"id": "TEID-113-T1", "title": "Verify that an operator can search for an individual across all personal data held for their tenant.", "ac": 1, "type": "Functional"}, {"id": "TEID-113-T2", "title": "Verify that the operator can export that data in a readable format.", "ac": 2, "type": "Functional"}, {"id": "TEID-113-T3", "title": "Verify that the operator can erase it; erasure completes within 7 days, well within the one-month GDPR deadline.", "ac": 3, "type": "Functional"}, {"id": "TEID-113-T4", "title": "Verify that each request and its outcome is recorded in the audit log (TEID-42).", "ac": 4, "type": "Security"}]}, {"key": "TEID-114", "epic": "TEID-88", "summary": "Tenant offboarding and certified deletion", "desc": "As a account owner, I want all our data exported and then deleted when we leave Teideal, so that we can leave cleanly and prove our data is gone.\n\n*Context*\nBuilds on full data export (TEID-44).", "priority": "High", "points": 3, "release": "mvp", "area": "privacy", "ac": ["When a contract ends, a full export remains available for 30 days.", "After that, all tenant data is deleted within 30 days, and from backups within the backup cycle.", "The Owner receives a written confirmation of deletion."], "provisional": true, "order": 59, "tests": [{"id": "TEID-114-T1", "title": "Verify that when a contract ends, a full export remains available for 30 days.", "ac": 1, "type": "Functional"}, {"id": "TEID-114-T2", "title": "Verify that after that, all tenant data is deleted within 30 days, and from backups within the backup cycle.", "ac": 2, "type": "Resilience"}, {"id": "TEID-114-T3", "title": "Verify that the Owner receives a written confirmation of deletion.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-123", "epic": "TEID-90", "summary": "No training on customer data", "desc": "As a account owner, I want a guarantee that our data is never used to train AI models, so that we can use AI features without exposing our business data.", "priority": "Highest", "points": 2, "release": "mvp", "area": "ai-governance", "ac": ["Contracts with AI model providers prohibit training on Teideal customer data, with zero data retention where the provider offers it.", "The guarantee is written into the DPA and shown on the trust page.", "The console names the AI model provider used for each feature."], "provisional": true, "order": 60, "tests": [{"id": "TEID-123-T1", "title": "Verify that contracts with AI model providers prohibit training on Teideal customer data, with zero data retention where the provider offers it.", "ac": 1, "type": "Functional"}, {"id": "TEID-123-T2", "title": "Verify that the guarantee is written into the DPA and shown on the trust page.", "ac": 2, "type": "Functional"}, {"id": "TEID-123-T3", "title": "Verify that the console names the AI model provider used for each feature.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-124", "epic": "TEID-90", "summary": "AI never computes or changes money on its own", "desc": "As a finance lead, I want every number in an AI answer to come from Teideal's calculation engine, and every AI suggestion to need human approval, so that AI can never introduce a billing error.\n\n*Context*\nAI explains and suggests; the deterministic engine calculates; people approve.", "priority": "Highest", "points": 5, "release": "mvp", "area": "ai-governance", "ac": ["Amounts shown by AI features are retrieved from the ledger or calculation engine, never generated by the model.", "An automated check compares every number in an AI response against its source records and blocks the response if any do not match.", "AI features can propose changes (for example a plan mapping in TEID-79) but cannot save them; a person must confirm.", "Every AI suggestion and the person who approved or rejected it are recorded in the audit log."], "provisional": true, "order": 61, "tests": [{"id": "TEID-124-T1", "title": "Verify that amounts shown by AI features are retrieved from the ledger or calculation engine, never generated by the model.", "ac": 1, "type": "Resilience"}, {"id": "TEID-124-T2", "title": "Verify that an automated check compares every number in an AI response against its source records and blocks the response if any do not match.", "ac": 2, "type": "Functional"}, {"id": "TEID-124-T3", "title": "Verify that AI features can propose changes (for example a plan mapping in TEID-79) but cannot save them; a person must confirm.", "ac": 3, "type": "Functional"}, {"id": "TEID-124-T4", "title": "Verify that every AI suggestion and the person who approved or rejected it are recorded in the audit log.", "ac": 4, "type": "Security"}]}, {"key": "TEID-125", "epic": "TEID-90", "summary": "Defence against prompt injection", "desc": "As a security reviewer at our customer, I want AI features to treat imported text purely as data, so that hidden instructions in invoices or metadata cannot manipulate Teideal.\n\n*Context*\nImported fields such as invoice memos, customer names and event metadata can contain text written by anyone.", "priority": "Highest", "points": 5, "release": "mvp", "area": "ai-governance", "ac": ["Imported text is always passed to the model as data, clearly separated from instructions.", "AI features have no ability to write, delete or send data; tenant scoping is enforced outside the model.", "A red-team test suite plants injection attempts in every imported text field and must pass before each release."], "provisional": true, "order": 62, "tests": [{"id": "TEID-125-T1", "title": "Verify that imported text is always passed to the model as data, clearly separated from instructions.", "ac": 1, "type": "Functional"}, {"id": "TEID-125-T2", "title": "Verify that AI features have no ability to write, delete or send data; tenant scoping is enforced outside the model.", "ac": 2, "type": "Functional"}, {"id": "TEID-125-T3", "title": "Verify that a red-team test suite plants injection attempts in every imported text field and must pass before each release.", "ac": 3, "type": "Security"}]}, {"key": "TEID-126", "epic": "TEID-90", "summary": "Evaluation suite for AI features", "desc": "As a Teideal engineer, I want measured accuracy for every AI feature before and after each change, so that quality never silently drops when we change a model or prompt.", "priority": "Highest", "points": 5, "release": "mvp", "area": "ai-governance", "ac": ["Each AI feature has a test set of realistic cases with expected results and a minimum pass rate agreed before launch.", "The evaluation runs automatically whenever a model, prompt or retrieval method changes.", "A change that lowers the score below the minimum is blocked.", "Results are kept over time so trends are visible."], "provisional": true, "order": 63, "tests": [{"id": "TEID-126-T1", "title": "Verify that each AI feature has a test set of realistic cases with expected results and a minimum pass rate agreed before launch.", "ac": 1, "type": "Functional"}, {"id": "TEID-126-T2", "title": "Verify that the evaluation runs automatically whenever a model, prompt or retrieval method changes.", "ac": 2, "type": "Resilience"}, {"id": "TEID-126-T3", "title": "Verify that a change that lowers the score below the minimum is blocked.", "ac": 3, "type": "Functional"}, {"id": "TEID-126-T4", "title": "Verify that results are kept over time so trends are visible.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-127", "epic": "TEID-90", "summary": "Tenant controls for AI features", "desc": "As a account owner, I want to switch AI features on or off for my organisation, so that we can meet our own internal AI policies.", "priority": "High", "points": 2, "release": "mvp", "area": "ai-governance", "ac": ["An Owner can enable or disable AI features for the tenant, individually or all together.", "When disabled, no tenant data is sent to any AI model provider.", "AI usage per feature is visible to the Owner."], "provisional": true, "order": 64, "tests": [{"id": "TEID-127-T1", "title": "Verify that an Owner can enable or disable AI features for the tenant, individually or all together.", "ac": 1, "type": "Functional"}, {"id": "TEID-127-T2", "title": "Verify that when disabled, no tenant data is sent to any AI model provider.", "ac": 2, "type": "Functional"}, {"id": "TEID-127-T3", "title": "Verify that AI usage per feature is visible to the Owner.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-45", "epic": "TEID-6", "summary": "Customer timeline", "desc": "As a support agent, I want a single timeline of everything that affected a customer's balance, so that I can answer billing questions in minutes without engineering.\n\n*Context*\n", "priority": "Highest", "points": 8, "release": "mvp", "area": "visibility", "ac": ["The timeline shows grants, usage (grouped by hour, expandable to single events), reservations, adjustments, invoices and configuration changes.", "It can be filtered by date range, metric, model, team and API key.", "From any invoice line, the user can drill down to the ledger entries and usage events behind it.", "The timeline loads in under 3 seconds for a customer with 1 million events in the current period."], "order": 65, "tests": [{"id": "TEID-45-T1", "title": "Verify that the timeline shows grants, usage (grouped by hour, expandable to single events), reservations, adjustments, invoices and configuration changes.", "ac": 1, "type": "Functional"}, {"id": "TEID-45-T2", "title": "Verify that it can be filtered by date range, metric, model, team and API key.", "ac": 2, "type": "Functional"}, {"id": "TEID-45-T3", "title": "Verify that from any invoice line, the user can drill down to the ledger entries and usage events behind it.", "ac": 3, "type": "Functional"}, {"id": "TEID-45-T4", "title": "Verify that the timeline loads in under 3 seconds for a customer with 1 million events in the current period.", "ac": 4, "type": "Performance"}]}, {"key": "TEID-47", "epic": "TEID-6", "summary": "Balance threshold alerts", "desc": "As a billing operator, I want alerts when a customer's balance or commit reaches levels I choose, so that we can warn customers and start sales conversations before they run out.\n\n*Context*\n", "priority": "High", "points": 5, "release": "mvp", "area": "visibility", "ac": ["Thresholds can be set per plan or customer; the default is 50%, 80% and 100% of balance or commit used.", "Each threshold alert fires only once per period per customer.", "Alerts can go to operators by email and Slack, and optionally to the end customer by email.", "The alert says the customer, threshold reached, remaining balance and projected run-out date."], "order": 66, "tests": [{"id": "TEID-47-T1", "title": "Verify that thresholds can be set per plan or customer; the default is 50%, 80% and 100% of balance or commit used.", "ac": 1, "type": "Functional"}, {"id": "TEID-47-T2", "title": "Verify that each threshold alert fires only once per period per customer.", "ac": 2, "type": "Functional"}, {"id": "TEID-47-T3", "title": "Verify that alerts can go to operators by email and Slack, and optionally to the end customer by email.", "ac": 3, "type": "Functional"}, {"id": "TEID-47-T4", "title": "Verify that the alert says the customer, threshold reached, remaining balance and projected run-out date.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-48", "epic": "TEID-6", "summary": "Webhooks for billing events", "desc": "As a developer at our customer, I want webhooks for important billing events, so that I can trigger my own emails, in-app messages and upsell flows.\n\n*Context*\nEvents: threshold reached, balance depleted, grant expiring soon, grant expired, reservation overrun, reconciliation mismatch, customer suspended.", "priority": "High", "points": 5, "release": "mvp", "area": "visibility", "ac": ["Each webhook is signed so the receiver can verify it came from us.", "Failed deliveries are retried with increasing delays for at least 24 hours.", "A delivery log shows every attempt and its response, and any webhook can be resent manually.", "Each webhook has a unique ID so receivers can ignore duplicates."], "order": 67, "tests": [{"id": "TEID-48-T1", "title": "Verify that each webhook is signed so the receiver can verify it came from us.", "ac": 1, "type": "Functional"}, {"id": "TEID-48-T2", "title": "Verify that failed deliveries are retried with increasing delays for at least 24 hours.", "ac": 2, "type": "Resilience"}, {"id": "TEID-48-T3", "title": "Verify that a delivery log shows every attempt and its response, and any webhook can be resent manually.", "ac": 3, "type": "Functional"}, {"id": "TEID-48-T4", "title": "Verify that each webhook has a unique ID so receivers can ignore duplicates.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-50", "epic": "TEID-6", "summary": "Period close summary for finance", "desc": "As a finance lead, I want a summary at the end of each billing period, so that month-end close takes hours instead of a week.\n\n*Context*\n", "priority": "High", "points": 5, "release": "mvp", "area": "visibility", "ac": ["The summary shows per customer: usage billed, credits consumed by source, commit drawn down, overage, expired credits and adjustments.", "Totals tie exactly to the ledger and to the Stripe reconciliation report.", "It can be exported as CSV and Excel."], "order": 68, "tests": [{"id": "TEID-50-T1", "title": "Verify that the summary shows per customer: usage billed, credits consumed by source, commit drawn down, overage, expired credits and adjustments.", "ac": 1, "type": "Functional"}, {"id": "TEID-50-T2", "title": "Verify that totals tie exactly to the ledger and to the Stripe reconciliation report.", "ac": 2, "type": "Functional"}, {"id": "TEID-50-T3", "title": "Verify that it can be exported as CSV and Excel.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-74", "epic": "TEID-12", "summary": "Ledger independent of any processor", "desc": "As a founder, I want our ledger and history to use Teideal's own identifiers, with processor IDs stored only as references, so that changing payment processor never breaks our revenue history.\n\n*Context*\n", "priority": "High", "points": 5, "release": "mvp", "area": "neutrality", "ac": ["Every customer, invoice and payment has a Teideal identifier; processor identifiers are stored as references only.", "Disconnecting a processor leaves the full ledger and history intact and readable.", "An automated test removes a processor connection and confirms all balances and reports are unchanged."], "order": 69, "tests": [{"id": "TEID-74-T1", "title": "Verify that every customer, invoice and payment has a Teideal identifier; processor identifiers are stored as references only.", "ac": 1, "type": "Functional"}, {"id": "TEID-74-T2", "title": "Verify that disconnecting a processor leaves the full ledger and history intact and readable.", "ac": 2, "type": "Functional"}, {"id": "TEID-74-T3", "title": "Verify that an automated test removes a processor connection and confirms all balances and reports are unchanged.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-106", "epic": "TEID-87", "summary": "Independent penetration test", "desc": "As a security reviewer at our customer, I want evidence that an independent firm has tested Teideal, so that we can approve Teideal for production use.", "priority": "Highest", "points": 3, "release": "mvp", "area": "security", "ac": ["An independent firm tests the console, APIs, connectors and tenant isolation before the first design partner goes live.", "All critical and high findings are fixed and retested before go-live.", "A summary letter is available to customers under NDA.", "The test is repeated at least yearly and after major architecture changes."], "provisional": true, "order": 70, "tests": [{"id": "TEID-106-T1", "title": "Verify that an independent firm tests the console, APIs, connectors and tenant isolation before the first design partner goes live.", "ac": 1, "type": "Security"}, {"id": "TEID-106-T2", "title": "Verify that all critical and high findings are fixed and retested before go-live.", "ac": 2, "type": "Functional"}, {"id": "TEID-106-T3", "title": "Verify that a summary letter is available to customers under NDA.", "ac": 3, "type": "Functional"}, {"id": "TEID-106-T4", "title": "Verify that the test is repeated at least yearly and after major architecture changes.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-108", "epic": "TEID-87", "summary": "Trust centre and security questionnaire pack", "desc": "As a founder, I want ready answers to standard security questionnaires and a public trust page, so that security reviews take days rather than weeks.", "priority": "High", "points": 3, "release": "mvp", "area": "security", "ac": ["A public trust page lists certifications, sub-processors, security practices and status.", "A standard questionnaire (for example SIG Lite or CAIQ) is completed and kept current.", "An architecture and data-flow document is available under NDA.", "Answers are reviewed at least quarterly."], "provisional": true, "order": 71, "tests": [{"id": "TEID-108-T1", "title": "Verify that a public trust page lists certifications, sub-processors, security practices and status.", "ac": 1, "type": "Functional"}, {"id": "TEID-108-T2", "title": "Verify that a standard questionnaire (for example SIG Lite or CAIQ) is completed and kept current.", "ac": 2, "type": "Functional"}, {"id": "TEID-108-T3", "title": "Verify that an architecture and data-flow document is available under NDA.", "ac": 3, "type": "Functional"}, {"id": "TEID-108-T4", "title": "Verify that answers are reviewed at least quarterly.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-120", "epic": "TEID-89", "summary": "Disaster recovery plan and drill", "desc": "As a founder, I want a tested plan for losing a whole cloud region, so that a major outage does not become a permanent one.", "priority": "High", "points": 5, "release": "mvp", "area": "reliability", "ac": ["A written plan covers loss of a cloud region, loss of the main database and loss of a key provider.", "A full recovery drill is completed before the first design partner goes live and at least yearly after that.", "Drill results, including actual recovery time and data loss, are recorded and gaps are tracked to closure."], "provisional": true, "order": 72, "tests": [{"id": "TEID-120-T1", "title": "Verify that a written plan covers loss of a cloud region, loss of the main database and loss of a key provider.", "ac": 1, "type": "Functional"}, {"id": "TEID-120-T2", "title": "Verify that a full recovery drill is completed before the first design partner goes live and at least yearly after that.", "ac": 2, "type": "Resilience"}, {"id": "TEID-120-T3", "title": "Verify that drill results, including actual recovery time and data loss, are recorded and gaps are tracked to closure.", "ac": 3, "type": "Resilience"}]}, {"key": "TEID-122", "epic": "TEID-89", "summary": "Status page and incident communication", "desc": "As a account owner, I want honest, timely updates when Teideal has a problem, so that I can tell my own team and customers what is happening.", "priority": "High", "points": 3, "release": "mvp", "area": "reliability", "ac": ["A public status page shows the health of the ingestion API, Verify syncs, console and connectors.", "During a major incident, the status page is updated at least every 30 minutes.", "A written post-incident report is shared with affected customers within 5 business days."], "provisional": true, "order": 73, "tests": [{"id": "TEID-122-T1", "title": "Verify that a public status page shows the health of the ingestion API, Verify syncs, console and connectors.", "ac": 1, "type": "Functional"}, {"id": "TEID-122-T2", "title": "Verify that during a major incident, the status page is updated at least every 30 minutes.", "ac": 2, "type": "Functional"}, {"id": "TEID-122-T3", "title": "Verify that a written post-incident report is shared with affected customers within 5 business days.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-73", "epic": "TEID-11", "summary": "First findings within 48 hours", "desc": "As a founder evaluating Teideal, I want to see real findings from my own historical data within two days of connecting, so that I can judge the value of Teideal quickly and with no risk.\n\n*Context*\n", "priority": "High", "points": 5, "release": "mvp", "area": "verify", "ac": ["A guided setup connects a billing system, a usage source and contract terms in one session.", "Using historical data, Teideal produces a first findings summary within 48 hours of setup being completed.", "The summary states clearly which parts of revenue were and were not covered, so results are not overstated."], "order": 74, "tests": [{"id": "TEID-73-T1", "title": "Verify that a guided setup connects a billing system, a usage source and contract terms in one session.", "ac": 1, "type": "Functional"}, {"id": "TEID-73-T2", "title": "Verify that using historical data, Teideal produces a first findings summary within 48 hours of setup being completed.", "ac": 2, "type": "Functional"}, {"id": "TEID-73-T3", "title": "Verify that the summary states clearly which parts of revenue were and were not covered, so results are not overstated.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-93", "epic": "TEID-5", "summary": "SAML single sign-on and SCIM user provisioning", "desc": "As a IT administrator at an enterprise customer, I want users to sign in through our identity provider and be added or removed automatically, so that leavers lose access immediately and we meet our security policy.\n\n*Context*\nCommon enterprise security requirement; can follow the first design partners if none require it.", "priority": "Medium", "points": 8, "release": "phase-2", "area": "security", "ac": ["An Owner can configure SAML single sign-on with Okta, Microsoft Entra ID and Google Workspace.", "When SSO is enforced, password sign-in is disabled for everyone except a designated break-glass Owner account.", "SCIM provisioning creates, updates and deactivates users and assigns roles from identity-provider groups.", "A user deactivated in the identity provider loses access within 5 minutes."], "provisional": true, "order": 75, "tests": [{"id": "TEID-93-T1", "title": "Verify that an Owner can configure SAML single sign-on with Okta, Microsoft Entra ID and Google Workspace.", "ac": 1, "type": "Functional"}, {"id": "TEID-93-T2", "title": "Verify that when SSO is enforced, password sign-in is disabled for everyone except a designated break-glass Owner account.", "ac": 2, "type": "Functional"}, {"id": "TEID-93-T3", "title": "Verify that SCIM provisioning creates, updates and deactivates users and assigns roles from identity-provider groups.", "ac": 3, "type": "Functional"}, {"id": "TEID-93-T4", "title": "Verify that a user deactivated in the identity provider loses access within 5 minutes.", "ac": 4, "type": "Performance"}]}, {"key": "TEID-36", "epic": "TEID-3", "summary": "Backfill historical usage", "desc": "As a billing operator, I want to upload historical usage from a file and preview its effect before applying it, so that I can migrate or correct history safely.\n\n*Context*\n", "priority": "Medium", "points": 5, "release": "phase-2", "area": "ledger", "ac": ["An operator can upload a CSV or JSON file of usage events.", "A preview shows the number of events, affected customers and change in balances or invoices before anything is applied.", "Applying the backfill follows the same idempotency rules, so uploading the same file twice has no extra effect.", "Rows with errors are listed with reasons and can be downloaded, fixed and re-uploaded."], "order": 76, "tests": [{"id": "TEID-36-T1", "title": "Verify that an operator can upload a CSV or JSON file of usage events.", "ac": 1, "type": "Performance"}, {"id": "TEID-36-T2", "title": "Verify that a preview shows the number of events, affected customers and change in balances or invoices before anything is applied.", "ac": 2, "type": "Functional"}, {"id": "TEID-36-T3", "title": "Verify that applying the backfill follows the same idempotency rules, so uploading the same file twice has no extra effect.", "ac": 3, "type": "Performance"}, {"id": "TEID-36-T4", "title": "Verify that rows with errors are listed with reasons and can be downloaded, fixed and re-uploaded.", "ac": 4, "type": "Performance"}]}, {"key": "TEID-83", "epic": "TEID-14", "summary": "Self-hosted deployment", "desc": "As a platform engineer at our customer, I want to run the open-source core in my own environment, so that our billing data can stay inside our infrastructure.\n\n*Context*\n", "priority": "Medium", "points": 8, "release": "phase-2", "area": "open-source", "ac": ["The core can be started locally with a single command.", "A production deployment guide covers storage, backups, upgrades and monitoring.", "Given the same inputs, self-hosted and hosted Teideal produce identical results."], "order": 77, "tests": [{"id": "TEID-83-T1", "title": "Verify that the core can be started locally with a single command.", "ac": 1, "type": "Functional"}, {"id": "TEID-83-T2", "title": "Verify that a production deployment guide covers storage, backups, upgrades and monitoring.", "ac": 2, "type": "Resilience"}, {"id": "TEID-83-T3", "title": "Verify that given the same inputs, self-hosted and hosted Teideal produce identical results.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-21", "epic": "TEID-1", "summary": "Hard and soft spending caps", "desc": "As a billing operator, I want to set hard caps that block usage and soft caps that only warn, so that customers never overspend beyond what they agreed, and we never block usage they are allowed.\n\n*Context*\nCaps can be set in currency or credits, per billing period, at org, team or API key level.", "priority": "Medium", "points": 5, "release": "phase-2", "area": "entitlement-model", "ac": ["A hard cap causes entitlement checks to be denied with the reason 'hard cap reached' once reached.", "A soft cap allows usage to continue and triggers the configured alert and webhook.", "Caps can be set at organisation, team and API key level.", "Caps reset at the start of each billing period unless configured as lifetime caps."], "order": 78, "tests": [{"id": "TEID-21-T1", "title": "Verify that a hard cap causes entitlement checks to be denied with the reason 'hard cap reached' once reached.", "ac": 1, "type": "Functional"}, {"id": "TEID-21-T2", "title": "Verify that a soft cap allows usage to continue and triggers the configured alert and webhook.", "ac": 2, "type": "Functional"}, {"id": "TEID-21-T3", "title": "Verify that caps can be set at organisation, team and API key level.", "ac": 3, "type": "Functional"}, {"id": "TEID-21-T4", "title": "Verify that caps reset at the start of each billing period unless configured as lifetime caps.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-39", "epic": "TEID-4", "summary": "Send period usage and overage to Stripe invoices", "desc": "As a finance lead, I want usage and overage charges added to the customer's Stripe invoice at period close, so that customers receive one accurate invoice.\n\n*Context*\n", "priority": "Medium", "points": 8, "release": "phase-2", "area": "stripe", "ac": ["At period close, usage and overage totals are written to the customer's Stripe invoice as line items.", "Each line item includes a reference that links back to the ledger entries behind it.", "If the write to Stripe is retried, no duplicate line items are created.", "If Stripe is unavailable, the write is retried automatically and the operator is alerted if it has not succeeded within 1 hour."], "order": 79, "tests": [{"id": "TEID-39-T1", "title": "Verify that at period close, usage and overage totals are written to the customer's Stripe invoice as line items.", "ac": 1, "type": "Functional"}, {"id": "TEID-39-T2", "title": "Verify that each line item includes a reference that links back to the ledger entries behind it.", "ac": 2, "type": "Functional"}, {"id": "TEID-39-T3", "title": "Verify that if the write to Stripe is retried, no duplicate line items are created.", "ac": 3, "type": "Resilience"}, {"id": "TEID-39-T4", "title": "Verify that if Stripe is unavailable, the write is retried automatically and the operator is alerted if it has not succeeded within 1 hour.", "ac": 4, "type": "Resilience"}]}, {"key": "TEID-40", "epic": "TEID-4", "summary": "Credit purchases in Stripe grant credits", "desc": "As a billing operator, I want credits granted automatically when a customer pays for a credit pack in Stripe, so that self-serve customers can top up without manual work.\n\n*Context*\n", "priority": "Medium", "points": 5, "release": "phase-2", "area": "stripe", "ac": ["A successful Stripe payment for a credit product creates the matching grant exactly once, even if Stripe sends the notification several times.", "A refund in Stripe creates a reversing entry for the unused portion of the grant, and flags for review any credit already consumed.", "A failed or disputed payment never creates a grant."], "order": 80, "tests": [{"id": "TEID-40-T1", "title": "Verify that a successful Stripe payment for a credit product creates the matching grant exactly once, even if Stripe sends the notification several times.", "ac": 1, "type": "Functional"}, {"id": "TEID-40-T2", "title": "Verify that a refund in Stripe creates a reversing entry for the unused portion of the grant, and flags for review any credit already consumed.", "ac": 2, "type": "Functional"}, {"id": "TEID-40-T3", "title": "Verify that a failed or disputed payment never creates a grant.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-61", "epic": "TEID-9", "summary": "Test clocks", "desc": "As a developer at our customer, I want to move time forward in the sandbox, so that I can test renewals, expiries, commit exhaustion and period close in minutes.\n\n*Context*\n", "priority": "Medium", "points": 8, "release": "phase-2", "area": "developer-experience", "ac": ["A test clock can be created and advanced to any future date in the sandbox.", "Advancing the clock triggers everything that would happen in that time: recurring grants, expiries, period close and invoices.", "Results match exactly what production would do for the same inputs."], "order": 81, "tests": [{"id": "TEID-61-T1", "title": "Verify that a test clock can be created and advanced to any future date in the sandbox.", "ac": 1, "type": "Functional"}, {"id": "TEID-61-T2", "title": "Verify that advancing the clock triggers everything that would happen in that time: recurring grants, expiries, period close and invoices.", "ac": 2, "type": "Functional"}, {"id": "TEID-61-T3", "title": "Verify that results match exactly what production would do for the same inputs.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-116", "epic": "TEID-88", "summary": "Choose data hosting region", "desc": "As a account owner, I want to choose where our data is stored, so that we meet our own customers' data-residency requirements.\n\n*Context*\nMVP launches in one region; this story adds a choice of regions.", "priority": "Medium", "points": 13, "release": "phase-2", "area": "privacy", "ac": ["At sign-up, the Owner chooses a hosting region from those offered (initially US and EU, others by demand).", "All tenant data, including backups, stays in the chosen region.", "The console shows the tenant's region, and the trust page lists which sub-processors operate in each region."], "provisional": true, "order": 82, "tests": [{"id": "TEID-116-T1", "title": "Verify that at sign-up, the Owner chooses a hosting region from those offered (initially US and EU, others by demand).", "ac": 1, "type": "Functional"}, {"id": "TEID-116-T2", "title": "Verify that all tenant data, including backups, stays in the chosen region.", "ac": 2, "type": "Resilience"}, {"id": "TEID-116-T3", "title": "Verify that the console shows the tenant's region, and the trust page lists which sub-processors operate in each region.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-46", "epic": "TEID-6", "summary": "Plain-English charge explanation", "desc": "As a support agent, I want to select any invoice line and get a plain-English explanation of how it was calculated, so that I can reply to a disputed invoice quickly and accurately.\n\n*Context*\nThe explanation is generated from ledger data only and must link to the entries it is based on.", "priority": "Medium", "points": 5, "release": "phase-2", "area": "visibility", "ac": ["Selecting an invoice line produces an explanation covering quantity, rates, plan version, grants consumed and any overrides.", "Every figure in the explanation links to the ledger entries it came from.", "If the explanation cannot be fully supported by ledger data, it says so rather than guessing.", "The explanation can be copied into a customer reply."], "order": 83, "tests": [{"id": "TEID-46-T1", "title": "Verify that selecting an invoice line produces an explanation covering quantity, rates, plan version, grants consumed and any overrides.", "ac": 1, "type": "Functional"}, {"id": "TEID-46-T2", "title": "Verify that every figure in the explanation links to the ledger entries it came from.", "ac": 2, "type": "Functional"}, {"id": "TEID-46-T3", "title": "Verify that if the explanation cannot be fully supported by ledger data, it says so rather than guessing.", "ac": 3, "type": "Functional"}, {"id": "TEID-46-T4", "title": "Verify that the explanation can be copied into a customer reply.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-75", "epic": "TEID-12", "summary": "Payment processor connector interface", "desc": "As a billing operator, I want Teideal to support more than one payment processor through a common interface, so that I can use the processor that suits my business and markets.\n\n*Context*\nStripe first. The second processor is chosen by design-partner demand (for example Adyen, or a regional processor).", "priority": "Medium", "points": 13, "release": "phase-2", "area": "neutrality", "ac": ["A documented connector interface covers customers, payment methods, charges, refunds and disputes.", "Stripe and at least one additional processor are supported.", "The same pricing and ledger behaviour produces identical results whichever processor collects payment."], "order": 84, "tests": [{"id": "TEID-75-T1", "title": "Verify that a documented connector interface covers customers, payment methods, charges, refunds and disputes.", "ac": 1, "type": "Functional"}, {"id": "TEID-75-T2", "title": "Verify that stripe and at least one additional processor are supported.", "ac": 2, "type": "Functional"}, {"id": "TEID-75-T3", "title": "Verify that the same pricing and ledger behaviour produces identical results whichever processor collects payment.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-76", "epic": "TEID-12", "summary": "Move a customer between processors", "desc": "As a billing operator, I want to move a customer from one processor to another without losing balances or history, so that processor changes do not disrupt customers.\n\n*Context*\n", "priority": "Medium", "points": 8, "release": "phase-2", "area": "neutrality", "ac": ["An operator can move a customer to another connected processor from a chosen date.", "Balances, grants, commits and history carry over unchanged.", "Payments before and after the move are shown in one continuous timeline."], "order": 85, "tests": [{"id": "TEID-76-T1", "title": "Verify that an operator can move a customer to another connected processor from a chosen date.", "ac": 1, "type": "Functional"}, {"id": "TEID-76-T2", "title": "Verify that balances, grants, commits and history carry over unchanged.", "ac": 2, "type": "Functional"}, {"id": "TEID-76-T3", "title": "Verify that payments before and after the move are shown in one continuous timeline.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-24", "epic": "TEID-2", "summary": "Entitlement check API", "desc": "As a developer at our customer, I want a single API call that tells me whether a request is allowed before I run it, so that I can enforce plans and balances on every request without building my own logic.\n\n*Context*\nThis sits on the customer's hot path, so speed and clarity of the answer matter more than anything else.", "priority": "Medium", "points": 8, "release": "phase-2", "area": "authorization", "ac": ["The call takes: customer or API key, metric, and an estimated quantity; it returns allow or deny, a reason code and the remaining balance.", "Deny reasons are drawn from a fixed, documented list: insufficient balance, hard cap reached, rate limited, suspended, unknown customer.", "At a sustained 5,000 checks per second, 99% of responses return in under 20 milliseconds from the same cloud region.", "Repeating a check with the same request ID returns the same answer and does not change any balance.", "Every check is logged with its outcome so support can see why a request was denied."], "order": 86, "tests": [{"id": "TEID-24-T1", "title": "Verify that the call takes: customer or API key, metric, and an estimated quantity; it returns allow or deny, a reason code and the remaining balance.", "ac": 1, "type": "Functional"}, {"id": "TEID-24-T2", "title": "Verify that deny reasons are drawn from a fixed, documented list: insufficient balance, hard cap reached, rate limited, suspended, unknown customer.", "ac": 2, "type": "Functional"}, {"id": "TEID-24-T3", "title": "Verify that at a sustained 5,000 checks per second, 99% of responses return in under 20 milliseconds from the same cloud region.", "ac": 3, "type": "Performance"}, {"id": "TEID-24-T4", "title": "Verify that repeating a check with the same request ID returns the same answer and does not change any balance.", "ac": 4, "type": "Functional"}, {"id": "TEID-24-T5", "title": "Verify that every check is logged with its outcome so support can see why a request was denied.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-25", "epic": "TEID-2", "summary": "Reserve, draw down and settle for streaming and long jobs", "desc": "As a developer at our customer, I want to reserve an estimated amount before a streaming or long-running job, draw it down as the job runs, and settle the real cost at the end, so that long jobs don't fail halfway and customers can't overspend mid-stream.\n\n*Context*\nAn LLM stream or agent run can cost 200 tokens or 200,000; the true cost is only known at the end.", "priority": "Medium", "points": 13, "release": "phase-2", "area": "authorization", "ac": ["A reservation immediately reduces the customer's available balance by the reserved amount.", "The integrator can draw down against a reservation in increments while the job runs.", "Settling records the actual amount used and releases any unused part of the reservation back to the balance.", "A reservation that is not settled within its time limit (default 1 hour, configurable) is automatically released and a ledger entry records it.", "Settling the same reservation twice has no additional effect."], "order": 87, "tests": [{"id": "TEID-25-T1", "title": "Verify that a reservation immediately reduces the customer's available balance by the reserved amount.", "ac": 1, "type": "Functional"}, {"id": "TEID-25-T2", "title": "Verify that the integrator can draw down against a reservation in increments while the job runs.", "ac": 2, "type": "Functional"}, {"id": "TEID-25-T3", "title": "Verify that settling records the actual amount used and releases any unused part of the reservation back to the balance.", "ac": 3, "type": "Functional"}, {"id": "TEID-25-T4", "title": "Verify that a reservation that is not settled within its time limit (default 1 hour, configurable) is automatically released and a ledger entry records it.", "ac": 4, "type": "Functional"}, {"id": "TEID-25-T5", "title": "Verify that settling the same reservation twice has no additional effect.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-26", "epic": "TEID-2", "summary": "Overrun policy for jobs that exceed their reservation", "desc": "As a billing operator, I want to choose, per plan or customer, what happens when a job uses more than it reserved, so that important customers' jobs are never killed while free-tier jobs can be stopped.\n\n*Context*\nOptions: extend the reservation automatically, let the job finish and bill overage, or stop the job gracefully.", "priority": "Medium", "points": 5, "release": "phase-2", "area": "authorization", "ac": ["An operator can choose 'extend', 'finish and bill overage' or 'stop gracefully' per plan, and override it per customer.", "The default for enterprise plans is 'finish and bill overage'.", "With 'stop gracefully', the integrator receives a clear stop signal and a configurable grace amount before usage is refused.", "Every overrun is recorded and triggers the overrun webhook."], "order": 88, "tests": [{"id": "TEID-26-T1", "title": "Verify that an operator can choose 'extend', 'finish and bill overage' or 'stop gracefully' per plan, and override it per customer.", "ac": 1, "type": "Functional"}, {"id": "TEID-26-T2", "title": "Verify that the default for enterprise plans is 'finish and bill overage'.", "ac": 2, "type": "Functional"}, {"id": "TEID-26-T3", "title": "Verify that with 'stop gracefully', the integrator receives a clear stop signal and a configurable grace amount before usage is refused.", "ac": 3, "type": "Functional"}, {"id": "TEID-26-T4", "title": "Verify that every overrun is recorded and triggers the overrun webhook.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-27", "epic": "TEID-2", "summary": "Safe behaviour when the entitlement service is unavailable", "desc": "As a billing operator, I want to decide, per plan, whether requests are allowed or denied when the entitlement service cannot be reached, so that our outage never takes down our customers' enterprise traffic.\n\n*Context*\nThe SDK keeps a recent copy of each customer's entitlements locally so it can decide without a network call.", "priority": "Medium", "points": 13, "release": "phase-2", "area": "authorization", "ac": ["An operator can set each plan to 'allow', 'deny', or 'allow up to a spending limit' when the service is unreachable.", "In degraded mode the SDK uses its cached entitlements and records usage locally.", "When the service recovers, locally recorded usage is sent and applied exactly once.", "Usage served in degraded mode is marked as such in the ledger and summarised for the operator after recovery.", "The 'allow up to a spending limit' option never allows more than the configured amount per customer during an outage."], "order": 89, "tests": [{"id": "TEID-27-T1", "title": "Verify that an operator can set each plan to 'allow', 'deny', or 'allow up to a spending limit' when the service is unreachable.", "ac": 1, "type": "Resilience"}, {"id": "TEID-27-T2", "title": "Verify that in degraded mode the SDK uses its cached entitlements and records usage locally.", "ac": 2, "type": "Functional"}, {"id": "TEID-27-T3", "title": "Verify that when the service recovers, locally recorded usage is sent and applied exactly once.", "ac": 3, "type": "Resilience"}, {"id": "TEID-27-T4", "title": "Verify that usage served in degraded mode is marked as such in the ledger and summarised for the operator after recovery.", "ac": 4, "type": "Resilience"}, {"id": "TEID-27-T5", "title": "Verify that the 'allow up to a spending limit' option never allows more than the configured amount per customer during an outage.", "ac": 5, "type": "Resilience"}]}, {"key": "TEID-28", "epic": "TEID-2", "summary": "Rate and concurrency limits", "desc": "As a billing operator, I want to limit requests per second and simultaneous jobs per customer, separately from their balance, so that one customer cannot monopolise our GPU capacity even when they have plenty of credit.\n\n*Context*\n", "priority": "Medium", "points": 5, "release": "phase-2", "area": "authorization", "ac": ["An operator can set requests-per-second and maximum concurrent reservations per plan, customer, team or API key.", "A request over the limit is denied with the reason 'rate limited' and a suggested retry time.", "Limits apply independently of balance: a customer with credit can still be rate limited.", "Limit changes take effect within 10 seconds."], "order": 90, "tests": [{"id": "TEID-28-T1", "title": "Verify that an operator can set requests-per-second and maximum concurrent reservations per plan, customer, team or API key.", "ac": 1, "type": "Functional"}, {"id": "TEID-28-T2", "title": "Verify that a request over the limit is denied with the reason 'rate limited' and a suggested retry time.", "ac": 2, "type": "Resilience"}, {"id": "TEID-28-T3", "title": "Verify that limits apply independently of balance: a customer with credit can still be rate limited.", "ac": 3, "type": "Functional"}, {"id": "TEID-28-T4", "title": "Verify that limit changes take effect within 10 seconds.", "ac": 4, "type": "Performance"}]}, {"key": "TEID-29", "epic": "TEID-2", "summary": "Suspend a customer or key immediately", "desc": "As a billing operator, I want to suspend a customer, team or API key with one action, so that I can stop abuse or unpaid usage straight away.\n\n*Context*\n", "priority": "Medium", "points": 3, "release": "phase-2", "area": "authorization", "ac": ["An operator can suspend and unsuspend at organisation, team or API key level, with a mandatory reason.", "A suspension takes effect for all new checks within 5 seconds.", "Suspended entities are denied with the reason 'suspended'.", "Suspensions and their reasons appear in the audit log and the customer ti
