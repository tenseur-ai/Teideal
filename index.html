meline."], "order": 91, "tests": [{"id": "TEID-29-T1", "title": "Verify that an operator can suspend and unsuspend at organisation, team or API key level, with a mandatory reason.", "ac": 1, "type": "Functional"}, {"id": "TEID-29-T2", "title": "Verify that a suspension takes effect for all new checks within 5 seconds.", "ac": 2, "type": "Performance"}, {"id": "TEID-29-T3", "title": "Verify that suspended entities are denied with the reason 'suspended'.", "ac": 3, "type": "Functional"}, {"id": "TEID-29-T4", "title": "Verify that suspensions and their reasons appear in the audit log and the customer timeline.", "ac": 4, "type": "Security"}]}, {"key": "TEID-63", "epic": "TEID-10", "summary": "Run in shadow mode", "desc": "As a founder evaluating Teideal, I want to send all my usage to Teideal without it enforcing anything or writing to Stripe, so that I can evaluate it with zero risk to my business.\n\n*Context*\n", "priority": "Medium", "points": 5, "release": "phase-2", "area": "shadow-mode", "ac": ["An account can be set to shadow mode, in which entitlement checks are recorded but always return 'allow'.", "In shadow mode nothing is ever written to Stripe.", "Shadow mode is clearly shown throughout the console.", "Switching out of shadow mode requires the Owner role and a confirmation."], "order": 92, "tests": [{"id": "TEID-63-T1", "title": "Verify that an account can be set to shadow mode, in which entitlement checks are recorded but always return 'allow'.", "ac": 1, "type": "Functional"}, {"id": "TEID-63-T2", "title": "Verify that in shadow mode nothing is ever written to Stripe.", "ac": 2, "type": "Functional"}, {"id": "TEID-63-T3", "title": "Verify that shadow mode is clearly shown throughout the console.", "ac": 3, "type": "Functional"}, {"id": "TEID-63-T4", "title": "Verify that switching out of shadow mode requires the Owner role and a confirmation.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-64", "epic": "TEID-10", "summary": "Gradual go-live with rollback", "desc": "As a founder, I want to move one group of customers at a time from shadow mode to live enforcement, with a quick way back, so that I can go live safely, starting with low-risk customers.\n\n*Context*\nTypical path: self-serve customers first, enterprise afterwards.", "priority": "Medium", "points": 5, "release": "phase-2", "area": "shadow-mode", "ac": ["An operator can choose which plans or customers move to live enforcement.", "Each group can be returned to shadow mode within 1 minute if problems appear.", "The console shows which customers are live and which are in shadow mode.", "All go-live and rollback actions are recorded in the audit log."], "order": 93, "tests": [{"id": "TEID-64-T1", "title": "Verify that an operator can choose which plans or customers move to live enforcement.", "ac": 1, "type": "Functional"}, {"id": "TEID-64-T2", "title": "Verify that each group can be returned to shadow mode within 1 minute if problems appear.", "ac": 2, "type": "Functional"}, {"id": "TEID-64-T3", "title": "Verify that the console shows which customers are live and which are in shadow mode.", "ac": 3, "type": "Functional"}, {"id": "TEID-64-T4", "title": "Verify that all go-live and rollback actions are recorded in the audit log.", "ac": 4, "type": "Security"}]}, {"key": "TEID-78", "epic": "TEID-13", "summary": "Import customers, contracts and balances", "desc": "As a billing operator, I want to import customers, plans, contracts and current balances from my existing billing platform, so that Teideal starts from exactly the same position as today.\n\n*Context*\nVerify customers will already have much of this data connected.", "priority": "Medium", "points": 8, "release": "phase-2", "area": "migration", "ac": ["Import is supported from any system connected in TEID-65, and from files.", "Imported balances are recorded as clearly labelled opening ledger entries.", "A preview shows totals per customer before import, and the import can be rolled back before go-live.", "Anything that could not be imported is listed with the reason."], "order": 94, "tests": [{"id": "TEID-78-T1", "title": "Verify that import is supported from any system connected in TEID-65, and from files.", "ac": 1, "type": "Functional"}, {"id": "TEID-78-T2", "title": "Verify that imported balances are recorded as clearly labelled opening ledger entries.", "ac": 2, "type": "Functional"}, {"id": "TEID-78-T3", "title": "Verify that a preview shows totals per customer before import, and the import can be rolled back before go-live.", "ac": 3, "type": "Functional"}, {"id": "TEID-78-T4", "title": "Verify that anything that could not be imported is listed with the reason.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-79", "epic": "TEID-13", "summary": "AI-assisted plan mapping", "desc": "As a billing operator, I want Teideal to suggest how my existing plans and contracts map to Teideal plans, so that migration takes days instead of weeks.\n\n*Context*\nSuggestions only; nothing is applied without an operator's confirmation.", "priority": "Medium", "points": 8, "release": "phase-2", "area": "migration", "ac": ["For each imported plan or contract, Teideal proposes an equivalent plan configuration with an explanation.", "The operator must confirm or edit every suggestion before it is saved.", "Constructs that cannot be represented exactly are flagged and never silently approximated.", "After mapping, re-rating (TEID-68) of recent history shows whether the mapped plans reproduce past invoices."], "order": 95, "tests": [{"id": "TEID-79-T1", "title": "Verify that for each imported plan or contract, Teideal proposes an equivalent plan configuration with an explanation.", "ac": 1, "type": "Functional"}, {"id": "TEID-79-T2", "title": "Verify that the operator must confirm or edit every suggestion before it is saved.", "ac": 2, "type": "Functional"}, {"id": "TEID-79-T3", "title": "Verify that constructs that cannot be represented exactly are flagged and never silently approximated.", "ac": 3, "type": "Functional"}, {"id": "TEID-79-T4", "title": "Verify that after mapping, re-rating (TEID-68) of recent history shows whether the mapped plans reproduce past invoices.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-80", "epic": "TEID-13", "summary": "Parallel run and cut-over", "desc": "As a founder, I want to run Teideal alongside my old platform for a full cycle and then cut over with a rollback option, so that I switch only when I have proof it matches.\n\n*Context*\nUses Verify (TEID-11) for the comparison and shadow enforcement (TEID-10) for the switch.", "priority": "Medium", "points": 8, "release": "phase-2", "area": "migration", "ac": ["The parallel run compares Teideal's invoices with the old platform's for every customer, using the three-way match.", "A cut-over checklist confirms zero unexplained differences, all customers mapped, and processors connected.", "After cut-over, the old platform can be restored as the system of record within one day if needed."], "order": 96, "tests": [{"id": "TEID-80-T1", "title": "Verify that the parallel run compares Teideal's invoices with the old platform's for every customer, using the three-way match.", "ac": 1, "type": "Functional"}, {"id": "TEID-80-T2", "title": "Verify that a cut-over checklist confirms zero unexplained differences, all customers mapped, and processors connected.", "ac": 2, "type": "Functional"}, {"id": "TEID-80-T3", "title": "Verify that after cut-over, the old platform can be restored as the system of record within one day if needed.", "ac": 3, "type": "Resilience"}]}, {"key": "TEID-51", "epic": "TEID-7", "summary": "Record inference costs", "desc": "As a finance lead, I want to enter our cost per unit for each model, or send a cost with each event, so that margin can be calculated automatically.\n\n*Context*\n", "priority": "Medium", "points": 5, "release": "phase-2", "area": "margin", "ac": ["An operator can maintain a cost table per model and metric, with effective dates.", "Alternatively, an event can carry its own actual cost, which overrides the table.", "Cost changes never alter the price charged to customers."], "order": 97, "tests": [{"id": "TEID-51-T1", "title": "Verify that an operator can maintain a cost table per model and metric, with effective dates.", "ac": 1, "type": "Functional"}, {"id": "TEID-51-T2", "title": "Verify that alternatively, an event can carry its own actual cost, which overrides the table.", "ac": 2, "type": "Functional"}, {"id": "TEID-51-T3", "title": "Verify that cost changes never alter the price charged to customers.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-52", "epic": "TEID-7", "summary": "Margin dashboard", "desc": "As a founder, I want to see revenue, cost and gross margin by customer, plan and model, so that I can make pricing and sales decisions based on profitability.\n\n*Context*\n", "priority": "Medium", "points": 8, "release": "phase-2", "area": "margin", "ac": ["The dashboard shows revenue, cost, gross margin and margin percentage for any date range.", "It can be broken down by customer, plan, model and team.", "Figures tie to ledger revenue and the cost table.", "Data can be exported as CSV."], "order": 98, "tests": [{"id": "TEID-52-T1", "title": "Verify that the dashboard shows revenue, cost, gross margin and margin percentage for any date range.", "ac": 1, "type": "Functional"}, {"id": "TEID-52-T2", "title": "Verify that it can be broken down by customer, plan, model and team.", "ac": 2, "type": "Functional"}, {"id": "TEID-52-T3", "title": "Verify that figures tie to ledger revenue and the cost table.", "ac": 3, "type": "Functional"}, {"id": "TEID-52-T4", "title": "Verify that data can be exported as CSV.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-53", "epic": "TEID-7", "summary": "Flag unprofitable customers", "desc": "As a founder, I want a list of customers whose margin is below a level I set, so that I can reprice or renegotiate before losses grow.\n\n*Context*\n", "priority": "Medium", "points": 3, "release": "phase-2", "area": "margin", "ac": ["An operator can set a margin threshold (default 20%).", "The list shows each customer below the threshold with revenue, cost, margin and main cost driver.", "A weekly email summary can be switched on."], "order": 99, "tests": [{"id": "TEID-53-T1", "title": "Verify that an operator can set a margin threshold (default 20%).", "ac": 1, "type": "Functional"}, {"id": "TEID-53-T2", "title": "Verify that the list shows each customer below the threshold with revenue, cost, margin and main cost driver.", "ac": 2, "type": "Functional"}, {"id": "TEID-53-T3", "title": "Verify that a weekly email summary can be switched on.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-54", "epic": "TEID-8", "summary": "Pricing change simulation", "desc": "As a founder, I want to see what a past period would have cost each customer under a proposed pricing version, so that I can reprice with confidence.\n\n*Context*\nSimulations replay real historical usage against a draft plan version and never touch live data.", "priority": "Medium", "points": 13, "release": "phase-2", "area": "intelligence", "ac": ["An operator can choose a draft plan version and a historical period to simulate.", "Results show total revenue change and a per-customer list of who would pay more or less and by how much.", "Simulations never change live balances, invoices or ledger entries.", "Results can be exported and shared with a link inside the account."], "order": 100, "tests": [{"id": "TEID-54-T1", "title": "Verify that an operator can choose a draft plan version and a historical period to simulate.", "ac": 1, "type": "Functional"}, {"id": "TEID-54-T2", "title": "Verify that results show total revenue change and a per-customer list of who would pay more or less and by how much.", "ac": 2, "type": "Functional"}, {"id": "TEID-54-T3", "title": "Verify that simulations never change live balances, invoices or ledger entries.", "ac": 3, "type": "Functional"}, {"id": "TEID-54-T4", "title": "Verify that results can be exported and shared with a link inside the account.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-56", "epic": "TEID-8", "summary": "Free-tier abuse detection", "desc": "As a founder, I want risky free-tier sign-ups flagged and limited before they burn expensive credits, so that we stop paying inference bills for abusers.\n\n*Context*\nSignals can include sign-up velocity, reuse of payment fingerprints from Stripe, and unusually fast consumption of expensive models.", "priority": "Medium", "points": 13, "release": "phase-2", "area": "intelligence", "ac": ["Each new free-tier customer receives a risk score within 5 minutes of their first usage.", "Operators can set automatic actions by risk score: allow, throttle, require verification, or suspend.", "Flagged accounts appear in a review queue with the reasons for the score.", "Operators can mark a flag as wrong; the customer is released and the feedback is recorded."], "order": 101, "tests": [{"id": "TEID-56-T1", "title": "Verify that each new free-tier customer receives a risk score within 5 minutes of their first usage.", "ac": 1, "type": "Performance"}, {"id": "TEID-56-T2", "title": "Verify that operators can set automatic actions by risk score: allow, throttle, require verification, or suspend.", "ac": 2, "type": "Functional"}, {"id": "TEID-56-T3", "title": "Verify that flagged accounts appear in a review queue with the reasons for the score.", "ac": 3, "type": "Functional"}, {"id": "TEID-56-T4", "title": "Verify that operators can mark a flag as wrong; the customer is released and the feedback is recorded.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-49", "epic": "TEID-6", "summary": "Embeddable usage widget", "desc": "As a developer at our customer, I want a usage widget I can embed in my own product's dashboard, so that my customers can see their balance and burn rate without contacting my support team.\n\n*Context*\n", "priority": "Low", "points": 8, "release": "phase-3", "area": "visibility", "ac": ["The widget shows current balance, usage this period, daily burn rate and projected run-out date.", "It is embedded using a short-lived signed token that only allows viewing that one customer's data.", "Colours and fonts can be customised to match the host product.", "It works on desktop and mobile screen sizes."], "order": 102, "tests": [{"id": "TEID-49-T1", "title": "Verify that the widget shows current balance, usage this period, daily burn rate and projected run-out date.", "ac": 1, "type": "Functional"}, {"id": "TEID-49-T2", "title": "Verify that it is embedded using a short-lived signed token that only allows viewing that one customer's data.", "ac": 2, "type": "Functional"}, {"id": "TEID-49-T3", "title": "Verify that colours and fonts can be customised to match the host product.", "ac": 3, "type": "Functional"}, {"id": "TEID-49-T4", "title": "Verify that it works on desktop and mobile screen sizes.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-77", "epic": "TEID-12", "summary": "Route customers to processors by region or currency", "desc": "As a billing operator, I want to collect payments through different processors depending on the customer's region or currency, so that we get better approval rates and local payment methods.\n\n*Context*\n", "priority": "Low", "points": 8, "release": "phase-3", "area": "neutrality", "ac": ["An operator can set routing rules by country, currency or customer.", "Every payment records which processor handled it and why.", "Reconciliation (TEID-11) covers all processors in one view."], "order": 103, "tests": [{"id": "TEID-77-T1", "title": "Verify that an operator can set routing rules by country, currency or customer.", "ac": 1, "type": "Functional"}, {"id": "TEID-77-T2", "title": "Verify that every payment records which processor handled it and why.", "ac": 2, "type": "Functional"}, {"id": "TEID-77-T3", "title": "Verify that reconciliation (TEID-11) covers all processors in one view.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-55", "epic": "TEID-8", "summary": "Usage anomaly alerts", "desc": "As a billing operator, I want to be told when a customer's usage suddenly departs from its normal pattern, so that I catch runaway jobs, bugs and misuse quickly.\n\n*Context*\n", "priority": "Low", "points": 8, "release": "phase-3", "area": "intelligence", "ac": ["The system learns a normal usage pattern for each customer after 14 days of data.", "Significant spikes or drops trigger an alert with a plain-English description of what changed.", "Operators can adjust sensitivity per customer or plan.", "Each alert links to the relevant section of the customer timeline."], "order": 104, "tests": [{"id": "TEID-55-T1", "title": "Verify that the system learns a normal usage pattern for each customer after 14 days of data.", "ac": 1, "type": "Functional"}, {"id": "TEID-55-T2", "title": "Verify that significant spikes or drops trigger an alert with a plain-English description of what changed.", "ac": 2, "type": "Functional"}, {"id": "TEID-55-T3", "title": "Verify that operators can adjust sensitivity per customer or plan.", "ac": 3, "type": "Functional"}, {"id": "TEID-55-T4", "title": "Verify that each alert links to the relevant section of the customer timeline.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-57", "epic": "TEID-8", "summary": "Commit exhaustion and expansion signals", "desc": "As a account manager at our customer, I want a list of customers projected to use up their commit before their term ends, so that I can start renewal and upsell conversations early.\n\n*Context*\n", "priority": "Low", "points": 5, "release": "phase-3", "area": "intelligence", "ac": ["The system projects each customer's commit run-out date from recent usage.", "A list shows customers projected to exhaust their commit before term end, with the projected date and shortfall.", "A weekly digest can be emailed to named people nd submitted where mandated.", "ac": 1, "type": "Functional"}, {"id": "TEID-86-T2", "title": "Verify that local tax is calculated and shown correctly on every invoice.", "ac": 2, "type": "Functional"}, {"id": "TEID-86-T3", "title": "Verify that at least one local payment processor is supported through the TEID-12 interface.", "ac": 3, "type": "Functional"}, {"id": "TEID-86-T4", "title": "Verify that a local finance or tax advisor has reviewed and signed off the pack.", "ac": 4, "type": "Functional"}]}]};
const STORE_KEY = "teideal-board-v1";
const STATUS = {todo:"To Do", inprogress:"In Progress", done:"Done"};
const TEST_LABEL = {notrun:"Not run", Passed:"Passed", Failed:"Failed"};
const REL_LABEL = {"mvp":"MVP","phase-2":"Phase 2","phase-3":"Phase 3"};

const epicByKey = {};
DATA.epics.sort((a,b)=>parseInt(a.code.slice(1))-parseInt(b.code.slice(1)));
DATA.epics.forEach((e,i)=>{ e.color = `hsl(${Math.round(i*360/DATA.epics.length+190)%360} 55% 50%)`; epicByKey[e.key]=e; });
const stories = DATA.stories.sort((a,b)=>a.order-b.order);
const storyByKey = Object.fromEntries(stories.map(s=>[s.key,s]));

/* ---------- state ---------- */
function freshState(){
  const st = {v:1, stories:{}};
  stories.forEach(s=>{ st.stories[s.key] = {status:"todo", ac:s.ac.map(()=>false), tests:Object.fromEntries(s.tests.map(t=>[t.id,"notrun"])), history:[]}; });
  return st;
}
function loadState(){
  const base = freshState();
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ mergeInto(base, JSON.parse(raw)); }
  }catch(e){ /* storage unavailable: run in memory */ }
  return base;
}
function mergeInto(base, saved){
  if(!saved || !saved.stories) return;
  for(const k in base.stories){
    const s = saved.stories[k]; if(!s) continue;
    const b = base.stories[k];
    if(STATUS[s.status]) b.status = s.status;
    if(Array.isArray(s.ac)) b.ac = b.ac.map((_,i)=>!!s.ac[i]);
    if(s.tests) for(const t in b.tests) if(TEST_LABEL[s.tests[t]]) b.tests[t]=s.tests[t];
    if(Array.isArray(s.history)) b.history = s.history.slice(-50);
  }
}
let state = loadState();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- progress & workflow rules ---------- */
function progress(key){
  const st = state.stories[key], s = storyByKey[key];
  const acDone = st.ac.filter(Boolean).length;
  const tv = s.tests.map(t=>st.tests[t.id]);
  const passed = tv.filter(v=>v==="Passed").length, failed = tv.filter(v=>v==="Failed").length;
  const touched = acDone>0 || tv.some(v=>v!=="notrun");
  return {acDone, acTotal:s.ac.length, passed, failed, testTotal:s.tests.length,
          complete: acDone===s.ac.length && passed===s.tests.length, touched};
}
function logMove(key, from, to, why){
  state.stories[key].history.push({t:new Date().toISOString(), from, to, why});
}
function setStatus(key, to, why){
  const st = state.stories[key]; if(st.status===to) return;
  logMove(key, st.status, to, why); st.status = to;
}
/* Called after criteria or tests change: moves the card to reflect the work. */
function autoMove(key){
  const st = state.stories[key], p = progress(key);
  if(p.complete && st.status!=="done"){ setStatus(key,"done","All criteria met and all tests passed"); toast(`${key} moved to Done: all criteria met and all tests passed.`); }
  else if(!p.complete && st.status==="done"){ setStatus(key,"inprogress","Work reopened"); toast(`${key} moved back to In Progress: it no longer meets the definition of done.`); }
  else if(p.touched && st.status==="todo"){ setStatus(key,"inprogress","Work started"); toast(`${key} moved to In Progress.`); }
}
/* Manual moves (drag and drop or status menu). Done requires the definition of done. */
function manualMove(key, to){
  const st = state.stories[key]; if(st.status===to) return true;
  if(to==="done"){
    const p = progress(key);
    if(!p.complete){
      toast(`${key} can't move to Done yet: ${p.acDone}/${p.acTotal} criteria complete, ${p.passed}/${p.testTotal} tests passed.`);
      return false;
    }
  }
  setStatus(key, to, "Moved manually"); return true;
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastTimer;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),3200); }
function ticks(n, fn){ let h=""; for(let i=0;i<n;i++) h+=`<i class="${fn(i)}"></i>`; return `<span class="ticks" aria-hidden="true">${h}</span>`; }
function meters(key){
  const s=storyByKey[key], st=state.stories[key], p=progress(key);
  const acC = p.acDone===p.acTotal, tC = p.passed===p.testTotal;
  return `<div class="meters">
    <div class="meter ${acC?"complete":""}" title="Acceptance criteria complete"><span>Criteria</span>${ticks(p.acTotal,i=>st.ac[i]?"ok":"")}<span class="val">${p.acDone}/${p.acTotal}</span></div>
    <div class="meter ${tC?"complete":""}" title="Tests passed${p.failed?`, ${p.failed} failing`:""}"><span>Tests</span>${ticks(p.testTotal,i=>{const v=st.tests[s.tests[i].id];return v==="Passed"?"ok":v==="Failed"?"bad":""})}<span class="val">${p.passed}/${p.testTotal}</span></div>
  </div>`;
}

/* ---------- filters ---------- */
const fEpic=$("#fEpic");
DATA.epics.forEach(e=>fEpic.insertAdjacentHTML("beforeend",`<option value="${e.key}">${esc(e.code)} ${esc(e.name)}</option>`));
function storyMatches(s){
  const q=$("#q").value.trim().toLowerCase(), ep=fEpic.value, rel=$("#fRelease").value;
  if(ep && s.epic!==ep) return false;
  if(rel && s.release!==rel) return false;
  if(q){
    const e=epicByKey[s.epic];
    const hay=(s.key+" "+s.summary+" "+e.code+" "+e.name+" "+s.tests.map(t=>t.id+" "+t.title).join(" ")).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

/* ---------- board ---------- */
function renderBoard(){
  const cols={todo:[],inprogress:[],done:[]};
  stories.filter(storyMatches).forEach(s=>cols[state.stories[s.key].status].push(s));
  for(const status in cols){
    const col=document.querySelector(`.column[data-status="${status}"]`), lane=col.querySelector(".lane"), list=cols[status];
    col.querySelector(".count").textContent=list.length;
    col.querySelector(".pts").textContent=list.reduce((a,s)=>a+s.points,0)+" pts";
    lane.innerHTML = list.length ? list.map(cardHtml).join("") :
      `<div class="empty">${status==="todo"?"Nothing left to start.":status==="inprogress"?"Drag a story here, or tick a criterion to start it.":"Stories land here when every criterion is met and every test passes."}</div>`;
  }
  const all=stories.filter(storyMatches), done=all.filter(s=>state.stories[s.key].status==="done");
  $("#summary").textContent=`${done.length} of ${all.length} stories done, ${done.reduce((a,s)=>a+s.points,0)} of ${all.reduce((a,s)=>a+s.points,0)} points`;
}
function cardHtml(s){
  const e=epicByKey[s.epic];
  return `<article class="card" draggable="true" tabindex="0" data-key="${s.key}" style="--epic:${e.color}" aria-label="${esc(s.key+" "+s.summary)}">
    <div class="row1"><span class="order" title="Implementation order">#${s.order}</span><span>${s.key}</span><span class="prio ${s.priority}">${s.priority}</span></div>
    <h3>${esc(s.summary)}</h3>
    <div class="epic" title="${esc(e.code+" "+e.name)}">${esc(e.code)} ${esc(e.name)}</div>
    ${meters(s.key)}
    <div class="foot"><span>${s.points} pts</span><span class="rel">${REL_LABEL[s.release]}</span></div>
  </article>`;
}
let dragKey=null;
document.addEventListener("dragstart",ev=>{ const c=ev.target.closest(".card"); if(!c) return; dragKey=c.dataset.key; c.classList.add("dragging"); ev.dataTransfer.setData("text/plain",dragKey); ev.dataTransfer.effectAllowed="move"; });
document.addEventListener("dragend",ev=>{ const c=ev.target.closest(".card"); if(c) c.classList.remove("dragging"); document.querySelectorAll(".lane.drop").forEach(l=>l.classList.remove("drop")); });
document.querySelectorAll(".lane").forEach(lane=>{
  lane.addEventListener("dragover",ev=>{ ev.preventDefault(); lane.classList.add("drop"); });
  lane.addEventListener("dragleave",ev=>{ if(!lane.contains(ev.relatedTarget)) lane.classList.remove("drop"); });
  lane.addEventListener("drop",ev=>{
    ev.preventDefault(); lane.classList.remove("drop");
    const key=ev.dataTransfer.getData("text/plain")||dragKey; if(!key) return;
    if(manualMove(key,lane.dataset.status)){ save(); renderAll(); toast(`${key} moved to ${STATUS[lane.dataset.status]}.`); }
  });
});
document.addEventListener("click",ev=>{
  const c=ev.target.closest(".card"); if(c){ openStory(c.dataset.key); return; }
  const l=ev.target.closest("[data-open]"); if(l) openStory(l.dataset.open);
});
document.addEventListener("keydown",ev=>{ const c=ev.target.closest&&ev.target.closest(".card"); if(c && (ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); openStory(c.dataset.key); } });

/* ---------- story dialog ---------- */
const dlg=$("#dlg");
let openKey=null;
function descHtml(text){
  return text.split(/\n{2,}/).map(block=>{
    const m=block.match(/^\*(.+?)\*\n?([\s\S]*)$/);
    if(m) return `<h4>${esc(m[1])}</h4>${m[2]?`<p>${esc(m[2]).replace(/\n/g,"<br>")}</p>`:""}`;
    return `<p>${esc(block).replace(/\n/g,"<br>")}</p>`;
  }).join("");
}
function openStory(key){ openKey=key; renderDialog(); if(!dlg.open) dlg.showModal(); }
function renderDialog(){
  const s=storyByKey[openKey], st=state.stories[openKey], e=epicByKey[s.epic], p=progress(openKey);
  $("#dlgInner").innerHTML = `
  <div class="dlg-head">
    <div class="meta"><span><span class="dot" style="--epic:${e.color}"></span>${esc(e.code)} ${esc(e.name)}</span><span>${s.key}</span><span>#${s.order} in build order</span><span>${s.priority}</span><span>${s.points} pts</span><span>${REL_LABEL[s.release]}</span></div>
    <h2>${esc(s.summary)}</h2>
    <label>Status <select id="dStatus">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${st.status===k?"selected":""}>${v}</option>`).join("")}</select></label>
    ${meters(openKey)}
  </div>
  <div class="dlg-body">
    <div class="desc">${descHtml(s.desc)}</div>
    <h3>Acceptance criteria <span class="sub">${p.acDone} of ${p.acTotal} complete</span><button class="btn" id="acAll">${p.acDone===p.acTotal?"Clear all":"Mark all complete"}</button></h3>
    <ul class="checklist">${s.ac.map((a,i)=>`<li><label><input type="checkbox" data-ac="${i}" ${st.ac[i]?"checked":""}><span class="n">${i+1}</span><span class="${st.ac[i]?"done-text":""}">${esc(a)}</span></label></li>`).join("")}</ul>
    <h3>Tests <span class="sub">${p.passed} of ${p.testTotal} passed${p.failed?`, ${p.failed} failing`:""}</span><button class="btn" id="tAll">${p.passed===p.testTotal?"Reset all":"Mark all passed"}</button></h3>
    <ul class="tests">${s.tests.map(t=>`<li><div><div>${esc(t.title)}</div><div class="t-meta">${t.id}, ${t.type}, covers criterion ${t.ac}</div></div>
      <div class="seg" role="group" aria-label="Result for ${t.id}">${["notrun","Passed","Failed"].map(v=>`<button class="${v}" data-test="${t.id}" data-val="${v}" aria-pressed="${st.tests[t.id]===v}">${TEST_LABEL[v]}</button>`).join("")}</div></li>`).join("")}</ul>
    <h3>History</h3>
    ${st.history.length?`<ul class="history">${st.history.slice().reverse().map(h=>`<li>${new Date(h.t).toLocaleString()}: ${STATUS[h.from]} to ${STATUS[h.to]} (${esc(h.why)})</li>`).join("")}</ul>`:`<p class="note">No moves yet. Tick a criterion or record a test result to start this story.</p>`}
    ${s.provisional?`<p class="note">This story comes from the missing-stories import file. Its key assumes that file is imported next into TEID; check it after import.</p>`:""}
  </div>
  <div class="dlg-foot"><button class="btn primary" id="dClose">Close</button></div>`;
}
dlg.addEventListener("click",ev=>{
  if(ev.target===dlg){ dlg.close(); return; }
  const key=openKey, st=state.stories[key], s=storyByKey[key];
  if(ev.target.id==="dClose"){ dlg.close(); return; }
  if(ev.target.id==="acAll"){ const all=st.ac.every(Boolean); st.ac=st.ac.map(()=>!all); afterChange(key); return; }
  if(ev.target.id==="tAll"){ const all=s.tests.every(t=>st.tests[t.id]==="Passed"); s.tests.forEach(t=>st.tests[t.id]=all?"notrun":"Passed"); afterChange(key); return; }
  const tb=ev.target.closest("[data-test]"); if(tb){ st.tests[tb.dataset.test]=tb.dataset.val; afterChange(key); }
});
dlg.addEventListener("change",ev=>{
  const key=openKey, st=state.stories[key];
  if(ev.target.matches("[data-ac]")){ st.ac[+ev.target.dataset.ac]=ev.target.checked; afterChange(key); }
  if(ev.target.id==="dStatus"){ if(manualMove(key,ev.target.value)){ save(); renderAll(); renderDialog(); } else ev.target.value=st.status; }
});
dlg.addEventListener("close",()=>{ openKey=null; });
function afterChange(key){ autoMove(key); save(); renderAll(); renderDialog(); }

/* ---------- implementation order ---------- */
function renderOrder(){
  const list=stories.filter(storyMatches);
  let html="", cur=null;
  list.forEach(s=>{
    if(s.release!==cur){
      cur=s.release;
      const g=list.filter(x=>x.release===cur), d=g.filter(x=>state.stories[x.key].status==="done");
      html+=`<tr class="group"><td colspan="8">${REL_LABEL[cur]}: ${d.length} of ${g.length} stories done, ${d.reduce((a,x)=>a+x.points,0)} of ${g.reduce((a,x)=>a+x.points,0)} points</td></tr>`;
    }
    const e=epicByKey[s.epic], st=state.stories[s.key], p=progress(s.key);
    html+=`<tr><td class="num">${s.order}</td><td class="key">${s.key}</td><td><button class="linkish" data-open="${s.key}">${esc(s.summary)}</button></td>
      <td><span class="dot" style="--epic:${e.color}"></span>${esc(e.code)} ${esc(e.name)}</td><td class="num">${s.points}</td>
      <td><span class="pill ${st.status}">${STATUS[st.status]}</span></td><td class="num">${p.acDone}/${p.acTotal}</td><td class="num">${p.passed}/${p.testTotal}</td></tr>`;
  });
  $("#orderBody").innerHTML=html||`<tr><td colspan="8">No stories match these filters. Clear the search or choose another epic or release.</td></tr>`;
  const allPts=stories.reduce((a,s)=>a+s.points,0), donePts=stories.filter(s=>state.stories[s.key].status==="done").reduce((a,s)=>a+s.points,0);
  const next=stories.find(s=>state.stories[s.key].status==="todo");
  $("#orderStats").innerHTML=`<span><b>${Math.round(100*donePts/allPts)}%</b>of all points done</span><span><b>${stories.filter(s=>state.stories[s.key].status==="inprogress").length}</b>in progress</span>`+
    (next?`<span>Next to start: <button class="linkish" data-open="${next.key}">#${next.order} ${esc(next.summary)}</button></span>`:"");
  $("#summary").textContent=`${list.length} stories`;
}

/* ---------- traceability ---------- */
function traceRows(){
  const q=$("#q").value.trim().toLowerCase(), ep=fEpic.value, rel=$("#fRelease").value, tr=$("#fTest").value;
  const rows=[];
  DATA.epics.forEach(e=>{
    if(ep && e.key!==ep) return;
    stories.filter(s=>s.epic===e.key).forEach(s=>{
      if(rel && s.release!==rel) return;
      const st=state.stories[s.key];
      s.tests.forEach(t=>{
        const r={e,s,t,st,res:st.tests[t.id]};
        if(tr && r.res!==tr) return;
        if(q && !(e.code+" "+e.name+" "+s.key+" "+s.summary+" "+t.id+" "+t.title).toLowerCase().includes(q)) return;
        rows.push(r);
      });
    });
  });
  return rows;
}
function renderTrace(){
  const rows=traceRows();
  $("#traceBody").innerHTML = rows.length ? rows.map(({e,s,t,st,res})=>`<tr>
    <td><span class="dot" style="--epic:${e.color}"></span>${e.key} ${esc(e.code)} ${esc(e.name)}</td>
    <td><button class="linkish" data-open="${s.key}">${s.key} ${esc(s.summary)}</button></td>
    <td class="num">${s.order}</td><td>${REL_LABEL[s.release]}</td>
    <td><span class="pill ${st.status}">${STATUS[st.status]}</span></td>
    <td><span class="key">${t.id}</span><br>${esc(t.title)}</td>
    <td>Criterion ${t.ac}${st.ac[t.ac-1]?" (met)":""}</td><td>${t.type}</td>
    <td><span class="pill ${res}">${TEST_LABEL[res]}</span></td></tr>`).join("")
    : `<tr><td colspan="9">No rows match these filters. Clear the search or choose another filter.</td></tr>`;
  const allTests=stories.reduce((a,s)=>a+s.tests.length,0);
  const passed=stories.reduce((a,s)=>a+s.tests.filter(t=>state.stories[s.key].tests[t.id]==="Passed").length,0);
  const failed=stories.reduce((a,s)=>a+s.tests.filter(t=>state.stories[s.key].tests[t.id]==="Failed").length,0);
  $("#traceStats").innerHTML=`<span><b>${DATA.epics.length}</b>epics</span><span><b>${stories.length}</b>stories</span><span><b>${allTests}</b>tests</span><span><b>${passed}</b>passed</span><span><b>${failed}</b>failing</span>`;
  $("#summary").textContent=`${rows.length} rows`;
}
function csvCell(v){ v=String(v??""); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; }
$("#exportCsv").addEventListener("click",()=>{
  const head=["Epic key","Epic","Story key","Story","Implementation order","Release","Story status","Criteria complete","Tests passed","Test ID","Test","Covers criterion","Criterion met","Test type","Test result"];
  const lines=[head.join(",")].concat(traceRows().map(({e,s,t,st,res})=>{ const p=progress(s.key);
    return [e.key,e.code+" "+e.name,s.key,s.summary,s.order,REL_LABEL[s.release],STATUS[st.status],`${p.acDone}/${p.acTotal}`,`${p.passed}/${p.testTotal}`,t.id,t.title,t.ac,st.ac[t.ac-1]?"Yes":"No",t.type,TEST_LABEL[res]].map(csvCell).join(",");}));
  download("teideal-traceability.csv", lines.join("\n"), "text/csv");
});

/* ---------- tabs, persistence buttons ---------- */
let view="board";
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{
  view=b.dataset.view;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="view-"+view);
  $("#fTest").hidden=view!=="trace"; $("#exportCsv").hidden=view!=="trace";
  renderAll();
}));
["q","fEpic","fRelease","fTest"].forEach(id=>$("#"+id).addEventListener("input",renderAll));
function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
$("#exportState").addEventListener("click",()=>{ download(`teideal-progress-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state,null,1), "application/json"); toast("Progress exported."); });
$("#importState").addEventListener("click",()=>$("#importFile").click());
$("#importFile").addEventListener("change",async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ const saved=JSON.parse(await f.text()); const base=freshState(); mergeInto(base,saved); state=base; save(); renderAll(); toast("Progress imported."); }
  catch(e){ toast("That file isn't a Teideal progress export. Choose a JSON file created with Export progress."); }
  ev.target.value="";
});
$("#resetState").addEventListener("click",()=>{
  if(!confirm("Move every story back to To Do and clear all criteria, test results and history? Export your progress first if you want to keep it.")) return;
  state=freshState(); save(); renderAll(); toast("Board reset.");
});

function renderAll(){ if(view==="board") renderBoard(); else if(view==="order") renderOrder(); else renderTrace(); }
renderAll();
</script>
</body>
</html>
