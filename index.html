<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teideal board</title>
<style>
:root{
  --bg:#EEF1F4;--col:#E2E7EC;--card:#FFFFFF;--ink:#16212B;--muted:#586878;--line:#CCD5DE;
  --accent:#0E6B6B;--accent-ink:#FFFFFF;--pass:#2F7D4E;--fail:#B53B3B;--pending:#C3CCD5;--focus:#0E6B6B;
  --radius-card:6px;--radius-col:10px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--bg);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141A20;--col:#1B232B;--card:#232D37;--ink:#E4EAF0;--muted:#98A7B4;--line:#33404C;
  --accent:#3AAFA9;--accent-ink:#0C1A1A;--pass:#4DB07B;--fail:#E26463;--pending:#45525E;--focus:#3AAFA9;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top{display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:550}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--col)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 24px 0;flex-wrap:wrap}
.toolbar input[type=search]{min-width:240px}
.toolbar select{max-width:340px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 9px}
.toolbar .summary{margin-left:auto;color:var(--muted);font-size:13px}
main{padding:14px 24px 32px}
.view[hidden]{display:none}

/* Board */
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;align-items:start}
.column{min-width:0;background:var(--col);border-radius:var(--radius-col);display:flex;flex-direction:column;max-height:calc(100vh - 150px);min-height:200px}
.column header{display:flex;align-items:baseline;gap:8px;padding:12px 14px 8px}
.column h2{margin:0;font-size:14px;font-weight:650}
.column .count{color:var(--muted);font-size:13px}
.column .pts{margin-left:auto;color:var(--muted);font-size:12px}
.lane{padding:4px 10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;border-radius:0 0 var(--radius-col) var(--radius-col);transition:background .12s}
.lane.drop{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.lane .empty{color:var(--muted);font-size:13px;padding:18px 6px;text-align:center}

.card{background:var(--card);border-radius:var(--radius-card);padding:10px 11px 9px;border:1px solid transparent;cursor:grab;position:relative;border-left:4px solid var(--epic)}
.card:hover{border-color:var(--line);border-left-color:var(--epic)}
.card.dragging{opacity:.45}
.card .row1{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.card .order{font-weight:700;color:var(--ink);min-width:28px}
.card .prio{margin-left:auto;font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.prio.Highest{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,transparent)}
.prio.High{color:#B7791F;border-color:color-mix(in srgb,#B7791F 45%,transparent)}
.card h3{font-size:14px;font-weight:560;margin:5px 0 7px;line-height:1.35}
.card .epic{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:grid;gap:5px;margin:9px 0 7px}
.meter{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meter .val{text-align:right;color:var(--ink);font-weight:600}
.meter.complete .val{color:var(--pass)}
.ticks{display:flex;gap:2px;height:7px}
.ticks i{flex:1;border-radius:2px;background:var(--pending)}
.ticks i.ok{background:var(--pass)}
.ticks i.bad{background:var(--fail)}
.card .foot{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.card .foot .rel{margin-left:auto}

/* Tables */
.table-wrap{overflow-x:auto;background:var(--card);border-radius:var(--radius-col);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card);font-weight:650;color:var(--muted);font-size:12px;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--col) 60%,transparent)}
td.num{text-align:right;white-space:nowrap}
td.key{white-space:nowrap;color:var(--muted)}
tr.group td{background:var(--col);font-weight:650;color:var(--ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap;border:1px solid var(--line)}
.pill.todo{color:var(--muted)}
.pill.inprogress{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.pill.done,.pill.Passed{color:var(--pass);border-color:color-mix(in srgb,var(--pass) 50%,transparent)}
.pill.Failed{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 50%,transparent)}
.pill.notrun{color:var(--muted)}
.linkish{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--epic);margin-right:6px;vertical-align:1px}

/* Dialog */
dialog{border:0;border-radius:12px;padding:0;width:min(760px,94vw);max-height:90vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,22,.45)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg-head{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.dlg-head .meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.dlg-head h2{margin:6px 0 10px;font-size:19px;line-height:1.3}
.dlg-head select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 8px}
.dlg-body{padding:6px 22px 20px;overflow-y:auto}
.dlg-body h3{font-size:14px;margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.dlg-body h3 .sub{color:var(--muted);font-weight:500;font-size:13px}
.dlg-body h3 .btn{margin-left:auto;padding:3px 8px;font-size:12px}
.desc p{margin:0 0 8px;max-width:72ch}
.desc h4{margin:12px 0 4px;font-size:13px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checklist label{display:grid;grid-template-columns:20px 22px 1fr;gap:6px;align-items:start;cursor:pointer}
.checklist input{margin-top:3px;accent-color:var(--pass)}
.checklist .n{color:var(--muted);font-size:12px;padding-top:2px}
.checklist .done-text{color:var(--muted);text-decoration:line-through}
.tests{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tests li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.tests .t-meta{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].notrun{background:var(--col);color:var(--ink)}
.seg button[aria-pressed="true"].Passed{background:var(--pass);color:#fff}
.seg button[aria-pressed="true"].Failed{background:var(--fail);color:#fff}
.history{font-size:12px;color:var(--muted);list-style:none;padding:0;margin:0;display:grid;gap:3px}
.note{font-size:12px;color:var(--muted)}
.dlg-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px;margin-right:4px}

@media (max-width:900px){
  .board{grid-template-columns:minmax(0,1fr)}
  .toolbar input[type=search]{min-width:0;flex:1}
  .column{max-height:none}
  header.top,.toolbar,main{padding-left:12px;padding-right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Teideal</h1><span>TEID delivery board</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="board">Board</button>
    <button role="tab" aria-selected="false" data-view="order">Implementation order</button>
    <button role="tab" aria-selected="false" data-view="trace">Traceability</button>
  </nav>
  <div class="top-actions">
    <button class="btn" id="exportState" title="Download your progress as a JSON file">Export progress</button>
    <button class="btn" id="importState" title="Load progress from a JSON file">Import progress</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button class="btn" id="resetState" title="Move every story back to To Do and clear all progress">Reset</button>
  </div>
</header>

<div class="toolbar" id="filters">
  <input type="search" id="q" placeholder="Search stories, keys or tests" aria-label="Search">
  <select id="fEpic" aria-label="Epic"><option value="">All epics</option></select>
  <select id="fRelease" aria-label="Release">
    <option value="">All releases</option><option value="mvp">MVP</option><option value="phase-2">Phase 2</option><option value="phase-3">Phase 3</option>
  </select>
  <select id="fTest" aria-label="Test result" hidden>
    <option value="">All test results</option><option value="notrun">Not run</option><option value="Passed">Passed</option><option value="Failed">Failed</option>
  </select>
  <button class="btn" id="exportCsv" hidden>Export CSV</button>
  <span class="summary" id="summary"></span>
</div>

<main>
  <section class="view" id="view-board">
    <div class="board">
      <div class="column" data-status="todo"><header><h2>To Do</h2><span class="count"></span><span class="pts"></span></header><div class="lane" data-status="todo"></div></div>
      <div class="column" data-status="inprogress"><header><h2>In Progress</h2><span class="count"></span><span class="pts"></span></header><div class="lane" data-status="inprogress"></div></div>
      <div class="column" data-status="done"><header><h2>Done</h2><span class="count"></span><span class="pts"></span></header><div class="lane" data-status="done"></div></div>
    </div>
  </section>
  <section class="view" id="view-order" hidden>
    <div class="stats" id="orderStats"></div>
    <div class="table-wrap"><table><thead><tr>
      <th>#</th><th>Key</th><th>Story</th><th>Epic</th><th>Points</th><th>Status</th><th>Criteria</th><th>Tests</th>
    </tr></thead><tbody id="orderBody"></tbody></table></div>
  </section>
  <section class="view" id="view-trace" hidden>
    <div class="stats" id="traceStats"></div>
    <div class="table-wrap"><table><thead><tr>
      <th>Epic</th><th>Story</th><th>#</th><th>Release</th><th>Story status</th><th>Test</th><th>Covers</th><th>Type</th><th>Result</th>
    </tr></thead><tbody id="traceBody"></tbody></table></div>
  </section>
</main>

<dialog id="dlg"><div class="dlg" id="dlgInner"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = {"epics": [{"key": "TEID-15", "code": "E15", "name": "Build regional compliance pack", "desc": "Deliver local e-invoicing, tax, and regional payment compliance tailored to target markets. Address gaps left by US-centric global billing platforms.", "release": "phase-3"}, {"key": "TEID-14", "code": "E14", "name": "Publish open-source core and public correctness proof", "desc": "Open-source the core ledger and verification engine alongside public correctness tests. Build developer credibility and auditability for billing calculations.", "release": "mvp"}, {"key": "TEID-13", "code": "E13", "name": "Enable migration from other billing platforms", "desc": "Facilitate low-risk migration of contracts, balances, and history from platforms like Stripe Billing, Metronome, Orb, or Lago. Capture transition opportunities during vendor re-evaluations.", "release": "phase-2"}, {"key": "TEID-12", "code": "E12", "name": "Implement processor-neutral payments", "desc": "Decouple ledger, pricing, and history from any single payment processor to ensure complete processor neutrality. Provide flexibility to add or switch payment providers freely.", "release": "mvp"}, {"key": "TEID-11", "code": "E11", "name": "Implement Teideal Verify independent revenue verification", "desc": "Independently verify that all usage is correctly billed and collected across any billing platform without system replacement. Eliminate manual finance reconciliations and surface revenue leakage risks.", "release": "mvp"}, {"key": "TEID-10", "code": "E10", "name": "Enable shadow enforcement and go-live", "desc": "Transition customers from verification to live entitlement enforcement and billing cohort by cohort with instant rollback capabilities. Convert verified trust into live operational usage safely.", "release": "phase-2"}, {"key": "TEID-9", "code": "E09", "name": "Improve developer experience and testing", "desc": "Streamline integration to take a day and allow full testing of renewals, expiries, and overages prior to launch. Provide safe simulation tools for billing scenario validation.", "release": "mvp"}, {"key": "TEID-8", "code": "E08", "name": "Implement AI operator intelligence", "desc": "Leverage AI to simulate pricing changes, detect usage anomalies, prevent free-tier abuse, and identify expansion opportunities. Reduce operator overhead and eliminate risks associated with pricing updates.", "release": "phase-2"}, {"key": "TEID-7", "code": "E07", "name": "Build cost and margin analytics", "desc": "Combine revenue and inference cost data to calculate gross margin by customer, plan, and model. Help founders verify profitability across heavy user segments.", "release": "phase-2"}, {"key": "TEID-6", "code": "E06", "name": "Enable operator visibility, alerts, and customer-facing usage", "desc": "Provide support, finance, and customers direct visibility into balance history and burn rate without engineering intervention. Streamline billing inquiries and clarify charge discrepancies.", "release": "mvp"}, {"key": "TEID-5", "code": "E05", "name": "Establish tenant isolation, access control, and data ownership", "desc": "Implement structural isolation, auditability, and data portability guarantees verifiable by enterprise security teams. Unblock enterprise approvals by providing audit trails and clear exit strategies.", "release": "mvp"}, {"key": "TEID-4", "code": "E04", "name": "Develop Stripe connector (read-first) and invoice sync", "desc": "Connect to Stripe read-only for verification, adding write access for invoice sync and credit grants as billing migrates. Reconciliation itself is handled by Teideal Verify (TEID-11).", "release": "mvp"}, {"key": "TEID-3", "code": "E03", "name": "Build usage ingestion and exactly-once ledger", "desc": "Ingest usage events at scale and record every balance change exactly once in an immutable ledger. Ensure balances are always derived accurately and prevent counter drift across deploys.", "release": "mvp"}, {"key": "TEID-2", "code": "E02", "name": "Implement real-time authorization and entitlement checks", "desc": "Provide authorization and entitlement checks (p99 under 20 ms) on the request path for streaming and long-running jobs. Prevent balance drift while ensuring billing outages do not disrupt the customer product.", "release": "phase-2"}, {"key": "TEID-1", "code": "E01", "name": "Implement entitlement model and pricing configuration", "desc": "Configure plans, grants, commits, overrides, and caps without custom code. This replaces special-case deal code and enables clear visibility into pricing applied to usage.", "release": "mvp"}, {"key": "TEID-87", "code": "E16", "name": "Establish security and SOC 2 compliance programme", "desc": "Put the security controls, evidence and independent assurance in place that enterprise buyers require before connecting billing data. SOC 2 Type II was named by the founder as a condition of signing.", "release": "mvp", "provisional": true}, {"key": "TEID-88", "code": "E17", "name": "Establish data protection and privacy", "desc": "Handle the personal data inside customers' billing records lawfully and minimally, with clear retention, deletion and data-processing terms (including GDPR and India's DPDP Act).", "release": "mvp", "provisional": true}, {"key": "TEID-89", "code": "E18", "name": "Establish platform reliability and operations", "desc": "Operate Teideal as financial infrastructure: defined service levels, monitoring, recoverable backups, safe deployments and honest incident communication.", "release": "mvp", "provisional": true}, {"key": "TEID-90", "code": "E19", "name": "Establish AI guardrails and governance", "desc": "Make every AI feature safe to use on financial data: no training on customer data, no unconfirmed changes, grounded answers, resistance to prompt injection, and measured accuracy. Applies to TEID-46, TEID-79, TEID-58 and all of E08.", "release": "mvp", "provisional": true}], "stories": [{"key": "TEID-41", "epic": "TEID-5", "summary": "Structural tenant isolation", "desc": "As a security reviewer at our customer, I want evidence that one tenant's data can never be read or changed by another, so that we can approve Teideal for production use.\n\n*Context*\nIsolation must be enforced by the data layer, not only by application checks.", "priority": "Highest", "points": 8, "release": "mvp", "area": "security", "ac": ["Every table holding tenant data enforces isolation in the database itself (for example, row-level security).", "An automated test suite, run on every release, attempts cross-tenant reads and writes through every API and must fail to access any other tenant's data.", "Any release that fails these tests is blocked from deployment.", "A written description of the isolation design is available to customers on request."], "order": 1, "tests": [{"id": "TEID-41-T1", "title": "Run the RLS policy audit script against all tenant-scoped tables in the production schema and confirm each table has row-level security enabled that rejects a raw SELECT without a matching tenant_id predicate.", "ac": 1, "type": "Functional"}, {"id": "TEID-41-T2", "title": "Execute the cross-tenant regression suite using tenant acct_1001 credentials against every documented API endpoint targeting tenant acct_1002 resources and confirm every attempt returns 403 or an empty result set with zero acct_1002 records leaked.", "ac": 2, "type": "Functional"}, {"id": "TEID-41-T3", "title": "Seed the cross-tenant isolation suite to fail on the invoices endpoint during a CI pipeline run and confirm the deployment stage is automatically blocked with a red gate status rather than proceeding to release.", "ac": 3, "type": "Functional"}, {"id": "TEID-41-T4", "title": "Request the tenant isolation design document through the customer support portal for account acct_1001 and confirm a written architecture description covering the row-level-security enforcement is delivered within the documented SLA.", "ac": 4, "type": "Functional"}, {"id": "TEID-41-T5", "title": "Run the full cross-tenant isolation regression suite of 200-plus probe cases against staging and confirm it completes in under 15 minutes so it does not block release cadence.", "ac": 2, "type": "Non-functional"}, {"id": "TEID-41-T6", "title": "Confirm a blocked cross-tenant query attempt is captured in the security monitoring dashboard with tenant_id, endpoint and timestamp within 60 seconds of the attempt.", "ac": 1, "type": "Non-functional"}, {"id": "TEID-41-T7", "title": "Submit a filter parameter containing the SQL injection payload ' OR '1'='1 on the GET /usage endpoint authenticated as tenant acct_1001 and confirm no rows belonging to tenant acct_1002 are returned.", "ac": 1, "type": "Adversarial"}, {"id": "TEID-41-T8", "title": "Using a valid API key for tenant acct_1001, substitute tenant acct_1002's UUID into the path of PATCH /customers/{id} and confirm the request is rejected with 403 rather than silently updating acct_1002's record.", "ac": 2, "type": "Adversarial"}]}, {"key": "TEID-91", "epic": "TEID-5", "summary": "Console sign-in with multi-factor authentication", "desc": "As a Teideal user, I want to sign in securely with multi-factor authentication, so that access to financial data is protected even if a password leaks.\n\n*Context*\nComplements role-based access (TEID-43).", "priority": "Highest", "points": 5, "release": "mvp", "area": "security", "ac": ["Users can sign in with email and password or with Google sign-in.", "Multi-factor authentication (authenticator app) is mandatory for Owner and Billing Admin roles and optional for others; an Owner can make it mandatory for everyone.", "Idle sessions expire after 8 hours by default; the Owner can shorten this.", "After 10 failed attempts the account is locked for 15 minutes and the user is notified by email.", "All sign-ins, failed attempts, MFA changes and lockouts are recorded in the audit log (TEID-42)."], "provisional": true, "order": 2, "tests": [{"id": "TEID-91-T1", "title": "Sign in to the console with valid email and password for support@acmeco.com and confirm success, then repeat sign-in for the same account using Google sign-in and confirm it also succeeds.", "ac": 1, "type": "Functional"}, {"id": "TEID-91-T2", "title": "As an Owner, toggle Require MFA for all roles on, then attempt to sign in as an existing Support-role user with no enrolled MFA and confirm they are forced into authenticator-app enrollment before reaching the dashboard.", "ac": 2, "type": "Functional"}, {"id": "TEID-91-T3", "title": "Leave a Finance user's session idle for 8 hours and 1 minute and confirm the next action requires re-authentication, then confirm an Owner can set the idle timeout to 30 minutes and have it take effect immediately for new sessions.", "ac": 3, "type": "Functional"}, {"id": "TEID-91-T4", "title": "Attempt sign-in with an incorrect password 10 consecutive times for billing@acmeco.com and confirm the account locks for 15 minutes and a lockout notification email is sent to that address.", "ac": 4, "type": "Functional"}, {"id": "TEID-91-T5", "title": "Perform a successful sign-in, a failed sign-in, an MFA method change and an account lockout for the same test user, then confirm all four events appear in the audit log with correct event type and timestamp.", "ac": 5, "type": "Functional"}, {"id": "TEID-91-T6", "title": "Simulate 5,000 concurrent sessions reaching their 8-hour idle expiry within the same one-minute window and confirm the expiry job processes all of them without degrading sign-in latency for new logins.", "ac": 3, "type": "Non-functional"}, {"id": "TEID-91-T7", "title": "Add 500ms of simulated latency to the Google OAuth identity provider and confirm sign-in still completes within 2 seconds or fails with a clear timeout message rather than hanging.", "ac": 1, "type": "Non-functional"}, {"id": "TEID-91-T8", "title": "Script 10 failed login attempts against the same account from 10 different IP addresses within one minute and confirm the lockout still triggers based on account identity rather than being bypassed via IP rotation.", "ac": 4, "type": "Adversarial"}, {"id": "TEID-91-T9", "title": "Attempt to disable MFA on an Owner account via a direct API call while authenticated with only a password and no MFA step-up, and confirm the request is rejected.", "ac": 2, "type": "Adversarial"}]}, {"key": "TEID-42", "epic": "TEID-5", "summary": "Audit log of all configuration changes", "desc": "As a finance lead, I want a permanent record of who changed what and when, so that every pricing or balance decision can be explained to auditors.\n\n*Context*\n", "priority": "Highest", "points": 5, "release": "mvp", "area": "security", "ac": ["Every change to plans, grants, commits, overrides, caps, users and integrations is logged with who, when, what, before and after.", "Audit log entries cannot be edited or deleted.", "The audit log can be filtered by person, customer, object and date, and exported as CSV."], "order": 3, "tests": [{"id": "TEID-42-T1", "title": "Verify that every change to plans, grants, commits, overrides, caps, users and integrations is logged with who, when, what, before and after.", "ac": 1, "type": "Functional"}, {"id": "TEID-42-T2", "title": "Verify that audit log entries cannot be edited or deleted.", "ac": 2, "type": "Security"}, {"id": "TEID-42-T3", "title": "Verify that the audit log can be filtered by person, customer, object and date, and exported as CSV.", "ac": 3, "type": "Security"}]}, {"key": "TEID-92", "epic": "TEID-5", "summary": "API key lifecycle: create, scope, rotate, revoke", "desc": "As a developer at our customer, I want to manage API keys with limited scopes and rotate them without downtime, so that a leaked or outdated key never gives more access than necessary or causes an outage.", "priority": "Highest", "points": 5, "release": "mvp", "area": "security", "ac": ["Keys can be created with a scope: ingest-only, read-only, or admin, and for either sandbox or production.", "The full key is shown once at creation; Teideal stores only a hash and can never display it again.", "Rotating a key issues a new one while the old one keeps working for a grace period (default 24 hours, configurable), then stops.", "A revoked key stops working everywhere within 60 seconds.", "Each key shows its creator, scope, creation date and last-used time; creation, rotation and revocation are audit-logged."], "provisional": true, "order": 4, "tests": [{"id": "TEID-92-T1", "title": "Verify that keys can be created with a scope: ingest-only, read-only, or admin, and for either sandbox or production.", "ac": 1, "type": "Security"}, {"id": "TEID-92-T2", "title": "Verify that the full key is shown once at creation; Teideal stores only a hash and can never display it again.", "ac": 2, "type": "Security"}, {"id": "TEID-92-T3", "title": "Verify that rotating a key issues a new one while the old one keeps working for a grace period (default 24 hours, configurable), then stops.", "ac": 3, "type": "Functional"}, {"id": "TEID-92-T4", "title": "Verify that a revoked key stops working everywhere within 60 seconds.", "ac": 4, "type": "Performance"}, {"id": "TEID-92-T5", "title": "Verify that each key shows its creator, scope, creation date and last-used time; creation, rotation and revocation are audit-logged.", "ac": 5, "type": "Security"}]}, {"key": "TEID-43", "epic": "TEID-5", "summary": "Role-based access", "desc": "As a account owner, I want to give each team member only the access they need, so that support and finance can do their jobs without being able to change pricing.\n\n*Context*\n", "priority": "High", "points": 5, "release": "mvp", "area": "security", "ac": ["Built-in roles: Owner, Billing Admin, Finance (read and approve adjustments), Support (read only), Developer (API keys and sandbox).", "Each API endpoint and console screen checks the user's role.", "Role changes are recorded in the audit log.", "Single sign-on can be enabled for the account (phase 2 for SAML)."], "order": 5, "tests": [{"id": "TEID-43-T1", "title": "Verify that built-in roles: Owner, Billing Admin, Finance (read and approve adjustments), Support (read only), Developer (API keys and sandbox).", "ac": 1, "type": "Functional"}, {"id": "TEID-43-T2", "title": "Verify that each API endpoint and console screen checks the user's role.", "ac": 2, "type": "Functional"}, {"id": "TEID-43-T3", "title": "Verify that role changes are recorded in the audit log.", "ac": 3, "type": "Security"}, {"id": "TEID-43-T4", "title": "Verify that single sign-on can be enabled for the account (phase 2 for SAML).", "ac": 4, "type": "Functional"}]}, {"key": "TEID-44", "epic": "TEID-5", "summary": "Full data export", "desc": "As a account owner, I want to export all of my ledger, events and configuration at any time, so that my data is mine and I am never locked in.\n\n*Context*\n", "priority": "High", "points": 8, "release": "mvp", "area": "security", "ac": ["An owner can export the full ledger, usage events, grants and configuration in CSV, JSON and Parquet.", "A full export of all history is ready within 24 hours; smaller date ranges within 1 hour.", "Scheduled exports can be delivered daily to the customer's own cloud storage.", "The export format is documented so it can be loaded into another system."], "order": 6, "tests": [{"id": "TEID-44-T1", "title": "Verify that an owner can export the full ledger, usage events, grants and configuration in CSV, JSON and Parquet.", "ac": 1, "type": "Functional"}, {"id": "TEID-44-T2", "title": "Verify that a full export of all history is ready within 24 hours; smaller date ranges within 1 hour.", "ac": 2, "type": "Functional"}, {"id": "TEID-44-T3", "title": "Verify that scheduled exports can be delivered daily to the customer's own cloud storage.", "ac": 3, "type": "Functional"}, {"id": "TEID-44-T4", "title": "Verify that the export format is documented so it can be loaded into another system.", "ac": 4, "type": "Performance"}]}, {"key": "TEID-102", "epic": "TEID-87", "summary": "SOC 2 readiness and audit plan", "desc": "As a founder, I want a clear path to a SOC 2 Type I report and then Type II, so that security reviews stop blocking deals.", "priority": "Highest", "points": 8, "release": "mvp", "area": "security", "ac": ["An auditor and a compliance automation tool are selected and contracted.", "Controls are mapped to the Security, Availability and Confidentiality criteria, with an owner for each control.", "Evidence is collected automatically wherever the tool supports it.", "The Type I audit date and the start of the Type II observation window are set and tracked.", "Customers can see our current status (for example 'Type I complete, Type II in progress')."], "provisional": true, "order": 7, "tests": [{"id": "TEID-102-T1", "title": "Verify that an auditor and a compliance automation tool are selected and contracted.", "ac": 1, "type": "Security"}, {"id": "TEID-102-T2", "title": "Verify that controls are mapped to the Security, Availability and Confidentiality criteria, with an owner for each control.", "ac": 2, "type": "Functional"}, {"id": "TEID-102-T3", "title": "Verify that evidence is collected automatically wherever the tool supports it.", "ac": 3, "type": "Functional"}, {"id": "TEID-102-T4", "title": "Verify that the Type I audit date and the start of the Type II observation window are set and tracked.", "ac": 4, "type": "Security"}, {"id": "TEID-102-T5", "title": "Verify that customers can see our current status (for example 'Type I complete, Type II in progress').", "ac": 5, "type": "Functional"}]}, {"key": "TEID-103", "epic": "TEID-87", "summary": "Encryption in transit and at rest", "desc": "As a security reviewer at our customer, I want all data encrypted in transit and at rest with managed keys, so that our billing data is protected if storage or traffic is exposed.", "priority": "Highest", "points": 5, "release": "mvp", "area": "security", "ac": ["All external and internal traffic uses TLS 1.2 or higher.", "All databases, file storage, queues and backups are encrypted at rest.", "Encryption keys are held in a managed key service and rotated at least yearly.", "Connector credentials and personal-data fields are additionally encrypted at field level."], "provisional": true, "order": 8, "tests": [{"id": "TEID-103-T1", "title": "Verify that all external and internal traffic uses TLS 1.2 or higher.", "ac": 1, "type": "Security"}, {"id": "TEID-103-T2", "title": "Verify that all databases, file storage, queues and backups are encrypted at rest.", "ac": 2, "type": "Security"}, {"id": "TEID-103-T3", "title": "Verify that encryption keys are held in a managed key service and rotated at least yearly.", "ac": 3, "type": "Security"}, {"id": "TEID-103-T4", "title": "Verify that connector credentials and personal-data fields are additionally encrypted at field level.", "ac": 4, "type": "Security"}]}, {"key": "TEID-104", "epic": "TEID-87", "summary": "Secrets management and production access control", "desc": "As a Teideal engineer, I want secrets kept out of code and production access granted only when needed, so that a leaked repository or laptop cannot expose customer data.", "priority": "Highest", "points": 5, "release": "mvp", "area": "security", "ac": ["Automated scanning blocks any commit containing a secret.", "All secrets live in a managed secrets store, and every access is logged.", "No engineer has standing access to production data; access is granted just in time, with approval, a reason and an expiry.", "All production access sessions are logged and reviewed monthly."], "provisional": true, "order": 9, "tests": [{"id": "TEID-104-T1", "title": "Verify that automated scanning blocks any commit containing a secret.", "ac": 1, "type": "Security"}, {"id": "TEID-104-T2", "title": "Verify that all secrets live in a managed secrets store, and every access is logged.", "ac": 2, "type": "Security"}, {"id": "TEID-104-T3", "title": "Verify that no engineer has standing access to production data; access is granted just in time, with approval, a reason and an expiry.", "ac": 3, "type": "Security"}, {"id": "TEID-104-T4", "title": "Verify that all production access sessions are logged and reviewed monthly.", "ac": 4, "type": "Security"}]}, {"key": "TEID-105", "epic": "TEID-87", "summary": "Vulnerability and dependency management", "desc": "As a Teideal engineer, I want known vulnerabilities found and fixed on a defined timeline, so that we do not ship or keep running exploitable code.", "priority": "Highest", "points": 5, "release": "mvp", "area": "security", "ac": ["Dependency, container and static code scanning run on every change.", "Critical vulnerabilities are fixed within 7 days and high ones within 30 days; exceptions need a recorded approval.", "Open vulnerabilities are tracked with owners and due dates.", "A release with an unresolved critical vulnerability is blocked."], "provisional": true, "order": 10, "tests": [{"id": "TEID-105-T1", "title": "Verify that dependency, container and static code scanning run on every change.", "ac": 1, "type": "Functional"}, {"id": "TEID-105-T2", "title": "Verify that critical vulnerabilities are fixed within 7 days and high ones within 30 days; exceptions need a recorded approval.", "ac": 2, "type": "Security"}, {"id": "TEID-105-T3", "title": "Verify that open vulnerabilities are tracked with owners and due dates.", "ac": 3, "type": "Security"}, {"id": "TEID-105-T4", "title": "Verify that a release with an unresolved critical vulnerability is blocked.", "ac": 4, "type": "Security"}]}, {"key": "TEID-107", "epic": "TEID-87", "summary": "Security incident response", "desc": "As a founder, I want a tested plan for handling security incidents, so that we respond quickly and meet our notification obligations.", "priority": "Highest", "points": 3, "release": "mvp", "area": "security", "ac": ["A written incident response plan defines severity levels, roles, escalation and communication.", "Affected customers are notified without undue delay and within 72 hours of confirming a breach of their data, or sooner if their contract or local law requires it.", "A tabletop exercise is run before the first design partner goes live and at least yearly.", "Every incident has a written post-incident review with actions tracked to completion."], "provisional": true, "order": 11, "tests": [{"id": "TEID-107-T1", "title": "Verify that a written incident response plan defines severity levels, roles, escalation and communication.", "ac": 1, "type": "Functional"}, {"id": "TEID-107-T2", "title": "Verify that affected customers are notified without undue delay and within 72 hours of confirming a breach of their data, or sooner if their contract or local law requires it.", "ac": 2, "type": "Functional"}, {"id": "TEID-107-T3", "title": "Verify that a tabletop exercise is run before the first design partner goes live and at least yearly.", "ac": 3, "type": "Functional"}, {"id": "TEID-107-T4", "title": "Verify that every incident has a written post-incident review with actions tracked to completion.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-30", "epic": "TEID-3", "summary": "Usage event ingestion API", "desc": "As a developer at our customer, I want to send usage events one at a time or in batches, so that every billable action is recorded reliably.\n\n*Context*\nEach event carries an idempotency key, customer, metric, quantity, the time it happened and optional metadata.", "priority": "Highest", "points": 8, "release": "mvp", "area": "ledger", "ac": ["The API accepts single events and batches of up to 1,000 events.", "An event is only acknowledged after it has been stored durably; an acknowledged event is never lost.", "The system sustains 15,000 events per second (three times the customer's current peak) without errors or growing delay.", "Invalid events are rejected with a specific reason per event; valid events in the same batch are still accepted.", "Events are reflected in balances within 2 seconds of acknowledgement under normal load."], "order": 12, "tests": [{"id": "TEID-30-T1", "title": "Verify that the API accepts single events and batches of up to 1,000 events.", "ac": 1, "type": "Functional"}, {"id": "TEID-30-T2", "title": "Verify that an event is only acknowledged after it has been stored durably; an acknowledged event is never lost.", "ac": 2, "type": "Functional"}, {"id": "TEID-30-T3", "title": "Verify that the system sustains 15,000 events per second (three times the customer's current peak) without errors or growing delay.", "ac": 3, "type": "Performance"}, {"id": "TEID-30-T4", "title": "Verify that invalid events are rejected with a specific reason per event; valid events in the same batch are still accepted.", "ac": 4, "type": "Functional"}, {"id": "TEID-30-T5", "title": "Verify that events are reflected in balances within 2 seconds of acknowledgement under normal load.", "ac": 5, "type": "Performance"}]}, {"key": "TEID-94", "epic": "TEID-3", "summary": "Currency precision and rounding rules", "desc": "As a finance lead, I want clear, configurable rules for how and when amounts are rounded, so that 'matched to the cent' means the same thing in Teideal as in our billing system.\n\n*Context*\nRounding differences are the most common source of false mismatches in verification (TEID-69).", "priority": "Highest", "points": 5, "release": "mvp", "area": "ledger", "ac": ["Each currency uses its official number of decimal places (for example 2 for USD and INR, 0 for JPY, 3 for KWD).", "All calculations use exact decimal arithmetic; floating-point numbers are never used for money, and an automated check blocks code that does.", "Rounding happens only at defined points: by default per invoice line, configurable to per invoice or per event.", "The rounding method is configurable (round half up by default, or round half to even), per tenant and per imported billing system so Verify can match it.", "The lines of an invoice always add up exactly to the invoice total, and any rounding difference is recorded as its own ledger entry."], "provisional": true, "order": 13, "tests": [{"id": "TEID-94-T1", "title": "Verify that each currency uses its official number of decimal places (for example 2 for USD and INR, 0 for JPY, 3 for KWD).", "ac": 1, "type": "Functional"}, {"id": "TEID-94-T2", "title": "Verify that all calculations use exact decimal arithmetic; floating-point numbers are never used for money, and an automated check blocks code that does.", "ac": 2, "type": "Functional"}, {"id": "TEID-94-T3", "title": "Verify that rounding happens only at defined points: by default per invoice line, configurable to per invoice or per event.", "ac": 3, "type": "Functional"}, {"id": "TEID-94-T4", "title": "Verify that the rounding method is configurable (round half up by default, or round half to even), per tenant and per imported billing system so Verify can match it.", "ac": 4, "type": "Functional"}, {"id": "TEID-94-T5", "title": "Verify that the lines of an invoice always add up exactly to the invoice total, and any rounding difference is recorded as its own ledger entry.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-95", "epic": "TEID-3", "summary": "Sub-cent unit prices and very large quantities", "desc": "As a billing operator, I want to price usage at fractions of a cent and bill very large quantities accurately, so that per-token and per-request pricing is represented exactly.\n\n*Context*\nExample: 0.0000015 USD per token over billions of tokens.", "priority": "Highest", "points": 3, "release": "mvp", "area": "ledger", "ac": ["Unit prices support at least 12 decimal places.", "Quantities up to one trillion units per event and per period are handled without overflow or loss of precision.", "A test prices 3 billion tokens at 0.0000015 USD and produces exactly 4,500.00 USD.", "Unit prices are shown in full precision in the console and exports, and rounded only on invoices."], "provisional": true, "order": 14, "tests": [{"id": "TEID-95-T1", "title": "Verify that unit prices support at least 12 decimal places.", "ac": 1, "type": "Functional"}, {"id": "TEID-95-T2", "title": "Verify that quantities up to one trillion units per event and per period are handled without overflow or loss of precision.", "ac": 2, "type": "Functional"}, {"id": "TEID-95-T3", "title": "Verify that a test prices 3 billion tokens at 0.0000015 USD and produces exactly 4,500.00 USD.", "ac": 3, "type": "Functional"}, {"id": "TEID-95-T4", "title": "Verify that unit prices are shown in full precision in the console and exports, and rounded only on invoices.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-96", "epic": "TEID-3", "summary": "Billing periods, time zones and boundary rules", "desc": "As a finance lead, I want billing periods to start and end at the right moment in each customer's time zone, so that events near midnight, month end or clock changes are always assigned to the correct period.", "priority": "Highest", "points": 5, "release": "mvp", "area": "ledger", "ac": ["All event times are stored in UTC.", "Each customer has a billing time zone (default UTC), and period boundaries are calculated in that zone, including daylight-saving changes.", "An event timestamped exactly on a boundary belongs to the new period; this rule is documented.", "Month-end anchors are handled consistently (a subscription anchored on the 31st bills on the last day of shorter months).", "Automated tests cover daylight-saving transition days, month ends, year ends and 29 February."], "provisional": true, "order": 15, "tests": [{"id": "TEID-96-T1", "title": "Verify that all event times are stored in UTC.", "ac": 1, "type": "Functional"}, {"id": "TEID-96-T2", "title": "Verify that each customer has a billing time zone (default UTC), and period boundaries are calculated in that zone, including daylight-saving changes.", "ac": 2, "type": "Functional"}, {"id": "TEID-96-T3", "title": "Verify that an event timestamped exactly on a boundary belongs to the new period; this rule is documented.", "ac": 3, "type": "Functional"}, {"id": "TEID-96-T4", "title": "Verify that month-end anchors are handled consistently (a subscription anchored on the 31st bills on the last day of shorter months).", "ac": 4, "type": "Functional"}, {"id": "TEID-96-T5", "title": "Verify that automated tests cover daylight-saving transition days, month ends, year ends and 29 February.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-31", "epic": "TEID-3", "summary": "Enforced idempotency", "desc": "As a developer at our customer, I want to safely retry sending any event without risk of double charging, so that network failures and retries never create duplicate charges.\n\n*Context*\nIdempotency must be guaranteed by the database, not by application code that can have bugs.", "priority": "Highest", "points": 5, "release": "mvp", "area": "ledger", "ac": ["An event with an idempotency key already seen is acknowledged but not applied again, and the response says it was a duplicate.", "Keys are remembered for at least the longest billing period plus 7 days.", "If a repeated key arrives with different contents, it is rejected and flagged for review rather than silently ignored.", "Uniqueness is enforced by the data store itself; a test that sends the same event from 50 parallel workers results in exactly one ledger entry."], "order": 16, "tests": [{"id": "TEID-31-T1", "title": "Verify that an event with an idempotency key already seen is acknowledged but not applied again, and the response says it was a duplicate.", "ac": 1, "type": "Functional"}, {"id": "TEID-31-T2", "title": "Verify that keys are remembered for at least the longest billing period plus 7 days.", "ac": 2, "type": "Functional"}, {"id": "TEID-31-T3", "title": "Verify that if a repeated key arrives with different contents, it is rejected and flagged for review rather than silently ignored.", "ac": 3, "type": "Functional"}, {"id": "TEID-31-T4", "title": "Verify that uniqueness is enforced by the data store itself; a test that sends the same event from 50 parallel workers results in exactly one ledger entry.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-32", "epic": "TEID-3", "summary": "Append-only double-entry ledger", "desc": "As a finance lead, I want every balance change recorded as a permanent entry that shows what caused it, so that every number we bill can be traced and audited.\n\n*Context*\nCorrections are made by adding reversing entries, never by editing or deleting.", "priority": "Highest", "points": 13, "release": "mvp", "area": "ledger", "ac": ["Ledger entries can be added but never edited or deleted, by anyone, including our own staff.", "Each entry records the cause: the usage event, grant, reservation, rule and plan version involved.", "Every transaction is double-entry: the amounts across its accounts always sum to zero.", "Corrections appear as new reversing entries linked to the entry they correct.", "A daily automated check confirms that every transaction balances; any failure pages the on-call engineer."], "order": 17, "tests": [{"id": "TEID-32-T1", "title": "Verify that ledger entries can be added but never edited or deleted, by anyone, including our own staff.", "ac": 1, "type": "Functional"}, {"id": "TEID-32-T2", "title": "Verify that each entry records the cause: the usage event, grant, reservation, rule and plan version involved.", "ac": 2, "type": "Functional"}, {"id": "TEID-32-T3", "title": "Verify that every transaction is double-entry: the amounts across its accounts always sum to zero.", "ac": 3, "type": "Functional"}, {"id": "TEID-32-T4", "title": "Verify that corrections appear as new reversing entries linked to the entry they correct.", "ac": 4, "type": "Functional"}, {"id": "TEID-32-T5", "title": "Verify that a daily automated check confirms that every transaction balances; any failure pages the on-call engineer.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-33", "epic": "TEID-3", "summary": "Balances derived from the ledger", "desc": "As a finance lead, I want balances that are always calculated from the ledger rather than stored as a separate number, so that balances can never drift from the underlying record.\n\n*Context*\nFor speed, balances may be cached, but the ledger is always the source of truth.", "priority": "Highest", "points": 8, "release": "mvp", "area": "ledger", "ac": ["Any customer balance can be recalculated from the ledger alone.", "An automated check at least every hour compares cached balances to recalculated ones for every customer.", "Any mismatch pages on-call and is shown on an internal integrity dashboard.", "Operators can trigger a recalculation for a single customer and see the result."], "order": 18, "tests": [{"id": "TEID-33-T1", "title": "Verify that any customer balance can be recalculated from the ledger alone.", "ac": 1, "type": "Functional"}, {"id": "TEID-33-T2", "title": "Verify that an automated check at least every hour compares cached balances to recalculated ones for every customer.", "ac": 2, "type": "Functional"}, {"id": "TEID-33-T3", "title": "Verify that any mismatch pages on-call and is shown on an internal integrity dashboard.", "ac": 3, "type": "Functional"}, {"id": "TEID-33-T4", "title": "Verify that operators can trigger a recalculation for a single customer and see the result.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-35", "epic": "TEID-3", "summary": "Same result regardless of event order", "desc": "As a finance lead, I want balances to end up identical no matter what order events arrive in, so that network delays and retries never change what a customer pays.\n\n*Context*\n", "priority": "Highest", "points": 5, "release": "mvp", "area": "ledger", "ac": ["Processing the same set of events in any order produces identical final balances and invoice totals.", "An automated test replays a real-sized sample of events in at least 100 random orders and compares the results.", "Where order genuinely matters (for example, the event that exhausts a commit), the event's timestamp decides, with a documented tie-break rule."], "order": 19, "tests": [{"id": "TEID-35-T1", "title": "Verify that processing the same set of events in any order produces identical final balances and invoice totals.", "ac": 1, "type": "Functional"}, {"id": "TEID-35-T2", "title": "Verify that an automated test replays a real-sized sample of events in at least 100 random orders and compares the results.", "ac": 2, "type": "Functional"}, {"id": "TEID-35-T3", "title": "Verify that where order genuinely matters (for example, the event that exhausts a commit), the event's timestamp decides, with a documented tie-break rule.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-34", "epic": "TEID-3", "summary": "Handle late-arriving events", "desc": "As a finance lead, I want usage that arrives after its billing period has closed to be handled visibly and with approval, so that invoices never change silently.\n\n*Context*\nThe time the event happened, not the time it arrived, decides which period it belongs to.", "priority": "High", "points": 8, "release": "mvp", "area": "ledger", "ac": ["An event is assigned to the billing period in which it happened.", "If that period is still open, the event is applied normally.", "If the period is closed, the event goes into an adjustments queue instead of changing the closed invoice.", "An operator can approve or reject queued adjustments, and can set automatic approval below a value threshold.", "Approved adjustments appear on the next invoice as clearly labelled prior-period lines."], "order": 20, "tests": [{"id": "TEID-34-T1", "title": "Verify that an event is assigned to the billing period in which it happened.", "ac": 1, "type": "Functional"}, {"id": "TEID-34-T2", "title": "Verify that if that period is still open, the event is applied normally.", "ac": 2, "type": "Functional"}, {"id": "TEID-34-T3", "title": "Verify that if the period is closed, the event goes into an adjustments queue instead of changing the closed invoice.", "ac": 3, "type": "Functional"}, {"id": "TEID-34-T4", "title": "Verify that an operator can approve or reject queued adjustments, and can set automatic approval below a value threshold.", "ac": 4, "type": "Functional"}, {"id": "TEID-34-T5", "title": "Verify that approved adjustments appear on the next invoice as clearly labelled prior-period lines.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-97", "epic": "TEID-3", "summary": "Multi-currency pricing and exchange rates", "desc": "As a finance lead, I want to bill customers in different currencies with exchange rates handled transparently, so that international customers are billed correctly and currency effects are not mistaken for billing errors.", "priority": "High", "points": 8, "release": "mvp", "area": "ledger", "ac": ["Each customer contract has one billing currency.", "Prices can be set per currency, or converted from a base currency using a named exchange-rate source.", "Every converted amount records the rate, its source and its timestamp on the ledger.", "The rate policy is configurable: rate at the time of the event, or a single rate fixed at period close.", "Verify compares amounts in the invoice currency and reports exchange-rate differences in their own category, separate from billing errors."], "provisional": true, "order": 21, "tests": [{"id": "TEID-97-T1", "title": "Verify that each customer contract has one billing currency.", "ac": 1, "type": "Functional"}, {"id": "TEID-97-T2", "title": "Verify that prices can be set per currency, or converted from a base currency using a named exchange-rate source.", "ac": 2, "type": "Functional"}, {"id": "TEID-97-T3", "title": "Verify that every converted amount records the rate, its source and its timestamp on the ledger.", "ac": 3, "type": "Functional"}, {"id": "TEID-97-T4", "title": "Verify that the rate policy is configurable: rate at the time of the event, or a single rate fixed at period close.", "ac": 4, "type": "Functional"}, {"id": "TEID-97-T5", "title": "Verify that verify compares amounts in the invoice currency and reports exchange-rate differences in their own category, separate from billing errors.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-81", "epic": "TEID-14", "summary": "Publish the core as open source", "desc": "As a developer evaluating Teideal, I want to read and run the ledger and verification engine myself, so that I can trust how my money is calculated.\n\n*Context*\nThe licence choice (for example Apache 2.0 or AGPL) is a business decision to make and record before launch.", "priority": "High", "points": 5, "release": "mvp", "area": "open-source", "ac": ["The ledger, re-rating and matching engine are published in a public repository.", "The licence decision and its reasons are recorded in the repository.", "Every change runs the full test suite in public CI.", "A contribution guide and security reporting process are published."], "order": 22, "tests": [{"id": "TEID-81-T1", "title": "Verify that the ledger, re-rating and matching engine are published in a public repository.", "ac": 1, "type": "Functional"}, {"id": "TEID-81-T2", "title": "Verify that the licence decision and its reasons are recorded in the repository.", "ac": 2, "type": "Functional"}, {"id": "TEID-81-T3", "title": "Verify that every change runs the full test suite in public CI.", "ac": 3, "type": "Functional"}, {"id": "TEID-81-T4", "title": "Verify that a contribution guide and security reporting process are published.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-82", "epic": "TEID-14", "summary": "Public correctness test suite", "desc": "As a security reviewer at our customer, I want to run the tests that prove Teideal's money guarantees, so that I do not have to take those guarantees on trust.\n\n*Context*\n", "priority": "High", "points": 8, "release": "mvp", "area": "open-source", "ac": ["The suite covers duplicate events, out-of-order events, crashes mid-write, concurrent writers and late events.", "Anyone can run it locally with one command.", "Results are published for every release, and a release that fails any test is not shipped."], "order": 23, "tests": [{"id": "TEID-82-T1", "title": "Verify that the suite covers duplicate events, out-of-order events, crashes mid-write, concurrent writers and late events.", "ac": 1, "type": "Functional"}, {"id": "TEID-82-T2", "title": "Verify that anyone can run it locally with one command.", "ac": 2, "type": "Functional"}, {"id": "TEID-82-T3", "title": "Verify that results are published for every release, and a release that fails any test is not shipped.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-84", "epic": "TEID-14", "summary": "Published guarantees page", "desc": "As a founder evaluating Teideal, I want a plain-English page listing every guarantee Teideal makes about money, so that I know exactly what I am relying on.\n\n*Context*\n", "priority": "High", "points": 2, "release": "mvp", "area": "open-source", "ac": ["The page lists each guarantee (for example: exactly-once accounting, same result regardless of order, read-only verification).", "Each guarantee links to the tests in TEID-82 that prove it.", "Any known limitation is stated on the same page."], "order": 24, "tests": [{"id": "TEID-84-T1", "title": "Verify that the page lists each guarantee (for example: exactly-once accounting, same result regardless of order, read-only verification).", "ac": 1, "type": "Security"}, {"id": "TEID-84-T2", "title": "Verify that each guarantee links to the tests in TEID-82 that prove it.", "ac": 2, "type": "Functional"}, {"id": "TEID-84-T3", "title": "Verify that any known limitation is stated on the same page.", "ac": 3, "type": "Functional"}]}, {"key": "TEID-117", "epic": "TEID-89", "summary": "Service level objectives", "desc": "As a founder, I want measurable service level objectives for each part of Teideal, so that we know when reliability is slipping before customers do.", "priority": "Highest", "points": 3, "release": "mvp", "area": "reliability", "ac": ["Objectives are defined and published internally: ingestion API availability of 99.9% at MVP, zero loss of acknowledged events, and Verify data no more than 2 hours old.", "Each objective is measured continuously and shown on a dashboard with its remaining error budget.", "When an error budget is exhausted, feature releases pause until reliability work restores it."], "provisional": true, "order": 25, "tests": [{"id": "TEID-117-T1", "title": "Verify that objectives are defined and published internally: ingestion API availability of 99.9% at MVP, zero loss of acknowledged events, and Verify data no more than 2 hours old.", "ac": 1, "type": "Functional"}, {"id": "TEID-117-T2", "title": "Verify that each objective is measured continuously and shown on a dashboard with its remaining error budget.", "ac": 2, "type": "Functional"}, {"id": "TEID-117-T3", "title": "Verify that when an error budget is exhausted, feature releases pause until reliability work restores it.", "ac": 3, "type": "Resilience"}]}, {"key": "TEID-118", "epic": "TEID-89", "summary": "Monitoring, alerting and on-call", "desc": "As a Teideal engineer, I want monitoring and paging for every critical failure, so that problems are fixed quickly at any hour.", "priority": "Highest", "points": 5, "release": "mvp", "area": "reliability", "ac": ["Metrics, logs and traces are collected for all services, without personal data in logs.", "Alerts fire on objective burn rate, ledger integrity check failures (TEID-32, TEID-33), connector sync failures and ingestion backlogs.", "An on-call rota pages a named engineer, with escalation if unacknowledged within 15 minutes.", "Every alert links to a runbook describing how to respond."], "provisional": true, "order": 26, "tests": [{"id": "TEID-118-T1", "title": "Verify that metrics, logs and traces are collected for all services, without personal data in logs.", "ac": 1, "type": "Functional"}, {"id": "TEID-118-T2", "title": "Verify that alerts fire on objective burn rate, ledger integrity check failures (TEID-32, TEID-33), connector sync failures and ingestion backlogs.", "ac": 2, "type": "Functional"}, {"id": "TEID-118-T3", "title": "Verify that an on-call rota pages a named engineer, with escalation if unacknowledged within 15 minutes.", "ac": 3, "type": "Performance"}, {"id": "TEID-118-T4", "title": "Verify that every alert links to a runbook describing how to respond.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-119", "epic": "TEID-89", "summary": "Backups and point-in-time recovery", "desc": "As a founder, I want the ledger to be recoverable to any recent moment, so that no failure or mistake can permanently lose financial records.", "priority": "Highest", "points": 5, "release": "mvp", "area": "reliability", "ac": ["Databases are backed up continuously with point-in-time recovery for at least 14 days.", "At MVP, data loss after recovery is at most 5 minutes (RPO) and service is restored within 4 hours (RTO).", "Backups are encrypted and stored in a separate account from production.", "A restore is tested every month, and ledger integrity checks pass on the restored copy."], "provisional": true, "order": 27, "tests": [{"id": "TEID-119-T1", "title": "Verify that databases are backed up continuously with point-in-time recovery for at least 14 days.", "ac": 1, "type": "Resilience"}, {"id": "TEID-119-T2", "title": "Verify that at MVP, data loss after recovery is at most 5 minutes (RPO) and service is restored within 4 hours (RTO).", "ac": 2, "type": "Resilience"}, {"id": "TEID-119-T3", "title": "Verify that backups are encrypted and stored in a separate account from production.", "ac": 3, "type": "Security"}, {"id": "TEID-119-T4", "title": "Verify that a restore is tested every month, and ledger integrity checks pass on the restored copy.", "ac": 4, "type": "Resilience"}]}, {"key": "TEID-121", "epic": "TEID-89", "summary": "Zero-downtime deploys and safe migrations", "desc": "As a Teideal engineer, I want to deploy and change the database schema without losing or double-counting events, so that deploys never cause the balance drift our customers suffer today.\n\n*Context*\nThe founder brief described events lost during a deploy; Teideal must never do the same.", "priority": "Highest", "points": 5, "release": "mvp", "area": "reliability", "ac": ["Deploys roll out gradually without dropping acknowledged events or in-flight requests.", "Schema changes are backward compatible for at least one release so old and new versions can run together.", "A bad deploy can be rolled back within 15 minutes.", "Ledger integrity checks run automatically after every production deploy."], "provisional": true, "order": 28, "tests": [{"id": "TEID-121-T1", "title": "Verify that deploys roll out gradually without dropping acknowledged events or in-flight requests.", "ac": 1, "type": "Functional"}, {"id": "TEID-121-T2", "title": "Verify that schema changes are backward compatible for at least one release so old and new versions can run together.", "ac": 2, "type": "Functional"}, {"id": "TEID-121-T3", "title": "Verify that a bad deploy can be rolled back within 15 minutes.", "ac": 3, "type": "Performance"}, {"id": "TEID-121-T4", "title": "Verify that ledger integrity checks run automatically after every production deploy.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-16", "epic": "TEID-1", "summary": "Define plans as configuration", "desc": "As a billing operator, I want to create a plan with included credits, per-unit rates by metric and model, caps and a billing interval, so that new pricing can go live without an engineer writing code.\n\n*Context*\nA plan is the template a subscription is created from. It must cover self-serve credit plans and enterprise plans.", "priority": "Highest", "points": 5, "release": "mvp", "area": "entitlement-model", "ac": ["An operator can create a plan through both the API and the admin console.", "A plan can include: name, currency, billing interval, included credits, a rate for each metric and model, and optional hard or soft caps.", "The system rejects a plan that is missing a currency, a billing interval, or a rate for any metric it lists, and says exactly what is missing.", "A newly saved plan is a draft and affects no customers until it is published.", "Publishing a plan creates version 1 and records who published it and when."], "order": 29, "tests": [{"id": "TEID-16-T1", "title": "Verify that an operator can create a plan through both the API and the admin console.", "ac": 1, "type": "Functional"}, {"id": "TEID-16-T2", "title": "Verify that a plan can include: name, currency, billing interval, included credits, a rate for each metric and model, and optional hard or soft caps.", "ac": 2, "type": "Functional"}, {"id": "TEID-16-T3", "title": "Verify that the system rejects a plan that is missing a currency, a billing interval, or a rate for any metric it lists, and says exactly what is missing.", "ac": 3, "type": "Functional"}, {"id": "TEID-16-T4", "title": "Verify that a newly saved plan is a draft and affects no customers until it is published.", "ac": 4, "type": "Functional"}, {"id": "TEID-16-T5", "title": "Verify that publishing a plan creates version 1 and records who published it and when.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-17", "epic": "TEID-1", "summary": "Issue credit grants with expiry", "desc": "As a billing operator, I want to give a customer prepaid, recurring or promotional credits, each with its own start and expiry date, so that I can run promotions and sell credit packs without manual balance edits.\n\n*Context*\nGrants are the only way credits enter a customer's balance. Every grant must be traceable.", "priority": "Highest", "points": 5, "release": "mvp", "area": "entitlement-model", "ac": ["A grant records amount, unit or currency, source (paid, promotional, commit, goodwill), start date, optional expiry date and the person or system that created it.", "A grant cannot be consumed before its start date or after its expiry time (evaluated in UTC).", "When a grant expires with unused credit, the system writes a ledger entry for the expired amount so finance can report it.", "A recurring grant is issued exactly once per period, even if the scheduler runs twice or retries after a failure.", "An operator can void a grant with a mandatory reason; voiding writes a reversing ledger entry and never deletes history."], "order": 30, "tests": [{"id": "TEID-17-T1", "title": "Verify that a grant records amount, unit or currency, source (paid, promotional, commit, goodwill), start date, optional expiry date and the person or system that created it.", "ac": 1, "type": "Functional"}, {"id": "TEID-17-T2", "title": "Verify that a grant cannot be consumed before its start date or after its expiry time (evaluated in UTC).", "ac": 2, "type": "Functional"}, {"id": "TEID-17-T3", "title": "Verify that when a grant expires with unused credit, the system writes a ledger entry for the expired amount so finance can report it.", "ac": 3, "type": "Functional"}, {"id": "TEID-17-T4", "title": "Verify that a recurring grant is issued exactly once per period, even if the scheduler runs twice or retries after a failure.", "ac": 4, "type": "Resilience"}, {"id": "TEID-17-T5", "title": "Verify that an operator can void a grant with a mandatory reason; voiding writes a reversing ledger entry and never deletes history.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-18", "epic": "TEID-1", "summary": "Configure credit consumption order", "desc": "As a billing operator, I want to define the order in which a customer's grants are used up, so that customers always consume credits in the order their contract promises.\n\n*Context*\nCustomers often hold several grants at once (a promo, a paid pack, a commit). The order must be predictable and explainable.", "priority": "Highest", "points": 5, "release": "mvp", "area": "entitlement-model", "ac": ["The default order is: soonest-expiring promotional credits, then paid credits, then commit, then overage.", "An operator can change the order for a plan or for a single customer.", "Given the same grants and the same usage, the system always produces the same result.", "When one usage event draws from more than one grant, the ledger shows each grant and the amount taken from it.", "The customer timeline shows which grant paid for each usage event."], "order": 31, "tests": [{"id": "TEID-18-T1", "title": "Verify that the default order is: soonest-expiring promotional credits, then paid credits, then commit, then overage.", "ac": 1, "type": "Functional"}, {"id": "TEID-18-T2", "title": "Verify that an operator can change the order for a plan or for a single customer.", "ac": 2, "type": "Functional"}, {"id": "TEID-18-T3", "title": "Verify that given the same grants and the same usage, the system always produces the same result.", "ac": 3, "type": "Functional"}, {"id": "TEID-18-T4", "title": "Verify that when one usage event draws from more than one grant, the ledger shows each grant and the amount taken from it.", "ac": 4, "type": "Functional"}, {"id": "TEID-18-T5", "title": "Verify that the customer timeline shows which grant paid for each usage event.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-19", "epic": "TEID-1", "summary": "Annual commits with monthly drawdown", "desc": "As a billing operator, I want to set up an annual commit that customers draw down as they use the product, with an overage rate once it is used up, so that enterprise contracts are enforced exactly as signed.\n\n*Context*\nExample: a 250,000 USD annual commit drawn down monthly, with a contracted overage rate afterwards.", "priority": "Highest", "points": 8, "release": "mvp", "area": "entitlement-model", "ac": ["An operator can create a commit with amount, term start and end, drawdown schedule (upfront, monthly or quarterly) and overage rate.", "Usage draws down the commit in real time and the remaining amount is visible at any moment.", "Overage pricing starts at exactly the event that exhausts the commit; an event that straddles the boundary is split correctly.", "At the end of the term, any unused commit is reported as a separate line for finance and does not carry over unless the contract says so.", "Changes to a live commit require a reason and are recorded in the audit log."], "order": 32, "tests": [{"id": "TEID-19-T1", "title": "Verify that an operator can create a commit with amount, term start and end, drawdown schedule (upfront, monthly or quarterly) and overage rate.", "ac": 1, "type": "Functional"}, {"id": "TEID-19-T2", "title": "Verify that usage draws down the commit in real time and the remaining amount is visible at any moment.", "ac": 2, "type": "Functional"}, {"id": "TEID-19-T3", "title": "Verify that overage pricing starts at exactly the event that exhausts the commit; an event that straddles the boundary is split correctly.", "ac": 3, "type": "Functional"}, {"id": "TEID-19-T4", "title": "Verify that at the end of the term, any unused commit is reported as a separate line for finance and does not carry over unless the contract says so.", "ac": 4, "type": "Functional"}, {"id": "TEID-19-T5", "title": "Verify that changes to a live commit require a reason and are recorded in the audit log.", "ac": 5, "type": "Security"}]}, {"key": "TEID-20", "epic": "TEID-1", "summary": "Per-customer rate overrides", "desc": "As a billing operator, I want to give one customer a special rate on a specific model or metric for a set period, so that negotiated discounts are applied without code changes.\n\n*Context*\nSales routinely agrees discounts on a single model. Today these live as if-statements in production.", "priority": "High", "points": 3, "release": "mvp", "area": "entitlement-model", "ac": ["An operator can set an override rate for a customer on any metric or model, with a start date and optional end date.", "When an override is active it always takes precedence over the plan rate; the rules for precedence are documented in the console.", "Every usage event priced with an override records the override's ID in the ledger.", "When the override ends, pricing returns to the plan rate from the next event onwards with no manual step."], "order": 33, "tests": [{"id": "TEID-20-T1", "title": "Verify that an operator can set an override rate for a customer on any metric or model, with a start date and optional end date.", "ac": 1, "type": "Functional"}, {"id": "TEID-20-T2", "title": "Verify that when an override is active it always takes precedence over the plan rate; the rules for precedence are documented in the console.", "ac": 2, "type": "Functional"}, {"id": "TEID-20-T3", "title": "Verify that every usage event priced with an override records the override's ID in the ledger.", "ac": 3, "type": "Functional"}, {"id": "TEID-20-T4", "title": "Verify that when the override ends, pricing returns to the plan rate from the next event onwards with no manual step.", "ac": 4, "type": "Functional"}]}, {"key": "TEID-22", "epic": "TEID-1", "summary": "Customer hierarchy with pooled and isolated balances", "desc": "As a billing operator, I want to model an enterprise as an organisation with teams and API keys, choosing whether balances are shared or separate, so that limits and balances match how the customer's contract is actually structured.\n\n*Context*\nSome enterprise contracts pool credit across teams; others give each team its own budget.", "priority": "High", "points": 8, "release": "mvp", "area": "entitlement-model", "ac": ["An operator can create organisations, teams under organisations, and API keys under teams.", "Each level can be set to use a pooled balance (shared with its parent) or an isolated balance.", "A request is checked against every level above it, and the most restrictive limit wins.", "Moving a team to a different organisation keeps its history and is recorded in the audit log."], "order": 34, "tests": [{"id": "TEID-22-T1", "title": "Verify that an operator can create organisations, teams under organisations, and API keys under teams.", "ac": 1, "type": "Functional"}, {"id": "TEID-22-T2", "title": "Verify that each level can be set to use a pooled balance (shared with its parent) or an isolated balance.", "ac": 2, "type": "Functional"}, {"id": "TEID-22-T3", "title": "Verify that a request is checked against every level above it, and the most restrictive limit wins.", "ac": 3, "type": "Functional"}, {"id": "TEID-22-T4", "title": "Verify that moving a team to a different organisation keeps its history and is recorded in the audit log.", "ac": 4, "type": "Security"}]}, {"key": "TEID-23", "epic": "TEID-1", "summary": "Versioned pricing and scheduled migrations", "desc": "As a billing operator, I want to publish a new pricing version and choose when, or whether, each customer moves to it, so that I can reprice safely whenever model costs change.\n\n*Context*\nPrices change every few months. Old and new logic must never collide within a billing period.", "priority": "High", "points": 8, "release": "mvp", "area": "entitlement-model", "ac": ["Publishing changes to a plan creates a new version; existing subscriptions stay on their current version.", "An operator can schedule customers to move to a new version at their next period boundary or a chosen date.", "An operator can keep (grandfather) any customer on an old version indefinitely.", "Every priced usage event records the plan version used, and no single event is priced by two versions.", "Before a migration runs, the operator sees how many customers will move and when."], "order": 35, "tests": [{"id": "TEID-23-T1", "title": "Verify that publishing changes to a plan creates a new version; existing subscriptions stay on their current version.", "ac": 1, "type": "Functional"}, {"id": "TEID-23-T2", "title": "Verify that an operator can schedule customers to move to a new version at their next period boundary or a chosen date.", "ac": 2, "type": "Functional"}, {"id": "TEID-23-T3", "title": "Verify that an operator can keep (grandfather) any customer on an old version indefinitely.", "ac": 3, "type": "Functional"}, {"id": "TEID-23-T4", "title": "Verify that every priced usage event records the plan version used, and no single event is priced by two versions.", "ac": 4, "type": "Functional"}, {"id": "TEID-23-T5", "title": "Verify that before a migration runs, the operator sees how many customers will move and when.", "ac": 5, "type": "Functional"}]}, {"key": "TEID-37", "epic": "TEID-4", "summary": "Connect a Stripe account, read-only first", "desc": "As a billing operator, I want to connect our Stripe account with read-only access to start, so that Teideal can verify our billing without being able to change anything.\n\n*Context*\nCustomers grant read access for Verify on day one. Write access is a separate, later decision when they move billing onto Teideal.", "priority": "Highest", "points": 3, "release": "mvp", "area": "stripe", "ac": ["An operator can connect Stripe using Stripe's standard authorisation flow.", "By default only read access is requested, and the connection screen states that Teideal cannot change anything in Stripe.", "Write access is requested separately, only when the operator enables invoice sync or credit grants (TEID-39, TEID-40).", "No card or bank details are ever stored in our system.", "Disconnecting stops all access to Stripe immediately and is recorded in the audit log."], "order": 36, "tests": [{"id": "TEID-37-T1", "title": "Verify that an operator can connect Stripe using Stripe's standard authorisation flow.", "ac": 1, "type": "Functional"}, {"id": "TEID-37-T2", "title": "Verify that by default only read access is requested, and the connection screen states that Teideal cannot change anything in Stripe.", "ac": 2, "type": "Security"},
