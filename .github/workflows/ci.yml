name: CI

on:
  push:
  pull_request:

env:
  DATABASE_URL: postgres://teideal_app:teideal_app_dev_password@127.0.0.1:5432/teideal
  ADMIN_SECRET: ci_admin_secret
  TS_CONSOLE_URL: http://127.0.0.1:8081
  GO_USAGE_URL: http://127.0.0.1:8082
  FAKE_GOOGLE_URL: http://127.0.0.1:8090
  FAKE_S3_URL: http://127.0.0.1:8091
  FAKE_STRIPE_URL: http://127.0.0.1:8092
  ONCALL_ALERT_WEBHOOK_URL: http://127.0.0.1:8093/alerts
  AWS_ENDPOINT_URL_OVERRIDE: http://127.0.0.1:8091
  CI: "true"
  PGPASSWORD: postgres
  SUPERUSER_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/teideal

jobs:
  # TEID-41-AC2/T2/T5/T7/T8: the cross-tenant isolation regression suite,
  # run against real running services and a real Postgres on every push.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teideal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply database migrations
        run: PSQL_SUPERUSER=postgres bash db/setup-local.sh

      - name: Seed test fixtures (dev tenants, API keys, one customer each)
        run: PSQL_SUPERUSER=postgres bash db/seed-test-fixtures.sh

      - name: Seed console-auth fixture users (TEID-91)
        run: PSQL_SUPERUSER=postgres bash db/seed-console-auth-fixtures.sh

      - name: Build and start go-usage
        working-directory: services/go-usage
        run: |
          go build -o /tmp/go-usage ./cmd/server
          PORT=8082 DATABASE_URL="$DATABASE_URL" DISABLE_BACKGROUND_WORKERS=true /tmp/go-usage &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8082/healthz && break; sleep 1; done

      - name: Reject floating-point types in money code (TEID-94-T2/T6)
        working-directory: services/go-usage
        run: go run ./tools/checkmoney ./internal/money

      - name: Install and start the fake Google IdP (TEID-91-T1/T7 test double)
        working-directory: tests/console-auth
        run: |
          npm ci
          FAKE_GOOGLE_PORT=8090 npx tsx fake-google.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/healthz && break; sleep 1; done

      - name: Install and start the fake S3/STS service (TEID-44-T3/T6/T8 test double)
        working-directory: tests/data-export
        run: |
          npm ci
          FAKE_S3_PORT=8091 npx tsx fake-s3.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8091/healthz && break; sleep 1; done

      - name: Install and start the fake Stripe service
        working-directory: tests/stripe-connect
        run: |
          npm ci
          FAKE_STRIPE_PORT=8092 npx tsx fake-stripe.ts &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8092/healthz && break; sleep 1; done

      - name: Install and start ts-console
        working-directory: services/ts-console
        run: |
          npm ci
          npm run build
          PORT=8081 DATABASE_URL="$DATABASE_URL" ADMIN_SECRET="$ADMIN_SECRET" \
            NODE_ENV=test AWS_ENDPOINT_URL_OVERRIDE="$AWS_ENDPOINT_URL_OVERRIDE" EXPORT_STORAGE_DIR=/tmp/teideal-exports \
            GOOGLE_JWKS_URL="$FAKE_GOOGLE_URL/jwks" GOOGLE_ISSUER="$FAKE_GOOGLE_URL" GOOGLE_AUDIENCE="teideal-console-test" \
            GOOGLE_JWKS_CACHE_MAX_AGE_MS=0 \
            STRIPE_CONNECT_BASE_URL="$FAKE_STRIPE_URL" \
            STRIPE_API_BASE_URL="$FAKE_STRIPE_URL" \
            STRIPE_CONNECT_CLIENT_ID=ca_test_teideal \
            STRIPE_CONNECT_CLIENT_SECRET=sk_test_teideal_connect_secret \
            STRIPE_CONNECT_REDIRECT_URI=http://127.0.0.1:8081/stripe/connect/oauth/return \
            STRIPE_TOKEN_ENCRYPTION_KEY="02DWhpwMvIIHYMC/Z73W+qfHPlGd/gBN3riv9zqXQmY=" \
            node dist/server.js &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8081/healthz && break; sleep 1; done

      - name: Install cross-tenant suite dependencies
        working-directory: tests/cross-tenant
        run: npm ci

      # TEID-41-T1/T2/T3/T4/T6/T7/T8 run here; T5 (the <15 min budget) is
      # enforced by measure-duration.mjs wrapping this same run.
      - name: Run TEID-41 acceptance suite (RLS audit, cross-tenant regression, adversarial, CI-gate structure, support SLA, dashboard latency)
        working-directory: tests/cross-tenant
        run: node measure-duration.mjs

      # TEID-91-T1..T9 run here, against the same services and the fake
      # Google IdP started above.
      - name: Run TEID-91 acceptance suite (password/Google sign-in, mandatory MFA, idle expiry, lockout, audit log, session sweep)
        working-directory: tests/console-auth
        run: npx vitest run

      - name: Install audit-log suite dependencies
        working-directory: tests/audit-log
        run: npm ci

      - name: Run TEID-42 acceptance suite (configuration audit, filters, CSV export, load, immutability, concurrency)
        working-directory: tests/audit-log
        run: npx vitest run

      - name: Install API-key lifecycle suite dependencies
        working-directory: tests/api-keys
        run: npm ci

      - name: Run TEID-92 acceptance suite (scope, creation, rotation, revocation, pagination, adversarial secrecy)
        working-directory: tests/api-keys
        run: npx vitest run

      - name: Install role-based access suite dependencies
        working-directory: tests/rbac
        run: npm ci

      - name: Run TEID-43 acceptance suite (roles, route enforcement, audits, SSO toggle, guard completeness, adversarial validation)
        working-directory: tests/rbac
        run: npx vitest run

      - name: Install plans suite dependencies
        working-directory: tests/plans
        run: npm ci

      - name: Run TEID-16 acceptance suite (draft plans, metric rates, validation, publish, concurrency)
        working-directory: tests/plans
        run: npx vitest run

      - name: Install grants suite dependencies
        working-directory: tests/grants
        run: npm ci

      - name: Run TEID-17 acceptance suite (credit grants, expiry, recurring issuance, eligibility, voiding)
        working-directory: tests/grants
        run: npx vitest run

      - name: Install consumption-order suite dependencies
        working-directory: tests/consumption-order
        run: npm ci

      - name: Run TEID-18 acceptance suite (consumption order, multi-grant draw, timeline, determinism)
        working-directory: tests/consumption-order
        run: npx vitest run

      - name: Install replay-consistency suite dependencies
        working-directory: tests/replay-consistency
        run: npm ci

      - name: Run TEID-35 acceptance suite (timestamp-ordered deterministic replay)
        working-directory: tests/replay-consistency
        run: npx vitest run

      - name: Install commits suite dependencies
        working-directory: tests/commits
        run: npm ci

      - name: Run TEID-19 acceptance suite (annual commits, monthly drawdown, priced overage, term close, amend)
        working-directory: tests/commits
        run: npx vitest run

      - name: Install customer-hierarchy suite dependencies
        working-directory: tests/customer-hierarchy
        run: npm ci

      - name: Run TEID-22 acceptance suite (customer hierarchy, pooled and isolated balances, ceilings, moves)
        working-directory: tests/customer-hierarchy
        run: npx vitest run

      - name: Install stripe-connect suite dependencies
        working-directory: tests/stripe-connect
        run: npm ci

      - name: Run TEID-37/TEID-38 acceptance suite (Stripe Connect OAuth and customer sync)
        working-directory: tests/stripe-connect
        run: npx vitest run

      - name: Install sandbox suite dependencies
        working-directory: tests/sandbox
        run: npm ci

      - name: Run TEID-60 acceptance suite (sandbox creation, test-mode-only Stripe, reviewed plan promotion, isolation)
        working-directory: tests/sandbox
        run: npx vitest run

      - name: Install processor-neutrality suite dependencies
        working-directory: tests/processor-neutrality
        run: npm ci

      - name: Run TEID-74 acceptance suite (processor-neutral identifiers, disconnect invariance, lookup latency, mid-flight disconnect)
        working-directory: tests/processor-neutrality
        run: npx vitest run

      - name: Install rate-overrides suite dependencies
        working-directory: tests/rate-overrides
        run: npm ci

      - name: Run TEID-20 acceptance suite (per-customer rate overrides, precedence, priced usage ledger, overlap, expiry)
        working-directory: tests/rate-overrides
        run: npx vitest run

      - name: Run TEID-44 acceptance suite (formats, SLAs, schedules, docs, retries, concurrency, ownership)
        working-directory: tests/data-export
        run: npx vitest run

      - name: Install usage ingestion suite dependencies
        working-directory: tests/usage-ingestion
        run: npm ci

      - name: Run TEID-30 acceptance suite (single & batch ingestion, durability, load, partial batch rejections, read-after-write lag, batch size enforcement, adversarial)
        working-directory: tests/usage-ingestion
        run: npx vitest run

      - name: Install idempotency suite dependencies
        working-directory: tests/idempotency
        run: npm ci

      - name: Run TEID-31 acceptance suite (duplicate acknowledgement, retention expiry, conflict review, database-enforced concurrency)
        working-directory: tests/idempotency
        run: npx vitest run

      - name: Install ledger suite dependencies and start the fake on-call webhook
        working-directory: tests/ledger
        run: |
          npm ci
          FAKE_ONCALL_PORT=8093 npm run fake-oncall &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8093/healthz && break; sleep 1; done

      - name: Run TEID-32 acceptance suite (append-only ledger, reversals, integrity worker, load, adversarial enforcement)
        working-directory: tests/ledger
        run: npx vitest run

      - name: Install currency rounding suite dependencies
        working-directory: tests/currency-rounding
        run: npm ci

      - name: Run TEID-94 acceptance suite (currency precision, exact decimal arithmetic, rounding points, methods, adjustments, adversarial validation)
        working-directory: tests/currency-rounding
        run: npx vitest run

      - name: Install large-quantities suite dependencies
        working-directory: tests/large-quantities
        run: npm ci

      - name: Run TEID-95 acceptance suite (sub-cent prices, exact trillion-unit quantities, aggregation, caps, precision validation)
        working-directory: tests/large-quantities
        run: npx vitest run

      - name: Install billing-periods suite dependencies
        working-directory: tests/billing-periods
        run: npm ci

      - name: Run TEID-96 acceptance suite (UTC storage, time zones, exclusive boundaries, DST, month-end clamping, idempotency)
        working-directory: tests/billing-periods
        run: npx vitest run

  # TEID-59: SDK tests stay independent of the main application suite. They
  # need only go-usage plus the two language toolchains.
  sdk-tests:
    runs-on: ubuntu-latest
    env:
      SDK_OFFLINE_TEST_DURATION_MS: "100"
      SDK_LATENCY_BENCHMARK_EVENTS_PER_MIN: "25"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teideal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply database migrations
        run: PSQL_SUPERUSER=postgres bash db/setup-local.sh

      - name: Seed SDK test fixtures
        run: PSQL_SUPERUSER=postgres bash db/seed-test-fixtures.sh

      - name: Build and start go-usage
        working-directory: services/go-usage
        run: |
          go build -o /tmp/go-usage ./cmd/server
          PORT=8082 DATABASE_URL="$DATABASE_URL" /tmp/go-usage &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8082/healthz && break; sleep 1; done

      - name: Install, type-check, and test Python SDK
        working-directory: sdks/python
        run: |
          python -m pip install -e ".[dev]"
          python -m mypy teideal
          python -m pytest

      - name: Install, type-check, build, and test TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm install
          npm run typecheck
          npm run build
          npm test

      - name: Install SDK integration suite dependencies
        working-directory: tests/sdk-integration
        run: npm install

      - name: Run TEID-59 acceptance suite (T1-T4, T6, T8; T7/T9 are package-local)
        working-directory: tests/sdk-integration
        run: npm test

  # TEID-41-AC3 / TEID-59: a release that fails either suite must not deploy.
  # `needs: [test, sdk-tests]` makes that structural -- this job is skipped
  # outright if either job fails, not merely warned about. There is no real
  # deployment target configured yet (that is a separate infra decision);
  # this stage exists to prove and hold the gate itself.
  deploy:
    needs: [test, sdk-tests]
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "TEID-41-AC3: cross-tenant suite passed -- deploy stage would run here."'
