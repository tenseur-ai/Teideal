mmit to a feature branch and confirm the public CI pipeline triggers automatically and runs the full test suite to completion, visible to unauthenticated visitors.","ac":3,"type":"Functional"},{"id":"TEID-81-T4","title":"Open CONTRIBUTING.md and SECURITY.md in the repo and confirm they specify the pull request process, coding standards, and a vulnerability disclosure contact with an expected response time.","ac":4,"type":"Functional"},{"id":"TEID-81-T5","title":"Measure the public CI pipeline's median run time across the last 20 merged pull requests and confirm it completes in under 20 minutes so external contributors get fast feedback.","ac":3,"type":"Non-functional"},{"id":"TEID-81-T6","title":"Have an external developer with no prior Teideal access follow only the published README to clone, build and run the core locally, and confirm they succeed within 30 minutes without contacting the team.","ac":1,"type":"Non-functional"},{"id":"TEID-81-T7","title":"Attempt to push a commit directly to the public repository's main branch without review privileges and confirm branch protection rejects it.","ac":1,"type":"Adversarial"},{"id":"TEID-81-T8","title":"Submit a fabricated vulnerability report through the published security disclosure channel with a spoofed reporter identity and confirm the intake process still logs and triages it without granting the reporter elevated repository access.","ac":4,"type":"Adversarial"}]},{"key":"TEID-82","epic":"TEID-14","summary":"Public correctness test suite","desc":"As a security reviewer at our customer, I want to run the tests that prove Teideal's money guarantees, so that I do not have to take those guarantees on trust.\n\n*Context*\n","priority":"High","points":8,"release":"mvp","area":"open-source","ac":["The suite covers duplicate events, out-of-order events, crashes mid-write, concurrent writers and late events.","Anyone can run it locally with one command.","Results are published for every release, and a release that fails any test is not shipped."],"order":23,"tests":[{"id":"TEID-82-T1","title":"Execute the correctness suite's chaos scenarios covering duplicate event replay, reordered event delivery, a simulated crash mid-write, concurrent writers to the same ledger, and a late-arriving event, and confirm each is a named test case with an assertion on final ledger state.","ac":1,"type":"Functional"},{"id":"TEID-82-T2","title":"On a clean machine with no prior environment setup, run the single documented command and confirm the entire suite executes and reports pass or fail without additional configuration.","ac":2,"type":"Functional"},{"id":"TEID-82-T3","title":"Trigger a release candidate build and confirm a results artifact is published to the public results page for that version, and separately confirm that injecting a failing assertion into one chaos test blocks the pipeline from tagging or publishing the release.","ac":3,"type":"Functional"},{"id":"TEID-82-T4","title":"Time the full suite run from a cold checkout and confirm it completes in under 10 minutes on a standard 4-core CI runner.","ac":2,"type":"Non-functional"},{"id":"TEID-82-T5","title":"Feed the matching engine 10,000 duplicate copies of the same event ID within one second and confirm the ledger records exactly one effect and the suite flags any double-counting.","ac":1,"type":"Adversarial"},{"id":"TEID-82-T6","title":"Tamper with a published results file to flip a failed chaos-test outcome to passed and confirm the checksum or signature verification on the results artifact detects the modification and rejects it as untrusted.","ac":3,"type":"Adversarial"}]},{"key":"TEID-84","epic":"TEID-14","summary":"Published guarantees page","desc":"As a founder evaluating Teideal, I want a plain-English page listing every guarantee Teideal makes about money, so that I know exactly what I am relying on.\n\n*Context*\n","priority":"High","points":2,"release":"mvp","area":"open-source","ac":["The page lists each guarantee (for example: exactly-once accounting, same result regardless of order, read-only verification).","Each guarantee links to the tests in TEID-82 that prove it.","Any known limitation is stated on the same page."],"order":24,"tests":[{"id":"TEID-84-T1","title":"Load the public guarantees page and confirm it lists at least the three named guarantees, exactly-once accounting, order-independent results, and read-only verification, each with a plain-English description.","ac":1,"type":"Functional"},{"id":"TEID-84-T2","title":"Click the test-suite link under the exactly-once accounting guarantee and confirm it resolves to the specific correctness-suite test case that exercises duplicate-event handling, not just the suite's homepage.","ac":2,"type":"Functional"},{"id":"TEID-84-T3","title":"Confirm the page includes a known-limitations section and that it states at least one real current limitation, such as maximum event throughput per tenant or the supported currency list.","ac":3,"type":"Functional"},{"id":"TEID-84-T4","title":"Run the guarantees page through an automated accessibility checker and confirm zero critical WCAG 2.1 AA violations.","ac":1,"type":"Non-functional"},{"id":"TEID-84-T5","title":"Modify the underlying test result that a guarantee links to so it shows a failing state, and confirm the guarantees page surfaces a visible discrepancy warning rather than silently continuing to claim the guarantee holds.","ac":2,"type":"Adversarial"},{"id":"TEID-84-T6","title":"Attempt to edit the guarantees page content through the CMS without documentation-maintainer permissions and confirm the write attempt is rejected.","ac":3,"type":"Adversarial"}]},{"key":"TEID-117","epic":"TEID-89","summary":"Service level objectives","desc":"As a founder, I want measurable service level objectives for each part of Teideal, so that we know when reliability is slipping before customers do.","priority":"Highest","points":3,"release":"mvp","area":"reliability","ac":["Objectives are defined and published internally: ingestion API availability of 99.9% at MVP, zero loss of acknowledged events, and Verify data no more than 2 hours old.","Each objective is measured continuously and shown on a dashboard with its remaining error budget.","When an error budget is exhausted, feature releases pause until reliability work restores it."],"provisional":true,"order":25,"tests":[{"id":"TEID-117-T1","title":"Review the published internal objectives document and confirm it states 99.9% ingestion API availability, zero loss of acknowledged events, and Verify data no more than 2 hours old.","ac":1,"type":"Functional"},{"id":"TEID-117-T2","title":"Open the SLO dashboard and confirm each objective displays a continuously updating measurement alongside its remaining error budget.","ac":2,"type":"Functional"},{"id":"TEID-117-T3","title":"In a staging simulation, deliberately exhaust the ingestion API error budget and confirm the release pipeline blocks new feature deploys until reliability work restores the budget.","ac":3,"type":"Functional"},{"id":"TEID-117-T4","title":"During a simulated ingestion outage, confirm the SLO dashboard's error-budget figures update at least every 5 minutes and remain accurate throughout.","ac":2,"type":"Non-functional"},{"id":"TEID-117-T5","title":"With the error budget exhausted, attempt to trigger a feature release via a direct CI pipeline call bypassing the normal release process and confirm the release gate still blocks it.","ac":3,"type":"Adversarial"}]},{"key":"TEID-118","epic":"TEID-89","summary":"Monitoring, alerting and on-call","desc":"As a Teideal engineer, I want monitoring and paging for every critical failure, so that problems are fixed quickly at any hour.","priority":"Highest","points":5,"release":"mvp","area":"reliability","ac":["Metrics, logs and traces are collected for all services, without personal data in logs.","Alerts fire on objective burn rate, ledger integrity check failures (TEID-32, TEID-33), connector sync failures and ingestion backlogs.","An on-call rota pages a named engineer, with escalation if unacknowledged within 15 minutes.","Every alert links to a runbook describing how to respond."],"provisional":true,"order":26,"tests":[{"id":"TEID-118-T1","title":"Inspect collected logs across all services over a 24-hour window and confirm zero personal-data fields such as names or emails appear anywhere in log output.","ac":1,"type":"Functional"},{"id":"TEID-118-T2","title":"Simulate a ledger integrity check failure, a connector sync failure and an ingestion backlog exceeding threshold in turn, and confirm each condition fires a distinct alert.","ac":2,"type":"Functional"},{"id":"TEID-118-T3","title":"Trigger a critical alert and confirm it pages the named on-call engineer, then confirm it escalates to the secondary on-call if unacknowledged after 15 minutes.","ac":3,"type":"Functional"},{"id":"TEID-118-T4","title":"Open any fired alert and confirm it links directly to a runbook containing response steps specific to that failure type.","ac":4,"type":"Functional"},{"id":"TEID-118-T5","title":"Send metrics and traces from all services at 10 times normal ingestion volume and confirm the monitoring pipeline drops fewer than 0.1% of data points.","ac":1,"type":"Non-functional"},{"id":"TEID-118-T6","title":"Submit a log-generating request containing an email address embedded in a free-text field and confirm the log scrubber redacts it before it reaches the logging backend.","ac":1,"type":"Adversarial"}]},{"key":"TEID-119","epic":"TEID-89","summary":"Backups and point-in-time recovery","desc":"As a founder, I want the ledger to be recoverable to any recent moment, so that no failure or mistake can permanently lose financial records.","priority":"Highest","points":5,"release":"mvp","area":"reliability","ac":["Databases are backed up continuously with point-in-time recovery for at least 14 days.","At MVP, data loss after recovery is at most 5 minutes (RPO) and service is restored within 4 hours (RTO).","Backups are encrypted and stored in a separate account from production.","A restore is tested every month, and ledger integrity checks pass on the restored copy."],"provisional":true,"order":27,"tests":[{"id":"TEID-119-T1","title":"Trigger a point-in-time restore to a moment 10 days in the past and confirm it succeeds, demonstrating continuous backup coverage for at least 14 days.","ac":1,"type":"Functional"},{"id":"TEID-119-T2","title":"Simulate a production database failure and measure the recovery, confirming data loss is at most 5 minutes (RPO) and service is restored within 4 hours (RTO).","ac":2,"type":"Functional"},{"id":"TEID-119-T3","title":"Inspect backup storage configuration and confirm backups are encrypted at rest and stored in a cloud account separate from the production account.","ac":3,"type":"Functional"},{"id":"TEID-119-T4","title":"Review the most recent monthly restore-test record and confirm a restore was performed within the last calendar month and the TEID-33 ledger integrity checks passed against the restored copy.","ac":4,"type":"Functional"},{"id":"TEID-119-T5","title":"Run the monthly restore drill against a production-sized dataset and confirm the restore plus integrity check complete within the 4-hour RTO window.","ac":2,"type":"Non-functional"},{"id":"TEID-119-T6","title":"Simulate an attacker deleting all backups in the production account and confirm the separate-account backup copy remains intact and restorable.","ac":3,"type":"Adversarial"}]},{"key":"TEID-121","epic":"TEID-89","summary":"Zero-downtime deploys and safe migrations","desc":"As a Teideal engineer, I want to deploy and change the database schema without losing or double-counting events, so that deploys never cause the balance drift our customers suffer today.\n\n*Context*\nThe founder brief described events lost during a deploy; Teideal must never do the same.","priority":"Highest","points":5,"release":"mvp","area":"reliability","ac":["Deploys roll out gradually without dropping acknowledged events or in-flight requests.","Schema changes are backward compatible for at least one release so old and new versions can run together.","A bad deploy can be rolled back within 15 minutes.","Ledger integrity checks run automatically after every production deploy."],"provisional":true,"order":28,"tests":[{"id":"TEID-121-T1","title":"Perform a rolling production deploy while streaming a continuous load of test events and confirm zero acknowledged events are dropped and no in-flight request fails.","ac":1,"type":"Functional"},{"id":"TEID-121-T2","title":"Deploy a schema change and confirm the previous release version continues to read and write correctly against the new schema for at least one full release cycle before the old code path is removed.","ac":2,"type":"Functional"},{"id":"TEID-121-T3","title":"Deploy a deliberately broken build to staging and confirm it is rolled back to the last known good version within 15 minutes.","ac":3,"type":"Functional"},{"id":"TEID-121-T4","title":"Complete a production deploy and confirm the ledger integrity check runs automatically immediately afterward with its pass or fail result recorded.","ac":4,"type":"Functional"},{"id":"TEID-121-T5","title":"Measure the ingestion API's error rate throughout a rolling deploy and confirm it stays within the SLO error budget with no observable downtime.","ac":1,"type":"Non-functional"},{"id":"TEID-121-T6","title":"Send a burst of duplicate replayed events during the deploy's version-transition window and confirm no event is double-counted in the ledger.","ac":1,"type":"Adversarial"}]},{"key":"TEID-16","epic":"TEID-1","summary":"Define plans as configuration","desc":"As a billing operator, I want to create a plan with included credits, per-unit rates by metric and model, caps and a billing interval, so that new pricing can go live without an engineer writing code.\n\n*Context*\nA plan is the template a subscription is created from. It must cover self-serve credit plans and enterprise plans.","priority":"Highest","points":5,"release":"mvp","area":"entitlement-model","ac":["An operator can create a plan through both the API and the admin console.","A plan can include: name, currency, billing interval, included credits, a rate for each metric and model, and optional hard or soft caps.","The system rejects a plan that is missing a currency, a billing interval, or a rate for any metric it lists, and says exactly what is missing.","A newly saved plan is a draft and affects no customers until it is published.","Publishing a plan creates version 1 and records who published it and when."],"order":29,"tests":[{"id":"TEID-16-T1","title":"Create a plan named Growth-Monthly via POST /v1/plans with currency USD and billing interval monthly, then create the identical plan through the admin console UI, and confirm both produce a plan record with matching fields.","ac":1,"type":"Functional"},{"id":"TEID-16-T2","title":"Create a plan with name Enterprise-Annual, currency USD, billing interval annual, 10000 included credits, a rate of 0.002 USD per token for gpt-4o and a hard cap of 50000 USD, and confirm every field persists and displays correctly on the plan detail page.","ac":2,"type":"Functional"},{"id":"TEID-16-T3","title":"Submit a plan payload missing the currency field and confirm the API returns a 422 with an error naming currency as required, then repeat omitting the rate for a listed metric image-generation and confirm the error names that exact metric.","ac":3,"type":"Functional"},{"id":"TEID-16-T4","title":"Save a new plan Starter-v2 without publishing, assign an existing test customer to a subscription, and confirm the customer's entitlement checks still resolve against their prior plan, not Starter-v2.","ac":4,"type":"Functional"},{"id":"TEID-16-T5","title":"Publish the Starter-v2 plan as operator jane@acme.com and confirm the plan record shows version equal to 1 along with published_by jane@acme.com and a published_at timestamp.","ac":5,"type":"Functional"},{"id":"TEID-16-T6","title":"Load the admin console plan-creation form with a catalog of 500 metrics and confirm all metric rate fields render in under 1.5 seconds without UI freezing.","ac":2,"type":"Non-functional"},{"id":"TEID-16-T7","title":"Have five billing operators unfamiliar with the system attempt to create a plan missing a required field and confirm at least four correctly identify and fix the missing field from the error message alone without documentation.","ac":3,"type":"Non-functional"},{"id":"TEID-16-T8","title":"Submit a plan-creation request with a negative included-credits value of -500 and confirm the API rejects it with a validation error rather than saving a plan with negative credits.","ac":3,"type":"Adversarial"},{"id":"TEID-16-T9","title":"Send two concurrent publish requests for the same draft plan from two different operator sessions and confirm only one succeeds in creating version 1 while the other receives a conflict error, with no duplicate version 1 records.","ac":5,"type":"Adversarial"}]},{"key":"TEID-17","epic":"TEID-1","summary":"Issue credit grants with expiry","desc":"As a billing operator, I want to give a customer prepaid, recurring or promotional credits, each with its own start and expiry date, so that I can run promotions and sell credit packs without manual balance edits.\n\n*Context*\nGrants are the only way credits enter a customer's balance. Every grant must be traceable.","priority":"Highest","points":5,"release":"mvp","area":"entitlement-model","ac":["A grant records amount, unit or currency, source (paid, promotional, commit, goodwill), start date, optional expiry date and the person or system that created it.","A grant cannot be consumed before its start date or after its expiry time (evaluated in UTC).","When a grant expires with unused credit, the system writes a ledger entry for the expired amount so finance can report it.","A recurring grant is issued exactly once per period, even if the scheduler runs twice or retries after a failure.","An operator can void a grant with a mandatory reason; voiding writes a reversing ledger entry and never deletes history."],"order":30,"tests":[{"id":"TEID-17-T1","title":"Issue a grant of 1000 USD promotional credit with source promotional, start date 2026-10-01, expiry 2026-10-31, created by operator ops@teideal.com, and confirm all six fields are stored and returned exactly on GET /v1/grants/{id}.","ac":1,"type":"Functional"},{"id":"TEID-17-T2","title":"Create a grant with start date set to tomorrow and attempt to consume it today via a usage event, confirming the check is denied with insufficient balance, then advance to the start date and confirm the same event now succeeds.","ac":2,"type":"Functional"},{"id":"TEID-17-T3","title":"Create a grant of 500 credits expiring at 2026-11-01T00:00:00Z with 200 credits unused, let it expire, and confirm a ledger entry for exactly 200 expired credits appears the next day and is visible in the finance report.","ac":3,"type":"Functional"},{"id":"TEID-17-T4","title":"Configure a monthly recurring grant of 100 credits, trigger the issuance scheduler twice in the same period plus simulate one retry after a forced failure, and confirm exactly one grant of 100 credits is issued for that period.","ac":4,"type":"Functional"},{"id":"TEID-17-T5","title":"Void an active grant of 300 credits with reason duplicate promotion applied, and confirm the original grant remains in the history unaltered while a reversing ledger entry of -300 credits is created.","ac":5,"type":"Functional"},{"id":"TEID-17-T6","title":"Run the recurring grant scheduler for 10000 customers simultaneously at the monthly boundary and confirm every customer receives exactly one grant with no duplicates and the batch completes within 15 minutes.","ac":4,"type":"Non-functional"},{"id":"TEID-17-T7","title":"Query the grant consumption eligibility check under a load of 2000 requests per second and confirm P99 latency for the UTC start and expiry evaluation stays under 10 milliseconds.","ac":2,"type":"Non-functional"},{"id":"TEID-17-T8","title":"Issue a grant with expiry set to 2026-09-26T23:59:59Z and submit a usage event timestamped exactly 2026-09-27T00:00:00Z from a client in UTC-8, confirming the event is correctly denied against the grant based on UTC evaluation, not local time.","ac":2,"type":"Adversarial"},{"id":"TEID-17-T9","title":"Attempt to void the same grant twice in rapid concurrent requests and confirm only one reversing ledger entry is created, not two.","ac":5,"type":"Adversarial"}]},{"key":"TEID-18","epic":"TEID-1","summary":"Configure credit consumption order","desc":"As a billing operator, I want to define the order in which a customer's grants are used up, so that customers always consume credits in the order their contract promises.\n\n*Context*\nCustomers often hold several grants at once (a promo, a paid pack, a commit). The order must be predictable and explainable.","priority":"Highest","points":5,"release":"mvp","area":"entitlement-model","ac":["The default order is: soonest-expiring promotional credits, then paid credits, then commit, then overage.","An operator can change the order for a plan or for a single customer.","Given the same grants and the same usage, the system always produces the same result.","When one usage event draws from more than one grant, the ledger shows each grant and the amount taken from it.","The customer timeline shows which grant paid for each usage event."],"order":31,"tests":[{"id":"TEID-18-T1","title":"Give a customer a promotional grant expiring in 5 days, another promotional grant expiring in 20 days, a paid credit pack, and an active commit, then submit a usage event and confirm consumption draws first from the 5-day promotional grant, then the 20-day one, then paid credits, then the commit.","ac":1,"type":"Functional"},{"id":"TEID-18-T2","title":"Override the consumption order for customer ACME-042 to paid-before-promotional, submit the same set of grants as the default-order case, and confirm the ledger shows paid credits consumed first.","ac":2,"type":"Functional"},{"id":"TEID-18-T3","title":"Replay the identical set of grants and a 10000-unit usage event five separate times and confirm the resulting per-grant consumption breakdown is byte-for-byte identical on every run.","ac":3,"type":"Functional"},{"id":"TEID-18-T4","title":"Submit a single usage event of 150 credits where the customer has 100 credits left in Grant A and needs 50 more from Grant B, and confirm the ledger entry shows two line items: 100 from Grant A and 50 from Grant B.","ac":4,"type":"Functional"},{"id":"TEID-18-T5","title":"After processing a mixed-grant usage event, open the customer timeline UI and confirm it lists both consumed grants with the exact amount attributed to each against that single usage event.","ac":5,"type":"Functional"},{"id":"TEID-18-T6","title":"Run the consumption-order algorithm against 1000 randomly generated grant sets with identical inputs replayed 50 times each and confirm zero non-deterministic result variance.","ac":3,"type":"Non-functional"},{"id":"TEID-18-T7","title":"Measure ledger write latency when a single usage event must be split across 5 different grants and confirm it completes within 100 milliseconds.","ac":4,"type":"Non-functional"},{"id":"TEID-18-T8","title":"Fire 20 concurrent usage events against a customer with exactly enough combined credit across two grants to cover half of them, and confirm the resulting grant consumption is consistent with no event double-consuming credit already allocated to another concurrent event.","ac":3,"type":"Adversarial"},{"id":"TEID-18-T9","title":"Configure a plan-level consumption order that references a grant source type not present in the customer's account and confirm the system falls back to the documented default order rather than failing the check.","ac":1,"type":"Adversarial"}]},{"key":"TEID-19","epic":"TEID-1","summary":"Annual commits with monthly drawdown","desc":"As a billing operator, I want to set up an annual commit that customers draw down as they use the product, with an overage rate once it is used up, so that enterprise contracts are enforced exactly as signed.\n\n*Context*\nExample: a 250,000 USD annual commit drawn down monthly, with a contracted overage rate afterwards.","priority":"Highest","points":8,"release":"mvp","area":"entitlement-model","ac":["An operator can create a commit with amount, term start and end, drawdown schedule (upfront, monthly or quarterly) and overage rate.","Usage draws down the commit in real time and the remaining amount is visible at any moment.","Overage pricing starts at exactly the event that exhausts the commit; an event that straddles the boundary is split correctly.","At the end of the term, any unused commit is reported as a separate line for finance and does not carry over unless the contract says so.","Changes to a live commit require a reason and are recorded in the audit log."],"order":32,"tests":[{"id":"TEID-19-T1","title":"Create a commit of 250000 USD with term 2026-01-01 to 2026-12-31, monthly drawdown schedule, and an overage rate of 0.0025 USD per token, and confirm the commit record stores all five fields correctly.","ac":1,"type":"Functional"},{"id":"TEID-19-T2","title":"Submit usage events totaling 40000 USD against the 250000 USD commit and confirm the remaining-balance API returns exactly 210000 USD immediately after the last event.","ac":2,"type":"Functional"},{"id":"TEID-19-T3","title":"With 500 USD remaining on the commit, submit a single usage event valued at 800 USD, and confirm the ledger splits it into a 500 USD commit-drawdown line and a 300 USD overage line priced at the contracted overage rate.","ac":3,"type":"Functional"},{"id":"TEID-19-T4","title":"At the end of the 2026 term with 15000 USD of the 250000 USD commit unused and the contract set to non-carryover, confirm the closing report shows a separate unused-commit line of 15000 USD and the new term starts at zero balance.","ac":4,"type":"Functional"},{"id":"TEID-19-T5","title":"Change the overage rate on a live in-term commit from 0.0025 to 0.003 USD per token with reason renegotiated Q3 pricing, and confirm the change appears in the audit log with the old value, new value, reason and operator.","ac":5,"type":"Functional"},{"id":"TEID-19-T6","title":"Poll the commit remaining-balance endpoint at 1000 requests per second during active drawdown and confirm P99 response latency stays under 50 milliseconds with no stale reads older than 2 seconds.","ac":2,"type":"Non-functional"},{"id":"TEID-19-T7","title":"Under a burst of 200 concurrent usage events landing within the same 100 millisecond window as the event that exhausts the commit, confirm the boundary-splitting logic still assigns overage correctly with no double-counted commit balance.","ac":3,"type":"Non-functional"},{"id":"TEID-19-T8","title":"Submit two usage events with identical timestamps, one of which alone would exhaust the commit, and confirm the documented tie-break rule is applied deterministically rather than allowing both to be priced as if full commit balance were available.","ac":3,"type":"Adversarial"},{"id":"TEID-19-T9","title":"Attempt to change a live commit's overage rate via the API without supplying a reason field, and confirm the request is rejected with a 400 error rather than silently applying the change.","ac":5,"type":"Adversarial"}]},{"key":"TEID-20","epic":"TEID-1","summary":"Per-customer rate overrides","desc":"As a billing operator, I want to give one customer a special rate on a specific model or metric for a set period, so that negotiated discounts are applied without code changes.\n\n*Context*\nSales routinely agrees discounts on a single model. Today these live as if-statements in production.","priority":"High","points":3,"release":"mvp","area":"entitlement-model","ac":["An operator can set an override rate for a customer on any metric or model, with a start date and optional end date.","When an override is active it always takes precedence over the plan rate; the rules for precedence are documented in the console.","Every usage event priced with an override records the override's ID in the ledger.","When the override ends, pricing returns to the plan rate from the next event onwards with no manual step."],"order":33,"tests":[{"id":"TEID-20-T1","title":"Create an override for customer ACME-007 on model gpt-4o-mini at 0.0008 USD per 1K tokens with a start date of 2026-10-01 and no end date, and confirm it saves and appears active on that date.","ac":1,"type":"Functional"},{"id":"TEID-20-T2","title":"With both a plan rate of 0.002 USD and an active customer override of 0.0008 USD for the same model, submit a usage event and confirm it is priced at 0.0008 USD, and confirm the console's precedence documentation page states overrides win over plan rates.","ac":2,"type":"Functional"},{"id":"TEID-20-T3","title":"Submit a usage event priced under an active override and confirm the resulting ledger entry includes the override's ID field matching the override record.","ac":3,"type":"Functional"},{"id":"TEID-20-T4","title":"Set an override with end date 2026-10-31, submit a usage event on 2026-11-01, and confirm it is priced at the plan's standard rate with no operator action taken.","ac":4,"type":"Functional"},{"id":"TEID-20-T5","title":"Measure the added latency of resolving an active override during the pricing step under 3000 events per second and confirm it adds no more than 5 milliseconds versus pricing with no override.","ac":2,"type":"Non-functional"},{"id":"TEID-20-T6","title":"Have an operator with no prior training create a customer override using only the console's inline field labels and confirm they select the correct metric, model, start date and end date fields without consulting documentation.","ac":1,"type":"Non-functional"},{"id":"TEID-20-T7","title":"Create two overlapping overrides for the same customer and model with conflicting rates and overlapping date ranges, and confirm the system either rejects the second override or applies a clearly documented conflict-resolution rule rather than silently picking one at random.","ac":1,"type":"Adversarial"},{"id":"TEID-20-T8","title":"Set an override's end date to a date in the past at creation time and confirm the system rejects the request or immediately treats the override as expired rather than pricing new events against it.","ac":4,"type":"Adversarial"}]},{"key":"TEID-22","epic":"TEID-1","summary":"Customer hierarchy with pooled and isolated balances","desc":"As a billing operator, I want to model an enterprise as an organisation with teams and API keys, choosing whether balances are shared or separate, so that limits and balances match how the customer's contract is actually structured.\n\n*Context*\nSome enterprise contracts pool credit across teams; others give each team its own budget.","priority":"High","points":8,"release":"mvp","area":"entitlement-model","ac":["An operator can create organisations, teams under organisations, and API keys under teams.","Each level can be set to use a pooled balance (shared with its parent) or an isolated balance.","A request is checked against every level above it, and the most restrictive limit wins.","Moving a team to a different organisation keeps its history and is recorded in the audit log."],"order":34,"tests":[{"id":"TEID-22-T1","title":"Create organisation Acme-Corp, a team Acme-Corp/ML-Team under it, and an API key under ML-Team, and confirm the hierarchy is correctly reflected via GET /v1/organisations/Acme-Corp/tree.","ac":1,"type":"Functional"},{"id":"TEID-22-T2","title":"Set ML-Team to an isolated balance with its own 5000-credit cap while organisation Acme-Corp uses a pooled 50000-credit balance, and confirm usage under ML-Team draws only from its own 5000 credits, not the org pool.","ac":2,"type":"Functional"},{"id":"TEID-22-T3","title":"Configure an organisation with a 1000 USD remaining balance and a team under it with a 2000 USD isolated cap but only 200 USD remaining at the team level, submit a request for 500 USD, and confirm it is denied because the team's 200 USD limit, the more restrictive one, governs.","ac":3,"type":"Functional"},{"id":"TEID-22-T4","title":"Move team Beta-Team from Organisation-A to Organisation-B, and confirm Beta-Team's usage history and balances remain intact and an audit log entry records the move with old parent, new parent, operator and timestamp.","ac":4,"type":"Functional"},{"id":"TEID-22-T5","title":"Measure entitlement check latency for an API key nested four levels deep, organisation, team, sub-team and key, evaluating limits at every level, under 5000 checks per second, and confirm P99 stays under 20 milliseconds.","ac":3,"type":"Non-functional"},{"id":"TEID-22-T6","title":"Create a hierarchy with 200 teams under a single organisation and confirm the organisation tree view in the console loads within 3 seconds.","ac":1,"type":"Non-functional"},{"id":"TEID-22-T7","title":"Attempt to move a team so that it becomes its own ancestor by nesting it under one of its own descendant teams, and confirm the system rejects the circular hierarchy operation.","ac":2,"type":"Adversarial"},{"id":"TEID-22-T8","title":"Fire concurrent requests against a team with a shared pooled balance from two API keys simultaneously, each requesting an amount that alone fits within the remaining pool but together exceed it, and confirm the pooled balance check prevents both from being approved and the pool never goes negative.","ac":3,"type":"Adversarial"}]},{"key":"TEID-23","epic":"TEID-1","summary":"Versioned pricing and scheduled migrations","desc":"As a billing operator, I want to publish a new pricing version and choose when, or whether, each customer moves to it, so that I can reprice safely whenever model costs change.\n\n*Context*\nPrices change every few months. Old and new logic must never collide within a billing period.","priority":"High","points":8,"release":"mvp","area":"entitlement-model","ac":["Publishing changes to a plan creates a new version; existing subscriptions stay on their current version.","An operator can schedule customers to move to a new version at their next period boundary or a chosen date.","An operator can keep (grandfather) any customer on an old version indefinitely.","Every priced usage event records the plan version used, and no single event is priced by two versions.","Before a migration runs, the operator sees how many customers will move and when."],"order":35,"tests":[{"id":"TEID-23-T1","title":"Publish a rate change to the Growth plan creating version 2, and confirm all 300 existing subscribers remain on version 1 with no pricing change to their next invoice.","ac":1,"type":"Functional"},{"id":"TEID-23-T2","title":"Schedule customer ACME-014 to migrate to version 2 at their next period boundary of 2026-11-01, and confirm the subscription record shows a pending migration date and the customer is still priced under version 1 until that date.","ac":2,"type":"Functional"},{"id":"TEID-23-T3","title":"Mark customer LegacyCo as grandfathered on version 1, publish versions 2 and 3 of the plan, and confirm LegacyCo remains on version 1 with no scheduled migration after both publishes.","ac":3,"type":"Functional"},{"id":"TEID-23-T4","title":"Submit a usage event that lands exactly at the scheduled migration boundary timestamp and confirm the ledger records a single plan_version field with no event split or duplicated pricing across version 1 and version 2.","ac":4,"type":"Functional"},{"id":"TEID-23-T5","title":"Before running a scheduled migration from version 1 to version 2, open the migration preview screen and confirm it lists the exact count of customers that will move and their scheduled move date, matching the actual customers migrated once the job runs.","ac":5,"type":"Functional"},{"id":"TEID-23-T6","title":"Generate a migration preview for a plan with 25000 subscribed customers and confirm the preview count renders within 5 seconds.","ac":5,"type":"Non-functional"},{"id":"TEID-23-T7","title":"Under a load of 10000 events per second during an active version migration window, confirm zero events are recorded with an ambiguous or missing plan_version field.","ac":4,"type":"Non-functional"},{"id":"TEID-23-T8","title":"Attempt to publish a new plan version while a prior publish for the same plan is still processing, and confirm the system serializes the operations rather than producing two version 2 records.","ac":1,"type":"Adversarial"},{"id":"TEID-23-T9","title":"Set a customer as grandfathered and simultaneously schedule them for migration via a race between two operator actions, and confirm the system resolves the conflict deterministically rather than leaving the customer in an inconsistent state.","ac":3,"type":"Adversarial"}]},{"key":"TEID-37","epic":"TEID-4","summary":"Connect a Stripe account, read-only first","desc":"As a billing operator, I want to connect our Stripe account with read-only access to start, so that Teideal can verify our billing without being able to change anything.\n\n*Context*\nCustomers grant read access for Verify on day one. Write access is a separate, later decision when they move billing onto Teideal.","priority":"Highest","points":3,"release":"mvp","area":"stripe","ac":["An operator can connect Stripe using Stripe's standard authorisation flow.","By default only read access is requested, and the connection screen states that Teideal cannot change anything in Stripe.","Write access is requested separately, only when the operator enables invoice sync or credit grants (TEID-39, TEID-40).","No card or bank details are ever stored in our system.","Disconnecting stops all access to Stripe immediately and is recorded in the audit log."],"order":36,"tests":[{"id":"TEID-37-T1","title":"Click Connect Stripe and complete Stripe's standard OAuth Connect authorization flow with a test Stripe account, confirming the connection succeeds and an access token is stored.","ac":1,"type":"Functional"},{"id":"TEID-37-T2","title":"Complete the initial Stripe connection and confirm the requested OAuth scopes are read-only and the UI displays explicit text stating Teideal cannot make changes in Stripe.","ac":2,"type":"Functional"},{"id":"TEID-37-T3","title":"With a read-only Stripe connection active, enable the invoice-sync feature and confirm a separate, distinct OAuth re-authorization prompt requesting write scope is triggered rather than write access being silently granted.","ac":3,"type":"Functional"},{"id":"TEID-37-T4","title":"Complete a full Stripe connection using Stripe's hosted OAuth page and confirm no card number, CVV, or bank account detail ever appears in Teideal's database, logs, or API payloads.","ac":4,"type":"Functional"},{"id":"TEID-37-T5","title":"Disconnect an active Stripe integration, immediately attempt an API call using the previously valid token and confirm it is rejected, and confirm an audit log entry records the disconnect action, actor, and timestamp.","ac":5,"type":"Functional"},{"id":"TEID-37-T6","title":"Confirm that revoking a Stripe connection propagates and blocks all in-flight and new API calls within 5 seconds of the disconnect action being confirmed.","ac":5,"type":"Non-functional"},{"id":"TEID-37-T7","title":"Attempt to call a Stripe write endpoint, such as creating an invoice item, using a connection that only holds read-only scope, and confirm the connector rejects the call with a permissions error rather than silently succeeding.","ac":3,"type":"Adversarial"},{"id":"TEID-37-T8","title":"Attempt to replay or reuse an intercepted OAuth authorization code after it has already been exchanged once and confirm the second exchange attempt is rejected, preventing connection hijacking.","ac":1,"type":"Adversarial"}]},{"key":"TEID-38","epic":"TEID-4","summary":"Sync customers with Stripe","desc":"As a billing operator, I want our customers linked to their Stripe customer records, so that invoices and payments line up with the right account.\n\n*Context*\n","priority":"Highest","points":5,"release":"mvp","area":"stripe","ac":["Existing Stripe customers can be matched to our customers automatically by ID or email, with a review screen for uncertain matches.","New customers created in either system can be linked, with the operator choosing which system creates the Stripe record.","A customer can never be linked to more than one Stripe customer."],"order":37,"tests":[{"id":"TEID-38-T1","title":"Run the customer-matching sync against 100 existing Stripe customers where 90 have exact email matches to Teideal customers, and confirm the 90 auto-link while the remaining 10 ambiguous or unmatched customers appear on a manual review screen.","ac":1,"type":"Functional"},{"id":"TEID-38-T2","title":"Create a new customer in Teideal and choose create-in-Stripe, confirming a corresponding Stripe customer record is created and linked; then create a new customer directly in Stripe and choose link-to-new-Teideal-customer, confirming a Teideal record is created and linked.","ac":2,"type":"Functional"},{"id":"TEID-38-T3","title":"Attempt to link a Teideal customer already linked to Stripe customer cus_A to a second Stripe customer cus_B, and confirm the system blocks the second link with a clear already-linked error.","ac":3,"type":"Functional"},{"id":"TEID-38-T4","title":"Run the auto-matching job against 50,000 Stripe customer records and confirm it completes within 10 minutes, with match-accuracy statistics logged for observability.","ac":1,"type":"Non-functional"},{"id":"TEID-38-T5","title":"Include two Stripe customers sharing the exact same email address in a sync run and confirm the system does not auto-link both to the same Teideal customer, instead flagging both for manual review.","ac":1,"type":"Adversarial"},{"id":"TEID-38-T6","title":"Fire two concurrent link-customer requests linking the same Teideal customer to two different Stripe customer IDs at nearly the same instant, and confirm the database-level uniqueness constraint allows only one link to succeed.","ac":3,"type":"Adversarial"}]},{"key":"TEID-98","epic":"TEID-11","summary":"Connector framework and contract test suite","desc":"As a Teideal engineer, I want a common framework that every billing-system connector is built on, so that each new connector is read-only, reliable and consistent by construction.\n\n*Context*\nPrerequisite for the Metronome, Orb and Lago connectors. Generalises the connector approach in TEID-65.","priority":"Highest","points":8,"release":"mvp","area":"verify","ac":["The framework defines one data model for customers, prices, contracts, invoices, credits, payments and refunds.","It provides shared handling for authentication, pagination, rate limits, retries, incremental sync and error reporting.","A contract test suite checks that a connector is read-only, maps data correctly and survives API failures; a connector cannot ship until it passes.","Sync health for every connector appears in the same console view."],"provisional":true,"order":38,"tests":[{"id":"TEID-98-T1","title":"Instantiate the framework's data model with a sample Stripe export containing customers, prices, contracts, invoices, credits, payments and refunds, and confirm all seven entity types map into the single common schema without field loss.","ac":1,"type":"Functional"},{"id":"TEID-98-T2","title":"Configure a mock connector with a 100 request per minute rate limit and confirm the shared client throttles requests to stay under the limit while automatically retrying 3 consecutive 429 responses with exponential backoff.","ac":2,"type":"Functional"},{"id":"TEID-98-T3","title":"Run the contract test suite against a connector stub that includes a hidden write endpoint and confirm the suite fails the read-only check and blocks the connector from being marked shippable.","ac":3,"type":"Functional"},{"id":"TEID-98-T4","title":"Register two connectors, Stripe and a mock CSV importer, with differing sync states and confirm both appear with last-sync timestamp and status in the same console health view.","ac":4,"type":"Functional"},{"id":"TEID-98-T5","title":"Simulate an incremental sync of 500,000 records through the shared pagination and retry pipeline and confirm it completes within 15 minutes without memory growth beyond 2GB.","ac":2,"type":"Non-functional"},{"id":"TEID-98-T6","title":"Add a new mock connector implementing only the base interface and confirm the existing contract test suite runs against it with zero test-code changes required.","ac":3,"type":"Non-functional"},{"id":"TEID-98-T7","title":"Submit a connector to the contract test suite that returns HTTP 500 on 10 percent of paginated requests and confirm the suite fails it for not surviving API failures rather than silently passing.","ac":3,"type":"Adversarial"},{"id":"TEID-98-T8","title":"Feed the shared retry handler a connector that returns malformed JSON on every retry attempt and confirm it gives up after the configured retry ceiling and reports a clear error rather than retrying indefinitely.","ac":2,"type":"Adversarial"}]},{"key":"TEID-65","epic":"TEID-11","summary":"Connect billing systems read-only","desc":"As a finance lead, I want to connect our billing and payment systems to Teideal with read-only access, so that Teideal can check our billing without any risk of changing it.\n\n*Context*\nLaunch with Stripe Billing, then add Metronome, Orb and Lago in order of design-partner demand. A generic file and API importer covers homegrown systems.","priority":"Highest","points":8,"release":"mvp","area":"verify","ac":["An operator can connect Stripe Billing at launch, and any system through the generic CSV or API importer.","Every connector uses read-only credentials, and Teideal contains no code path that writes to a connected billing system; an automated test on every release confirms this.","Teideal pulls customers, prices, subscriptions, invoices, line items, credit notes, payments and refunds.","The first sync can load up to 24 months of history; after that, new data is synced at least every hour.","The connection screen shows the last successful sync and any errors in plain English."],"order":39,"tests":[{"id":"TEID-65-T1","title":"Connect a live Stripe Billing test-mode account through the UI and confirm the connection reaches Connected status within 60 seconds, then upload a 5,000-row CSV of invoices through the generic importer and confirm it is accepted.","ac":1,"type":"Functional"},{"id":"TEID-65-T2","title":"Provision Stripe API credentials scoped read-only, then attempt a connection with write-scoped credentials, and confirm Teideal rejects the write-scoped key at setup.","ac":2,"type":"Functional"},{"id":"TEID-65-T3","title":"After a Stripe sync, query the imported data and confirm counts match the source account exactly for customers, prices, subscriptions, invoices, line items, credit notes, payments and refunds.","ac":3,"type":"Functional"},{"id":"TEID-65-T4","title":"Connect an account with 30 months of Stripe history and confirm the first sync imports exactly the most recent 24 months, then confirm a new invoice created afterward appears in Teideal within 60 minutes.","ac":4,"type":"Functional"},{"id":"TEID-65-T5","title":"Revoke the API key mid-sync to force a failure, and confirm the connection screen displays a plain-English error message rather than a raw API error code, alongside the timestamp of the last successful sync.","ac":5,"type":"Functional"},{"id":"TEID-65-T6","title":"Run the first sync against an account with 24 months of history totaling 2 million invoice line items and confirm it completes within 4 hours.","ac":4,"type":"Non-functional"},{"id":"TEID-65-T7","title":"Disconnect network access mid-sync for 3 different connector types and confirm each surfaces a distinct, correctly attributed error message rather than a generic failure.","ac":5,"type":"Non-functional"},{"id":"TEID-65-T8","title":"Attempt to invoke any billing-system write endpoint, such as create invoice or update subscription, from within Teideal's codebase or API surface, and confirm the release-gating automated test fails the build if such a call path exists.","ac":2,"type":"Adversarial"},{"id":"TEID-65-T9","title":"Import a CSV through the generic importer containing duplicate invoice IDs and rows with missing required fields, and confirm Teideal rejects or quarantines the bad rows without corrupting the rest of the import.","ac":3,"type":"Adversarial"}]},{"key":"TEID-66","epic":"TEID-11","summary":"Independent usage feed","desc":"As a developer at our customer, I want to give Teideal its own copy of raw usage events, separate from what our billing system received, so that verification compares billing against the source of truth rather than against itself.\n\n*Context*\nOptions: SDK dual-write (TEID-59), import from a data warehouse or storage bucket, or mirroring the customer's existing usage webhooks.","priority":"Highest","points":8,"release":"mvp","area":"verify","ac":["Usage can arrive by SDK dual-write, scheduled import from a warehouse or storage bucket, or webhook mirroring.","The same idempotency rules as TEID-31 apply, so importing the same data twice never double-counts.","Teideal reports event volumes per hour per source and flags gaps or sudden drops that suggest missing data.","The operator can see, per customer, which periods have complete usage data and which do not."],"order":40,"tests":[{"id":"TEID-66-T1","title":"Configure all three ingestion paths, SDK dual-write, scheduled bucket import and webhook mirroring, in a test tenant and confirm usage events sent through each path all land in the independent usage store within 5 minutes.","ac":1,"type":"Functional"},{"id":"TEID-66-T2","title":"Replay the identical batch of 10,000 usage events twice through the same import path and confirm the resulting event count in the store increases by 10,000, not 20,000.","ac":2,"type":"Functional"},{"id":"TEID-66-T3","title":"Send zero usage events for a 3-hour window for a source that normally sends 5,000 events per hour and confirm Teideal raises a gap alert flagging that window within 15 minutes of the expected data missing.","ac":3,"type":"Functional"},{"id":"TEID-66-T4","title":"For a customer with usage data missing on 2 of the last 30 days, confirm the operator UI's per-customer coverage view marks exactly those 2 days as incomplete and the other 28 as complete.","ac":4,"type":"Functional"},{"id":"TEID-66-T5","title":"Ingest a sustained 50,000 events per second across all sources for 1 hour and confirm no event loss and end-to-end latency stays under 2 minutes.","ac":1,"type":"Non-functional"},{"id":"TEID-66-T6","title":"Confirm the per-hour, per-source volume dashboard updates within 5 minutes of new events arriving, refreshed continuously without a manual reload.","ac":3,"type":"Non-functional"},{"id":"TEID-66-T7","title":"Replay the same batch of usage events through two concurrent import jobs processing overlapping event ID ranges and confirm the idempotency key prevents any double count under concurrent execution.","ac":2,"type":"Adversarial"},{"id":"TEID-66-T8","title":"Have the webhook mirror source silently stop delivering for 6 hours while the sending system reports no errors, and confirm Teideal's gap detection flags the drop rather than assuming zero real usage occurred.","ac":3,"type":"Adversarial"}]},{"key":"TEID-67","epic":"TEID-11","summary":"Capture contract terms for re-rating","desc":"As a finance lead, I want to give Teideal the pricing and contract terms each customer is actually on, so that Teideal can calculate what each customer should have been charged.\n\n*Context*\nPrices come from the connected billing system where possible. Terms that live only in contracts (commits, negotiated discounts, free credits) are added by the operator using the TEID-1 model.","priority":"Highest","points":8,"release":"mvp","area":"verify","ac":["Prices and plans are imported from connected systems and converted into Teideal plan versions (TEID-1).","An operator can add terms that are missing from the billing system, such as commits, discounts and credit grants, each with effective dates.","Every customer is mapped to a set of terms; customers without a mapping are listed and excluded from verification until mapped.","Any term the Teideal model cannot represent is flagged clearly rather than approximated."],"order":41,"tests":[{"id":"TEID-67-T1","title":"Import a Stripe price list with 12 tiered prices and confirm each converts into a distinct Teideal plan version preserving tier boundaries and rates exactly.","ac":1,"type":"Functional"},{"id":"TEID-67-T2","title":"Manually add a 50,000 dollar annual commit with a negotiated 15 percent discount effective January 1 2026 for a customer, and confirm both terms appear correctly dated in that customer's term set.","ac":2,"type":"Functional"},{"id":"TEID-67-T3","title":"Leave 3 of 50 customers unmapped to any term set and confirm the operator dashboard lists exactly those 3 customers and that verification runs exclude them from calculated totals.","ac":3,"type":"Functional"},{"id":"TEID-67-T4","title":"Enter a contract term describing a non-standard tiered-then-flat hybrid discount the model cannot represent, and confirm Teideal flags it explicitly as unsupported rather than silently rounding or approximating it.","ac":4,"type":"Functional"},{"id":"TEID-67-T5","title":"Add a new pricing construct type, such as graduated commit rollover, to the plan-version model and confirm existing imported plans continue to convert correctly without regression.","ac":1,"type":"Non-functional"},{"id":"TEID-67-T6","title":"Present the unmapped-customer list to a finance-lead test user and confirm they can map a customer to a term set in 3 clicks or fewer.","ac":3,"type":"Non-functional"},{"id":"TEID-67-T7","title":"Attempt to run a verification calculation for a customer with no term mapping and confirm the system blocks the calculation and returns an explicit exclusion reason rather than defaulting to a zero-dollar or guessed rate.","ac":3,"type":"Adversarial"},{"id":"TEID-67-T8","title":"Enter two overlapping effective-dated discount terms for the same customer covering the same date range and confirm Teideal surfaces the conflict rather than silently applying one arbitrarily.","ac":2,"type":"Adversarial"}]},{"key":"TEID-68","epic":"TEID-11","summary":"Independent re-rating of usage","desc":"As a finance lead, I want Teideal to calculate what each customer should have been charged, using its own ledger and not the billing system's output, so that we have a genuinely independent second opinion on every invoice.\n\n*Context*\nThis reuses the TEID-3 ledger. It must never take the billing system's calculated totals as input.","priority":"Highest","points":13,"release":"mvp","area":"verify","ac":["For each customer and period, Teideal calculates expected charges per line from raw usage and contract terms.","The calculation handles tiers, proration, credits and their consumption order, commits and overage, and rate overrides.","Running the same calculation again always produces the same result, to the cent.","Every expected amount can be traced to the usage events and terms that produced it."],"order":42,"tests":[{"id":"TEID-68-T1","title":"Run the re-rating engine for a customer with 40,000 raw usage events over a monthly period and confirm it produces expected per-line charges derived solely from usage and contract terms, with no reference to the billing system's invoice totals.","ac":1,"type":"Functional"},{"id":"TEID-68-T2","title":"Construct a test case with a 3-tier rate schedule, a mid-period proration, a 500 dollar credit consumed before overage, and a rate override, and confirm the engine applies credits before overage, prorates the correct tier, and produces the expected total.","ac":2,"type":"Functional"},{"id":"TEID-68-T3","title":"Re-run the identical re-rating calculation for the same customer and period 5 times and confirm every run returns the exact same amount to the cent.","ac":3,"type":"Functional"},{"id":"TEID-68-T4","title":"Select a calculated line-item charge of 1,284.53 dollars and confirm Teideal can trace it back to the exact set of usage events and contract term versions that produced it.","ac":4,"type":"Functional"},{"id":"TEID-68-T5","title":"Re-rate 1 million usage events across 5,000 customers for a full monthly period and confirm the job completes within 2 hours.","ac":1,"type":"Non-functional"},{"id":"TEID-68-T6","title":"Confirm the re-rating calculation is deterministic across two different application server instances processing the same input, producing byte-identical results.","ac":3,"type":"Non-functional"},{"id":"TEID-68-T7","title":"Attempt to feed the re-rating engine the billing system's own calculated invoice total as an input field and confirm the engine rejects or ignores it, deriving charges only from raw usage and terms.","ac":1,"type":"Adversarial"},{"id":"TEID-68-T8","title":"Submit usage events with a negative quantity and a credit grant that exceeds the customer's total usage, and confirm the engine handles both without producing a negative or nonsensical expected charge.","ac":2,"type":"Adversarial"}]},{"key":"TEID-69","epic":"TEID-11","summary":"Three-way match: usage, invoiced, collected","desc":"As a finance lead, I want every customer's usage, expected charge, invoiced amount and collected amount matched automatically, so that any error anywhere in the chain is caught within hours.\n\n*Context*\nReplaces the earlier Stripe-only reconciliation with a match that works across any connected system.","priority":"Highest","points":13,"release":"mvp","area":"verify","ac":["After every sync, Teideal compares expected charges, invoiced amounts and collected payments for each customer and period.","The default tolerance is zero (to the cent); an operator can set a different tolerance with a recorded reason.","Each mismatch is given a category: unbilled usage, overbilled, wrong price, missing credit, duplicate charge, uncollected, or refund without credit note.","Mismatches create findings (TEID-71) automatically and can trigger alerts and webhooks (TEID-47, TEID-48)."],"order":43,"tests":[{"id":"TEID-69-T1","title":"Trigger a sync for a customer whose expected charge is 10,000 dollars, invoiced amount is 10,000 dollars, and collected payment is 9,800 dollars, and confirm the three-way match runs automatically post-sync and flags the 200 dollar shortfall.","ac":1,"type":"Functional"},{"id":"TEID-69-T2","title":"Set a custom tolerance of 1.00 dollar with the recorded reason of an approved rounding difference, and confirm a 0.75 dollar discrepancy is no longer flagged as a mismatch while a 1.50 dollar discrepancy still is.","ac":2,"type":"Functional"},{"id":"TEID-69-T3","title":"Create 7 test scenarios, one per mismatch category, unbilled usage, overbilled, wrong price, missing credit, duplicate charge, uncollected, and refund without credit note, and confirm each is tagged with its correct category.","ac":3,"type":"Functional"},{"id":"TEID-69-T4","title":"Produce a 5,000 dollar overbilled mismatch and confirm a finding is automatically created and a configured webhook fires within 5 minutes.","ac":4,"type":"Functional"},{"id":"TEID-69-T5","title":"Run the three-way match across 100,000 customer-periods after a full sync and confirm the matching job completes within 1 hour.","ac":1,"type":"Non-functional"},{"id":"TEID-69-T6","title":"Simulate the alerting and webhook service being unavailable for 10 minutes during a match run and confirm findings are still created and queued for delivery once the service recovers, with no mismatch silently lost.","ac":4,"type":"Non-functional"},{"id":"TEID-69-T7","title":"Attempt to set a tolerance of 500 dollars without supplying a reason and confirm the system rejects the change and requires a recorded justification before it takes effect.","ac":2,"type":"Adversarial"},{"id":"TEID-69-T8","title":"Construct a mismatch that could plausibly fit two categories, such as a duplicate charge that is also overbilled, and confirm the categorization logic applies a single consistent, documented category rather than producing conflicting or duplicate findings.","ac":3,"type":"Adversarial"}]},{"key":"TEID-70","epic":"TEID-11","summary":"Leakage and overbilling in dollars","desc":"As a founder, I want to see how much revenue we are losing and how much we may be overcharging, in dollars, so that I can decide what to fix first and justify the cost of Teideal.\n\n*Context*\nPreviously planned as a phase 2 AI feature; now core to the MVP.","priority":"Highest","points":8,"release":"mvp","area":"verify","ac":["A dashboard shows total unbilled revenue, total overbilling, and total uncollected revenue for any date range.","Each total can be broken down by category, customer and product.","Trends are shown month by month so improvements are visible after fixes.","All figures can be exported, and every figure links to the findings behind it."],"order":44,"tests":[{"id":"TEID-70-T1","title":"Select a custom date range of January 1 to March 31 2026 on the dashboard and confirm the totals for unbilled revenue, overbilling and uncollected revenue update to reflect only findings within that range.","ac":1,"type":"Functional"},{"id":"TEID-70-T2","title":"Click the breakdown control on the overbilling total and confirm it decomposes into the exact set of underlying categories, customers and products whose individual amounts sum back to the displayed total.","ac":2,"type":"Functional"},{"id":"TEID-70-T3","title":"View the trend chart for uncollected revenue across 6 months and confirm each month's plotted value matches the sum of findings for that calendar month.","ac":3,"type":"Functional"},{"id":"TEID-70-T4","title":"Click a 42,300 dollar unbilled revenue total for March, confirm it navigates to the exact list of findings whose amounts sum to 42,300 dollars, then export the figure as CSV and confirm the exported total matches.","ac":4,"type":"Functional"},{"id":"TEID-70-T5","title":"Load the dashboard for a tenant with 2 years of findings history totaling 500,000 records and confirm the totals render within 3 seconds.","ac":1,"type":"Non-functional"},{"id":"TEID-70-T6","title":"Confirm the category, customer and product breakdown remains readable and navigable on a tenant with 200 or more distinct products without requiring horizontal scrolling to identify the top contributors.","ac":2,"type":"Non-functional"},{"id":"TEID-70-T7","title":"Attempt to export the dashboard figures while a finding underlying one of the totals is concurrently being resolved, and confirm the exported total is internally consistent, matching either the pre- or post-resolution state and not a mix of both.","ac":4,"type":"Adversarial"},{"id":"TEID-70-T8","title":"Request a date range spanning before the tenant's first sync and confirm the dashboard reports zero or no-data for that period rather than an inaccurate fabricated total.","ac":1,"type":"Adversarial"}]},{"key":"TEID-71","epic":"TEID-11","summary":"Findings workflow","desc":"As a finance lead, I want each mismatch to be a finding I can assign, discuss and resolve, so that problems get fixed rather than just reported.\n\n*Context*\n","priority":"Highest","points":5,"release":"mvp","area":"verify","ac":["Each finding shows the customer, period, category, amount, and the evidence from usage, ledger and billing system.","Findings can be assigned to a person, commented on, and resolved as 'fixed in source', 'accepted' or 'not an error', with a mandatory note.","A finding marked 'fixed in source' stays open until the next sync confirms the fix.","All finding activity is kept in the audit log (TEID-42)."],"order":45,"tests":[{"id":"TEID-71-T1","title":"Open a finding for a 1,200 dollar overbilling mismatch and confirm it displays the customer, billing period, category, dollar amount, and links to the underlying usage events, ledger entries and billing-system invoice.","ac":1,"type":"Functional"},{"id":"TEID-71-T2","title":"Assign a finding to a named finance analyst, add a comment, then attempt to resolve it as accepted without entering a note and confirm the system blocks the resolution until a note is supplied.","ac":2,"type":"Functional"},{"id":"TEID-71-T3","title":"Resolve a finding as fixed in source and confirm it remains open through the next 2 syncs while the underlying discrepancy still exists, then confirm it closes automatically once a sync shows the discrepancy is gone.","ac":3,"type":"Functional"},{"id":"TEID-71-T4","title":"Perform an assign, a comment and a resolution on a single finding, then confirm all three actions appear as distinct entries in the audit log with correct timestamps and actor.","ac":4,"type":"Functional"},{"id":"TEID-71-T5","title":"Have a test user resolve 10 findings in sequence and confirm the assign, comment and resolve workflow requires no more than 4 clicks per finding.","ac":2,"type":"Non-functional"},{"id":"TEID-71-T6","title":"Generate 1,000 finding actions in a burst and confirm every action appears in the audit log with no dropped entries.","ac":4,"type":"Non-functional"},{"id":"TEID-71-T7","title":"Attempt to resolve a finding as not an error via a direct API call that bypasses the UI's mandatory-note field, and confirm the API also rejects the request without a note.","ac":2,"type":"Adversarial"},{"id":"TEID-71-T8","title":"Mark a finding fixed in source, then have a subsequent sync silently omit the relevant customer and period rather than reporting resolved data, and confirm Teideal keeps the finding open rather than auto-closing it on absence of contradicting data.","ac":3,"type":"Adversarial"}]},{"key":"TEID-72","epic":"TEID-11","summary":"Monthly verification report","desc":"As a finance lead, I want a monthly report stating how much revenue was verified and what was found, so that I can show our board and auditors that our billing is checked independently.\n\n*Context*\n","priority":"High","points":5,"release":"mvp","area":"verify","ac":["The report covers the share of revenue verified, the share matched to the cent, and the value of open and resolved findings.","It explicitly lists what was not verified and why (for example, unmapped customers or missing usage data).","Once issued, a report cannot be changed; each report carries a fingerprint so any later alteration can be detected.","The report can be downloaded as PDF and CSV."],"order":46,"tests":[{"id":"TEID-72-T1","title":"Generate the March 2026 report for a tenant with 2.4 million dollars total revenue and confirm it states the exact percentage verified, the percentage matched to the cent, and the dollar totals of open and resolved findings.","ac":1,"type":"Functional"},{"id":"TEID-72-T2","title":"Generate a report for a tenant with 4 unmapped customers and 2 periods of missing usage data, and confirm the report explicitly lists each unmapped customer and each missing-data period with its reason.","ac":2,"type":"Functional"},{"id":"TEID-72-T3","title":"Issue a report, then attempt to edit its figures directly via the database or API, and confirm the system either blocks the change or the report's fingerprint no longer matches, making the alteration detectable.","ac":3,"type":"Functional"},{"id":"TEID-72-T4","title":"Download an issued report in both PDF and CSV formats and confirm both contain matching figures for revenue verified, matched percentage and findings values.","ac":4,"type":"Functional"},{"id":"TEID-72-T5","title":"Recompute the fingerprint of a stored report 6 months after issuance and confirm it still matches the original, verifying the fingerprint scheme survives schema and version changes.","ac":3,"type":"Non-functional"},{"id":"TEID-72-T6","title":"Generate the monthly report for a tenant with 3 years of history and confirm it completes within 5 minutes.","ac":1,"type":"Non-functional"},{"id":"TEID-72-T7","title":"Attempt to regenerate and silently overwrite an already-issued report for the same month, and confirm Teideal either refuses the overwrite or creates a new versioned report while preserving the original and its fingerprint.","ac":3,"type":"Adversarial"},{"id":"TEID-72-T8","title":"Generate a report for a tenant where 30 percent of customers are unmapped and confirm the report does not overstate the verified-revenue percentage by silently excluding unmapped customers from the denominator.","ac":2,"type":"Adversarial"}]},{"key":"TEID-99","epic":"TEID-11","summary":"Metronome connector for Verify","desc":"As a finance lead at a company using Metronome, I want to connect Metronome to Teideal Verify with read-only access, so that our Metronome billing can be verified independently.\n\n*Context*\nBuild order follows design-partner demand. Before building, confirm that Metronome's API terms permit third-party read access, now that it is part of Stripe.","priority":"High","points":8,"release":"mvp","area":"verify","ac":["An operator can connect Metronome with read-only credentials.","Customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).","The connector passes the full contract test suite, including the read-only check.","Historical sync of up to 24 months and incremental sync at least hourly are supported.","Verification runs end to end for at least one design partner using Metronome, with every difference either matched or explained."],"provisional":true,"order":47,"tests":[{"id":"TEID-99-T1","title":"Connect a Metronome sandbox account using a read-only API key through the connector setup UI and confirm the connection reaches Connected status.","ac":1,"type":"Functional"},{"id":"TEID-99-T2","title":"After a full Metronome sync, confirm customers, rate cards, contracts, credits and commits, invoices and payments all appear correctly mapped in the common data model with counts matching the Metronome source.","ac":2,"type":"Functional"},{"id":"TEID-99-T3","title":"Run the connector framework's contract test suite against the Metronome connector and confirm it passes every check including the read-only verification.","ac":3,"type":"Functional"},{"id":"TEID-99-T4","title":"Connect a Metronome account with 28 months of history and confirm the first sync imports the most recent 24 months, then confirm a new invoice appears in Teideal within 60 minutes of creation in Metronome.","ac":4,"type":"Functional"},{"id":"TEID-99-T5","title":"Run a full verification cycle for a live Metronome design partner and confirm every discrepancy surfaced is either matched to zero or has a documented explanation, with no unexplained differences remaining.","ac":5,"type":"Functional"},{"id":"TEID-99-T6","title":"Perform the first historical sync for a Metronome account with 18 months of usage-heavy data exceeding 1 million invoice line items and confirm it completes within 3 hours.","ac":4,"type":"Non-functional"},{"id":"TEID-99-T7","title":"Have a test operator connect a Metronome account using only the in-product instructions and confirm they complete the connection in under 5 minutes without external support.","ac":1,"type":"Non-functional"},{"id":"TEID-99-T8","title":"Provide the Metronome connector with write-scoped API credentials and confirm the contract test suite's read-only check fails the connector before it can be marked shippable.","ac":3,"type":"Adversarial"},{"id":"TEID-99-T9","title":"Introduce a deliberately mismatched contract term for one design-partner customer and confirm the end-to-end verification run surfaces it as an unexplained difference rather than silently matching it.","ac":5,"type":"Adversarial"}]},{"key":"TEID-100","epic":"TEID-11","summary":"Orb connector for Verify","desc":"As a finance lead at a company using Orb, I want to connect Orb to Teideal Verify with read-only access, so that our Orb billing can be verified independently.\n\n*Context*\nBuild order follows design-partner demand. Before building, confirm that Orb's API terms permit third-party read access, now that it is part of Adyen.","priority":"High","points":8,"release":"mvp","area":"verify","ac":["An operator can connect Orb with read-only credentials.","Customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).","The connector passes the full contract test suite, including the read-only check.","Historical sync of up to 24 months and incremental sync at least hourly are supported.","Verification runs end to end for at least one design partner using Orb, with every difference either matched or explained."],"provisional":true,"order":48,"tests":[{"id":"TEID-100-T1","title":"Connect an Orb sandbox account using a read-only API key through the connector setup UI and confirm the connection reaches Connected status.","ac":1,"type":"Functional"},{"id":"TEID-100-T2","title":"After a full Orb sync, confirm customers, rate cards, contracts, credits and commits, invoices and payments all appear correctly mapped in the common data model with counts matching the Orb source.","ac":2,"type":"Functional"},{"id":"TEID-100-T3","title":"Run the connector framework's contract test suite against the Orb connector and confirm it passes every check including the read-only verification.","ac":3,"type":"Functional"},{"id":"TEID-100-T4","title":"Connect an Orb account with 26 months of history and confirm the first sync imports the most recent 24 months, then confirm a new invoice appears in Teideal within 60 minutes of creation in Orb.","ac":4,"type":"Functional"},{"id":"TEID-100-T5","title":"Run a full verification cycle for a live Orb design partner and confirm every discrepancy surfaced is either matched to zero or has a documented explanation.","ac":5,"type":"Functional"},{"id":"TEID-100-T6","title":"Perform the first historical sync for an Orb account with 24 months of usage-heavy data exceeding 800,000 invoice line items and confirm it completes within 3 hours.","ac":4,"type":"Non-functional"},{"id":"TEID-100-T7","title":"Have a test operator connect an Orb account using only the in-product instructions and confirm they complete the connection in under 5 minutes.","ac":1,"type":"Non-functional"},{"id":"TEID-100-T8","title":"Provide the Orb connector with write-scoped API credentials and confirm the contract test suite's read-only check fails the connector before it can be marked shippable.","ac":3,"type":"Adversarial"},{"id":"TEID-100-T9","title":"Introduce a deliberately mismatched commit balance for one Orb design-partner customer and confirm the verification run surfaces it as an unexplained difference rather than silently matching it.","ac":5,"type":"Adversarial"}]},{"key":"TEID-101","epic":"TEID-11","summary":"Lago connector for Verify","desc":"As a finance lead at a company using Lago, I want to connect Lago to Teideal Verify with read-only access, so that our Lago billing can be verified independently.\n\n*Context*\nBuild order follows design-partner demand. Must work with both Lago Cloud and self-hosted Lago.","priority":"High","points":5,"release":"mvp","area":"verify","ac":["An operator can connect Lago with read-only credentials.","Customers, prices or rate cards, contracts, credits and commits, invoices and payments are imported into the common data model (built on the connector framework).","The connector passes the full contract test suite, including the read-only check.","Historical sync of up to 24 months and incremental sync at least hourly are supported.","Verification runs end to end for at least one design partner using Lago, with every difference either matched or explained."],"provisional":true,"order":49,"tests":[{"id":"TEID-101-T1","title":"Connect both a Lago Cloud account and a self-hosted Lago instance using read-only API keys and confirm both reach Connected status.","ac":1,"type":"Functional"},{"id":"TEID-101-T2","title":"After a full sync from a self-hosted Lago instance, confirm customers, rate cards, contracts, credits and commits, invoices and payments all map correctly into the common data model with counts matching the Lago source.","ac":2,"type":"Functional"},{"id":"TEID-101-T3","title":"Run the connector framework's contract test suite against the Lago connector for both Lago Cloud and self-hosted configurations and confirm it passes every check including the read-only verification on both.","ac":3,"type":"Functional"},{"id":"TEID-101-T4","title":"Connect a self-hosted Lago instance with 20 months of history and confirm the first sync imports all 20 months, then confirm a new invoice appears in Teideal within 60 minutes of creation in Lago.","ac":4,"type":"Functional"},{"id":"TEID-101-T5","title":"Run a full verification cycle for a live Lago design partner and confirm every discrepancy surfaced is either matched to zero or has a documented explanation.","ac":5,"type":"Functional"},{"id":"TEID-101-T6","title":"Perform the first historical sync against a self-hosted Lago instance behind a rate-limited API gateway of 60 requests per minute and confirm the sync still completes within 4 hours.","ac":4,"type":"Non-functional"},{"id":"TEID-101-T7","title":"Confirm the connector setup flow presents distinct, correctly labeled connection fields for Lago Cloud versus self-hosted, such as a custom base URL, so an operator cannot accidentally misconfigure the endpoint.","ac":1,"type":"Non-functional"},{"id":"TEID-101-T8","title":"Point the Lago connector at a self-hosted instance running an older API version missing an expected field and confirm the contract test suite fails clearly rather than the connector silently importing incomplete data.","ac":3,"type":"Adversarial"},{"id":"TEID-101-T9","title":"Provide a write-scoped Lago API key at setup and confirm the connection is rejected before any sync begins.","ac":1,"type":"Adversarial"}]},{"key":"TEID-59","epic":"TEID-9","summary":"Python and TypeScript SDKs","desc":"As a developer at our customer, I want official SDKs that send usage events to Teideal alongside my existing billing system, so that Teideal gets an independent copy of usage with a few lines of code.\n\n*Context*\nMVP scope is event sending for Verify. Entitlement check, reserve and settle calls are added when TEID-2 is built.","priority":"Highest","points":8,"release":"mvp","area":"developer-experience","ac":["SDKs are available for Python and TypeScript.","MVP: the SDK sends usage events with automatic retries that always reuse the same idempotency key.","MVP: a dual-write helper sends each event to Teideal and the existing billing system, and a failure on the Teideal side never blocks or fails the customer's request.","MVP: events are buffered locally if Teideal is unreachable and sent later without duplication.","Phase 2: the SDK adds entitlement check, reserve and settle calls and the local entitlement cache used in degraded mode (TEID-27)."],"order":50,"tests":[{"id":"TEID-59-T1","title":"Install the teideal-python and teideal-node packages in separate test projects and confirm both successfully send a usage event to the API.","ac":1,"type":"Functional"},{"id":"TEID-59-T2","title":"Force a network failure during event send and confirm the SDK retries up to 3 times, reusing the identical idempotency key on every attempt, resulting in exactly one recorded event server-side.","ac":2,"type":"Functional"},{"id":"TEID-59-T3","title":"Enable the dual-write helper, force the Teideal-side call to return a 500, and confirm the call to the existing billing system still succeeds and the customer's original request is not blocked or failed.","ac":3,"type":"Functiona
