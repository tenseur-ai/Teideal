<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Teideal board</title>
<style>
:root{
  --bg:#EEF1F4;--col:#E2E7EC;--card:#FFFFFF;--ink:#16212B;--muted:#586878;--line:#CCD5DE;
  --accent:#0E6B6B;--accent-ink:#FFFFFF;--pass:#2F7D4E;--fail:#B53B3B;--pending:#C3CCD5;--focus:#0E6B6B;
  --radius-card:6px;--radius-col:10px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--bg);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A20;--col:#1B232B;--card:#232D37;--ink:#E4EAF0;--muted:#98A7B4;--line:#33404C;
  --accent:#3AAFA9;--accent-ink:#0C1A1A;--pass:#4DB07B;--fail:#E26463;--pending:#45525E;--focus:#3AAFA9;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141A20;--col:#1B232B;--card:#232D37;--ink:#E4EAF0;--muted:#98A7B4;--line:#33404C;
  --accent:#3AAFA9;--accent-ink:#0C1A1A;--pass:#4DB07B;--fail:#E26463;--pending:#45525E;--focus:#3AAFA9;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top{display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:550}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--col)}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;gap:10px;align-items:center;padding:14px 24px 0;flex-wrap:wrap}
.toolbar input[type=search]{min-width:240px}
.toolbar select{max-width:340px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 9px}
.toolbar .summary{margin-left:auto;color:var(--muted);font-size:13px}
main{padding:14px 24px 32px}
.view[hidden]{display:none}

/* Board */
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;align-items:start}
.column{min-width:0;background:var(--col);border-radius:var(--radius-col);display:flex;flex-direction:column;max-height:calc(100vh - 150px);min-height:200px}
.column header{display:flex;align-items:baseline;gap:8px;padding:12px 14px 8px}
.column h2{margin:0;font-size:14px;font-weight:650}
.column .count{color:var(--muted);font-size:13px}
.column .pts{margin-left:auto;color:var(--muted);font-size:12px}
.lane{padding:4px 10px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;border-radius:0 0 var(--radius-col) var(--radius-col);transition:background .12s}
.lane.drop{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.lane .empty{color:var(--muted);font-size:13px;padding:18px 6px;text-align:center}

.card{background:var(--card);border-radius:var(--radius-card);padding:10px 11px 9px;border:1px solid transparent;cursor:grab;position:relative;border-left:4px solid var(--epic)}
.card:hover{border-color:var(--line);border-left-color:var(--epic)}
.card.dragging{opacity:.45}
.card .row1{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.card .order{font-weight:700;color:var(--ink);min-width:28px}
.card .prio{margin-left:auto;font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.prio.Highest{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 45%,transparent)}
.prio.High{color:#B7791F;border-color:color-mix(in srgb,#B7791F 45%,transparent)}
.card h3{font-size:14px;font-weight:560;margin:5px 0 7px;line-height:1.35}
.card .epic{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:grid;gap:5px;margin:9px 0 7px}
.meter{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meter .val{text-align:right;color:var(--ink);font-weight:600}
.meter.complete .val{color:var(--pass)}
.ticks{display:flex;gap:2px;height:7px}
.ticks i{flex:1;border-radius:2px;background:var(--pending)}
.ticks i.ok{background:var(--pass)}
.ticks i.bad{background:var(--fail)}
.card .foot{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.card .foot .rel{margin-left:auto}

/* Tables */
.table-wrap{overflow-x:auto;background:var(--card);border-radius:var(--radius-col);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card);font-weight:650;color:var(--muted);font-size:12px;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--col) 60%,transparent)}
td.num{text-align:right;white-space:nowrap}
td.key{white-space:nowrap;color:var(--muted)}
tr.group td{background:var(--col);font-weight:650;color:var(--ink)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap;border:1px solid var(--line)}
.pill.todo{color:var(--muted)}
.pill.inprogress{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.pill.done,.pill.Passed{color:var(--pass);border-color:color-mix(in srgb,var(--pass) 50%,transparent)}
.pill.Failed{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 50%,transparent)}
.pill.notrun{color:var(--muted)}
.linkish{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--epic);margin-right:6px;vertical-align:1px}

/* Dialog */
dialog{border:0;border-radius:12px;padding:0;width:min(760px,94vw);max-height:90vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,16,22,.45)}
.dlg{display:flex;flex-direction:column;max-height:90vh}
.dlg-head{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.dlg-head .meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.dlg-head h2{margin:6px 0 10px;font-size:19px;line-height:1.3}
.dlg-head select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 8px}
.dlg-body{padding:6px 22px 20px;overflow-y:auto}
.dlg-body h3{font-size:14px;margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.dlg-body h3 .sub{color:var(--muted);font-weight:500;font-size:13px}
.dlg-body h3 .btn{margin-left:auto;padding:3px 8px;font-size:12px}
.desc p{margin:0 0 8px;max-width:72ch}
.desc h4{margin:12px 0 4px;font-size:13px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checklist label{display:grid;grid-template-columns:20px 22px 1fr;gap:6px;align-items:start;cursor:pointer}
.checklist input{margin-top:3px;accent-color:var(--pass)}
.checklist .n{color:var(--muted);font-size:12px;padding-top:2px}
.checklist .done-text{color:var(--muted);text-decoration:line-through}
.tests{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tests li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.tests .t-meta{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].notrun{background:var(--col);color:var(--ink)}
.seg button[aria-pressed="true"].Passed{background:var(--pass);color:#fff}
.seg button[aria-pressed="true"].Failed{background:var(--fail);color:#fff}
.history{font-size:12px;color:var(--muted);list-style:none;padding:0;margin:0;display:grid;gap:3px}
.note{font-size:12px;color:var(--muted)}
.dlg-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:90vw;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-size:15px;margin-right:4px}

@media (max-width:900px){
  .board{grid-template-columns:minmax(0,1fr)}
  .toolbar input[type=search]{min-width:0;flex:1}
  .column{max-height:none}
  header.top,.toolbar,main{padding-left:12px;padding-right:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand"><h1>Teideal</h1><span>TEID delivery board</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-view="board">Board</button>
    <button role="tab" aria-selected="false" data-view="order">Implementation order</button>
    <button role="tab" aria-selected="false" data-view="trace">Traceability</button>
  </nav>
  <div class="top-actions">
    <button class="btn" id="exportState" title="Download your progress as a JSON file">Export progress</button>
    <button class="btn" id="importState" title="Load progress from a JSON file">Import progress</button>
    <input type="file" id="importFile" accept="application/json" hidden>
    <button class="btn" id="resetState" title="Move every story back to To Do and clear all progress">Reset</button>
  </div>
</header>

<div class="toolbar" id="filters">
  <input type="search" id="q" placeholder="Search stories, keys or tests" aria-label="Search">
  <select id="fEpic" aria-label="Epic"><option value="">All epics</option></select>
  <select id="fRelease" aria-label="Release">
    <option value="">All releases</option><option value="mvp">MVP</option><option value="phase-2">Phase 2</option><option value="phase-3">Phase 3</option>
  </select>
  <select id="fTest" aria-label="Test result" hidden>
    <option value="">All test results</option><option value="notrun">Not run</option><option value="Passed">Passed</option><option value="Failed">Failed</option>
  </select>
  <button class="btn" id="exportCsv" hidden>Export CSV</button>
  <span class="summary" id="summary"></span>
</div>

<main>
  <section class="view" id="view-board">
    <div class="board">
      <div class="column" data-status="todo"><header><h2>To Do</h2><span class="count"></span><span class="pts"></span></header><div class="lane" data-status="todo"></div></div>
      <div class="column" data-status="inprogress"><header><h2>In Progress</h2><span class="count"></span><span class="pts"></span></header><div class="lane" data-status="inprogress"></div></div>
      <div class="column" data-status="done"><header><h2>Done</h2><span class="count"></span><span class="pts"></span></header><div class="lane" data-status="done"></div></div>
    </div>
  </section>
  <section class="view" id="view-order" hidden>
    <div class="stats" id="orderStats"></div>
    <div class="table-wrap"><table><thead><tr>
      <th>#</th><th>Key</th><th>Story</th><th>Epic</th><th>Points</th><th>Status</th><th>Criteria</th><th>Tests</th>
    </tr></thead><tbody id="orderBody"></tbody></table></div>
  </section>
  <section class="view" id="view-trace" hidden>
    <div class="stats" id="traceStats"></div>
    <div class="table-wrap"><table><thead><tr>
      <th>Epic</th><th>Story</th><th>#</th><th>Release</th><th>Story status</th><th>Test</th><th>Covers</th><th>Type</th><th>Result</th>
    </tr></thead><tbody id="traceBody"></tbody></table></div>
  </section>
</main>

<dialog id="dlg"><div class="dlg" id="dlgInner"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script>window.DATA={"epics":[{"key":"TEID-15","code":"E15","name":"Build regional compliance pack","desc":"Deliver local e-invoicing, tax, and regional payment compliance tailored to target markets. Address gaps left by US-centric global billing platforms.","release":"phase-3"},{"key":"TEID-14","code":"E14","name":"Publish open-source core and public correctness proof","desc":"Open-source the core ledger and verification engine alongside public correctness tests. Build developer credibility and auditability for billing calculations.","release":"mvp"},{"key":"TEID-13","code":"E13","name":"Enable migration from other billing platforms","desc":"Facilitate low-risk migration of contracts, balances, and history from platforms like Stripe Billing, Metronome, Orb, or Lago. Capture transition opportunities during vendor re-evaluations.","release":"phase-2"},{"key":"TEID-12","code":"E12","name":"Implement processor-neutral payments","desc":"Decouple ledger, pricing, and history from any single payment processor to ensure complete processor neutrality. Provide flexibility to add or switch payment providers freely.","release":"mvp"},{"key":"TEID-11","code":"E11","name":"Implement Teideal Verify independent revenue verification","desc":"Independently verify that all usage is correctly billed and collected across any billing platform without system replacement. Eliminate manual finance reconciliations and surface revenue leakage risks.","release":"mvp"},{"key":"TEID-10","code":"E10","name":"Enable shadow enforcement and go-live","desc":"Transition customers from verification to live entitlement enforcement and billing cohort by cohort with instant rollback capabilities. Convert verified trust into live operational usage safely.","release":"phase-2"},{"key":"TEID-9","code":"E09","name":"Improve developer experience and testing","desc":"Streamline integration to take a day and allow full testing of renewals, expiries, and overages prior to launch. Provide safe simulation tools for billing scenario validation.","release":"mvp"},{"key":"TEID-8","code":"E08","name":"Implement AI operator intelligence","desc":"Leverage AI to simulate pricing changes, detect usage anomalies, prevent free-tier abuse, and identify expansion opportunities. Reduce operator overhead and eliminate risks associated with pricing updates.","release":"phase-2"},{"key":"TEID-7","code":"E07","name":"Build cost and margin analytics","desc":"Combine revenue and inference cost data to calculate gross margin by customer, plan, and model. Help founders verify profitability across heavy user segments.","release":"phase-2"},{"key":"TEID-6","code":"E06","name":"Enable operator visibility, alerts, and customer-facing usage","desc":"Provide support, finance, and customers direct visibility into balance history and burn rate without engineering intervention. Streamline billing inquiries and clarify charge discrepancies.","release":"mvp"},{"key":"TEID-5","code":"E05","name":"Establish tenant isolation, access control, and data ownership","desc":"Implement structural isolation, auditability, and data portability guarantees verifiable by enterprise security teams. Unblock enterprise approvals by providing audit trails and clear exit strategies.","release":"mvp"},{"key":"TEID-4","code":"E04","name":"Develop Stripe connector (read-first) and invoice sync","desc":"Connect to Stripe read-only for verification, adding write access for invoice sync and credit grants as billing migrates. Reconciliation itself is handled by Teideal Verify (TEID-11).","release":"mvp"},{"key":"TEID-3","code":"E03","name":"Build usage ingestion and exactly-once ledger","desc":"Ingest usage events at scale and record every balance change exactly once in an immutable ledger. Ensure balances are always derived accurately and prevent counter drift across deploys.","release":"mvp"},{"key":"TEID-2","code":"E02","name":"Implement real-time authorization and entitlement checks","desc":"Provide authorization and entitlement checks (p99 under 20 ms) on the request path for streaming and long-running jobs. Prevent balance drift while ensuring billing outages do not disrupt the customer product.","release":"phase-2"},{"key":"TEID-1","code":"E01","name":"Implement entitlement model and pricing configuration","desc":"Configure plans, grants, commits, overrides, and caps without custom code. This replaces special-case deal code and enables clear visibility into pricing applied to usage.","release":"mvp"},{"key":"TEID-87","code":"E16","name":"Establish security and SOC 2 compliance programme","desc":"Put the security controls, evidence and independent assurance in place that enterprise buyers require before connecting billing data. SOC 2 Type II was named by the founder as a condition of signing.","release":"mvp","provisional":true},{"key":"TEID-88","code":"E17","name":"Establish data protection and privacy","desc":"Handle the personal data inside customers' billing records lawfully and minimally, with clear retention, deletion and data-processing terms (including GDPR and India's DPDP Act).","release":"mvp","provisional":true},{"key":"TEID-89","code":"E18","name":"Establish platform reliability and operations","desc":"Operate Teideal as financial infrastructure: defined service levels, monitoring, recoverable backups, safe deployments and honest incident communication.","release":"mvp","provisional":true},{"key":"TEID-90","code":"E19","name":"Establish AI guardrails and governance","desc":"Make every AI feature safe to use on financial data: no training on customer data, no unconfirmed changes, grounded answers, resistance to prompt injection, and measured accuracy. Applies to TEID-46, TEID-79, TEID-58 and all of E08.","release":"mvp","provisional":true}],"stories":[{"key":"TEID-41","epic":"TEID-5","summary":"Structural tenant isolation","desc":"As a security reviewer at our customer, I want evidence that one tenant's data can never be read or changed by another, so that we can approve Teideal for production use.\n\n*Context*\nIsolation must be enforced by the data layer, not only by application checks.","priority":"Highest","points":8,"release":"mvp","area":"security","ac":["Every table holding tenant data enforces isolation in the database itself (for example, row-level security).","An automated test suite, run on every release, attempts cross-tenant reads and writes through every API and must fail to access any other tenant's data.","Any release that fails these tests is blocked from deployment.","A written description of the isolation design is available to customers on request."],"order":1,"tests":[{"id":"TEID-41-T1","title":"Run the RLS policy audit script against all tenant-scoped tables in the production schema and confirm each table has row-level security enabled that rejects a raw SELECT without a matching tenant_id predicate.","ac":1,"type":"Functional"},{"id":"TEID-41-T2","title":"Execute the cross-tenant regression suite using tenant acct_1001 credentials against every documented API endpoint targeting tenant acct_1002 resources and confirm every attempt returns 403 or an empty result set with zero acct_1002 records leaked.","ac":2,"type":"Functional"},{"id":"TEID-41-T3","title":"Seed the cross-tenant isolation suite to fail on the invoices endpoint during a CI pipeline run and confirm the deployment stage is automatically blocked with a red gate status rather than proceeding to release.","ac":3,"type":"Functional"},{"id":"TEID-41-T4","title":"Request the tenant isolation design document through the customer support portal for account acct_1001 and confirm a written architecture description covering the row-level-security enforcement is delivered within the documented SLA.","ac":4,"type":"Functional"},{"id":"TEID-41-T5","title":"Run the full cross-tenant isolation regression suite of 200-plus probe cases against staging and confirm it completes in under 15 minutes so it does not block release cadence.","ac":2,"type":"Non-functional"},{"id":"TEID-41-T6","title":"Confirm a blocked cross-tenant query attempt is captured in the security monitoring dashboard with tenant_id, endpoint and timestamp within 60 seconds of the attempt.","ac":1,"type":"Non-functional"},{"id":"TEID-41-T7","title":"Submit a filter parameter containing the SQL injection payload ' OR '1'='1 on the GET /usage endpoint authenticated as tenant acct_1001 and confirm no rows belonging to tenant acct_1002 are returned.","ac":1,"type":"Adversarial"},{"id":"TEID-41-T8","title":"Using a valid API key for tenant acct_1001, substitute tenant acct_1002's UUID into the path of PATCH /customers/{id} and confirm the request is rejected with 403 rather than silently updating acct_1002's record.","ac":2,"type":"Adversarial"}]},{"key":"TEID-91","epic":"TEID-5","summary":"Console sign-in with multi-factor authentication","desc":"As a Teideal user, I want to sign in securely with multi-factor authentication, so that access to financial data is protected even if a password leaks.\n\n*Context*\nComplements role-based access (TEID-43).","priority":"Highest","points":5,"release":"mvp","area":"security","ac":["Users can sign in with email and password or with Google sign-in.","Multi-factor authentication (authenticator app) is mandatory for Owner and Billing Admin roles and optional for others; an Owner can make it mandatory for everyone.","Idle sessions expire after 8 hours by default; the Owner can shorten this.","After 10 failed attempts the account is locked for 15 minutes and the user is notified by email.","All sign-ins, failed attempts, MFA changes and lockouts are recorded in the audit log (TEID-42)."],"provisional":true,"order":2,"tests":[{"id":"TEID-91-T1","title":"Sign in to the console with valid email and password for support@acmeco.com and confirm success, then repeat sign-in for the same account using Google sign-in and confirm it also succeeds.","ac":1,"type":"Functional"},{"id":"TEID-91-T2","title":"As an Owner, toggle Require MFA for all roles on, then attempt to sign in as an existing Support-role user with no enrolled MFA and confirm they are forced into authenticator-app enrollment before reaching the dashboard.","ac":2,"type":"Functional"},{"id":"TEID-91-T3","title":"Leave a Finance user's session idle for 8 hours and 1 minute and confirm the next action requires re-authentication, then confirm an Owner can set the idle timeout to 30 minutes and have it take effect immediately for new sessions.","ac":3,"type":"Functional"},{"id":"TEID-91-T4","title":"Attempt sign-in with an incorrect password 10 consecutive times for billing@acmeco.com and confirm the account locks for 15 minutes and a lockout notification email is sent to that address.","ac":4,"type":"Functional"},{"id":"TEID-91-T5","title":"Perform a successful sign-in, a failed sign-in, an MFA method change and an account lockout for the same test user, then confirm all four events appear in the audit log with correct event type and timestamp.","ac":5,"type":"Functional"},{"id":"TEID-91-T6","title":"Simulate 5,000 concurrent sessions reaching their 8-hour idle expiry within the same one-minute window and confirm the expiry job processes all of them without degrading sign-in latency for new logins.","ac":3,"type":"Non-functional"},{"id":"TEID-91-T7","title":"Add 500ms of simulated latency to the Google OAuth identity provider and confirm sign-in still completes within 2 seconds or fails with a clear timeout message rather than hanging.","ac":1,"type":"Non-functional"},{"id":"TEID-91-T8","title":"Script 10 failed login attempts against the same account from 10 different IP addresses within one minute and confirm the lockout still triggers based on account identity rather than being bypassed via IP rotation.","ac":4,"type":"Adversarial"},{"id":"TEID-91-T9","title":"Attempt to disable MFA on an Owner account via a direct API call while authenticated with only a password and no MFA step-up, and confirm the request is rejected.","ac":2,"type":"Adversarial"}]},{"key":"TEID-42","epic":"TEID-5","summary":"Audit log of all configuration changes","desc":"As a finance lead, I want a permanent record of who changed what and when, so that every pricing or balance decision can be explained to auditors.\n\n*Context*\n","priority":"Highest","points":5,"release":"mvp","area":"security","ac":["Every change to plans, grants, commits, overrides, caps, users and integrations is logged with who, when, what, before and after.","Audit log entries cannot be edited or deleted.","The audit log can be filtered by person, customer, object and date, and exported as CSV."],"order":3,"tests":[{"id":"TEID-42-T1","title":"Change the monthly cap on customer acct_2002 from $5,000 to $7,500 and confirm an audit entry is created showing the acting user, timestamp, object type Cap, before value 5000 and after value 7500.","ac":1,"type":"Functional"},{"id":"TEID-42-T2","title":"Attempt a direct DELETE and a direct PATCH against an existing audit log entry ID via the API using an Owner-level key and confirm both are rejected with 403 or 405 and the entry remains unchanged.","ac":2,"type":"Functional"},{"id":"TEID-42-T3","title":"Filter the audit log by person jane@acmeco.com, object type Plan and a 30-day date range, then export the filtered results as CSV and confirm the file contains only matching rows with correct column headers.","ac":3,"type":"Functional"},{"id":"TEID-42-T4","title":"Filter and export the audit log for a single customer over a 2-year range containing 1.2 million entries and confirm the CSV export completes within 60 seconds.","ac":3,"type":"Non-functional"},{"id":"TEID-42-T5","title":"Generate 10,000 configuration changes in a load test and confirm exactly 10,000 corresponding audit entries are produced with no drops or duplicates.","ac":1,"type":"Non-functional"},{"id":"TEID-42-T6","title":"Attempt to truncate or overwrite audit log rows via a database-level connection using a compromised service-role credential and confirm append-only or immutability controls prevent silent deletion or tampering.","ac":2,"type":"Adversarial"},{"id":"TEID-42-T7","title":"Submit two simultaneous conflicting updates to the same grant record from two different admin sessions and confirm both changes are captured as separate, correctly ordered audit entries rather than one overwriting the other's log record.","ac":1,"type":"Adversarial"}]},{"key":"TEID-92","epic":"TEID-5","summary":"API key lifecycle: create, scope, rotate, revoke","desc":"As a developer at our customer, I want to manage API keys with limited scopes and rotate them without downtime, so that a leaked or outdated key never gives more access than necessary or causes an outage.","priority":"Highest","points":5,"release":"mvp","area":"security","ac":["Keys can be created with a scope: ingest-only, read-only, or admin, and for either sandbox or production.","The full key is shown once at creation; Teideal stores only a hash and can never display it again.","Rotating a key issues a new one while the old one keeps working for a grace period (default 24 hours, configurable), then stops.","A revoked key stops working everywhere within 60 seconds.","Each key shows its creator, scope, creation date and last-used time; creation, rotation and revocation are audit-logged."],"provisional":true,"order":4,"tests":[{"id":"TEID-92-T1","title":"Create a new API key with scope read-only for the production environment and confirm it is created with environment=production and scope=read-only correctly set.","ac":1,"type":"Functional"},{"id":"TEID-92-T2","title":"Create a new API key and confirm the full plaintext key is displayed exactly once in the creation dialog, then reopen the key detail view and confirm only a masked value such as sk_live_****1234 is ever shown again.","ac":2,"type":"Functional"},{"id":"TEID-92-T3","title":"Rotate an active production API key using the default 24-hour grace period, confirm both old and new keys authenticate successfully at hour 23, and confirm the old key is rejected with 401 at hour 25.","ac":3,"type":"Functional"},{"id":"TEID-92-T4","title":"Revoke an active read-only key that is currently in use and confirm a request made with that key 90 seconds later is rejected with 401 across regions.","ac":4,"type":"Functional"},{"id":"TEID-92-T5","title":"Create, rotate and revoke a test API key, then confirm the key detail view shows correct creator, scope, creation date and last-used timestamp, and confirm all three lifecycle actions appear as separate audit log entries.","ac":5,"type":"Functional"},{"id":"TEID-92-T6","title":"Measure the time from calling the revoke-key API to the key being rejected across 5 regional edge nodes and confirm propagation completes within the documented 60-second SLA in at least 99% of trials.","ac":4,"type":"Non-functional"},{"id":"TEID-92-T7","title":"Create 1,000 API keys across sandbox and production scopes for a single tenant and confirm the key management list view still loads and paginates without timeout.","ac":1,"type":"Non-functional"},{"id":"TEID-92-T8","title":"During the 24-hour grace period after rotating a key, run 5,000 requests per minute against the old key and confirm its scope and rate limits still apply identically to before rotation, with no elevated access granted.","ac":3,"type":"Adversarial"},{"id":"TEID-92-T9","title":"Attempt to retrieve the plaintext value of a previously created key via any API endpoint or database export and confirm it is unrecoverable, with only a one-way hash ever returned.","ac":2,"type":"Adversarial"}]},{"key":"TEID-43","epic":"TEID-5","summary":"Role-based access","desc":"As a account owner, I want to give each team member only the access they need, so that support and finance can do their jobs without being able to change pricing.\n\n*Context*\n","priority":"High","points":5,"release":"mvp","area":"security","ac":["Built-in roles: Owner, Billing Admin, Finance (read and approve adjustments), Support (read only), Developer (API keys and sandbox).","Each API endpoint and console screen checks the user's role.","Role changes are recorded in the audit log.","Single sign-on can be enabled for the account (phase 2 for SAML)."],"order":5,"tests":[{"id":"TEID-43-T1","title":"Create one user for each of the five built-in roles Owner, Billing Admin, Finance, Support and Developer and confirm each is assignable and correctly labeled in the user management screen.","ac":1,"type":"Functional"},{"id":"TEID-43-T2","title":"Log in as a Support-role user and attempt to open the plan-editing screen and call PATCH /plans directly, and confirm both the UI and the API return 403 since Support is read-only.","ac":2,"type":"Functional"},{"id":"TEID-43-T3","title":"Change a user's role from Developer to Finance and confirm an audit log entry captures the user, old role, new role, acting admin and timestamp.","ac":3,"type":"Functional"},{"id":"TEID-43-T4","title":"As an Owner, enable single sign-on for the account and confirm the login screen now offers an SSO option consistent with the documented phase-2 scope.","ac":4,"type":"Functional"},{"id":"TEID-43-T5","title":"Add a new console screen without a role annotation on its route and confirm the build or deployment pipeline fails the regression guard rather than shipping an unguarded screen.","ac":2,"type":"Non-functional"},{"id":"TEID-43-T6","title":"As a Support user, navigate to a restricted screen and confirm the UI shows a clear explanatory access-denied message rather than a blank page or generic error.","ac":2,"type":"Non-functional"},{"id":"TEID-43-T7","title":"As a Finance-role user, call the admin-only DELETE /users/{id} endpoint directly via API bypassing the UI and confirm the role check still rejects the request with 403.","ac":2,"type":"Adversarial"},{"id":"TEID-43-T8","title":"Attempt to assign a nonexistent role string such as SuperOwner to a user via a direct API call and confirm the request is rejected with a validation error rather than creating an unrestricted role.","ac":1,"type":"Adversarial"}]},{"key":"TEID-44","epic":"TEID-5","summary":"Full data export","desc":"As a account owner, I want to export all of my ledger, events and configuration at any time, so that my data is mine and I am never locked in.\n\n*Context*\n","priority":"High","points":8,"release":"mvp","area":"security","ac":["An owner can export the full ledger, usage events, grants and configuration in CSV, JSON and Parquet.","A full export of all history is ready within 24 hours; smaller date ranges within 1 hour.","Scheduled exports can be delivered daily to the customer's own cloud storage.","The export format is documented so it can be loaded into another system."],"order":6,"tests":[{"id":"TEID-44-T1","title":"Request a full export of ledger, usage events, grants and configuration for tenant acct_3003 in CSV, JSON and Parquet, and confirm each file is generated with matching record counts across all three formats.","ac":1,"type":"Functional"},{"id":"TEID-44-T2","title":"Request a full-history export for a tenant with 3 years of data and confirm it completes within 24 hours, then request a 7-day export for the same tenant and confirm it completes within 1 hour.","ac":2,"type":"Functional"},{"id":"TEID-44-T3","title":"Configure a scheduled daily export to the customer's own S3 bucket and confirm a new export file lands in that bucket at the configured time on 3 consecutive days.","ac":3,"type":"Functional"},{"id":"TEID-44-T4","title":"Download the published export format documentation and confirm it accurately describes every column present in the actual generated ledger CSV, with no undocumented fields.","ac":4,"type":"Functional"},{"id":"TEID-44-T5","title":"Trigger a full export for a tenant with 50 million usage events and confirm the job completes within the 24-hour SLA without timing out or requiring manual intervention.","ac":2,"type":"Non-functional"},{"id":"TEID-44-T6","title":"Simulate the customer's S3 destination being temporarily unreachable during a scheduled export and confirm the export is retried and an alert is raised rather than being silently dropped.","ac":3,"type":"Non-functional"},{"id":"TEID-44-T7","title":"Trigger 5 full-history export requests for the same tenant simultaneously and confirm the system either queues them safely or produces 5 consistent, non-corrupted files rather than a race condition corrupting output.","ac":1,"type":"Adversarial"},{"id":"TEID-44-T8","title":"Configure a scheduled export destination pointing at a cloud storage bucket the requesting account does not own and confirm the system validates ownership before sending data, rejecting the misconfigured destination.","ac":3,"type":"Adversarial"}]},{"key":"TEID-102","epic":"TEID-87","summary":"SOC 2 readiness and audit plan","desc":"As a founder, I want a clear path to a SOC 2 Type I report and then Type II, so that security reviews stop blocking deals.","priority":"Highest","points":8,"release":"mvp","area":"security","ac":["An auditor and a compliance automation tool are selected and contracted.","Controls are mapped to the Security, Availability and Confidentiality criteria, with an owner for each control.","Evidence is collected automatically wherever the tool supports it.","The Type I audit date and the start of the Type II observation window are set and tracked.","Customers can see our current status (for example 'Type I complete, Type II in progress')."],"provisional":true,"order":7,"tests":[{"id":"TEID-102-T1","title":"Confirm signed contracts exist naming both the SOC 2 auditor and the compliance automation vendor, with executed dates on file.","ac":1,"type":"Functional"},{"id":"TEID-102-T2","title":"Pull the control matrix and confirm every control is tagged to at least one of the Security, Availability or Confidentiality trust services criteria and has a named individual owner, with zero unowned controls.","ac":2,"type":"Functional"},{"id":"TEID-102-T3","title":"Spot-check 10 controls flagged as auto-evidenced in the compliance tool and confirm each has a fresh automated evidence artifact collected within the last 24 hours rather than a manually uploaded stale file.","ac":3,"type":"Functional"},{"id":"TEID-102-T4","title":"Check the audit tracker and confirm it holds a committed Type I audit date and a Type II observation window start date, both tracked against calendar milestones.","ac":4,"type":"Functional"},{"id":"TEID-102-T5","title":"View the customer-facing trust status indicator and confirm it accurately reflects the current phase, for example Type I complete and Type II in progress, matching the internal audit tracker.","ac":5,"type":"Functional"},{"id":"TEID-102-T6","title":"Confirm the compliance automation tool's evidence-collection integrations raise a sync-failure alert to the compliance owner within 1 hour of an API credential expiring.","ac":3,"type":"Non-functional"},{"id":"TEID-102-T7","title":"Attempt to manually mark a control as compliant in the automation tool without an attached evidence artifact and confirm the tool blocks or flags the control as unverified.","ac":3,"type":"Adversarial"},{"id":"TEID-102-T8","title":"Attempt to access the internal pre-Type-I compliance dashboard from an unauthenticated customer-facing session and confirm only the sanitized public status page is reachable, not raw control evidence.","ac":5,"type":"Adversarial"}]},{"key":"TEID-103","epic":"TEID-87","summary":"Encryption in transit and at rest","desc":"As a security reviewer at our customer, I want all data encrypted in transit and at rest with managed keys, so that our billing data is protected if storage or traffic is exposed.","priority":"Highest","points":5,"release":"mvp","area":"security","ac":["All external and internal traffic uses TLS 1.2 or higher.","All databases, file storage, queues and backups are encrypted at rest.","Encryption keys are held in a managed key service and rotated at least yearly.","Connector credentials and personal-data fields are additionally encrypted at field level."],"provisional":true,"order":8,"tests":[{"id":"TEID-103-T1","title":"Run a TLS scan against every public endpoint and every internal service-to-service link and confirm no connection negotiates below TLS 1.2 and that TLS 1.0, TLS 1.1 and SSLv3 are disabled.","ac":1,"type":"Functional"},{"id":"TEID-103-T2","title":"Inspect the configuration of every database, object storage bucket, message queue and backup target and confirm encryption at rest is enabled on each using the managed key service.","ac":2,"type":"Functional"},{"id":"TEID-103-T3","title":"Query the managed key service for the data-encryption keys in use and confirm each has a rotation policy of 365 days or less, with the last rotation timestamp within that window.","ac":3,"type":"Functional"},{"id":"TEID-103-T4","title":"Retrieve a stored connector credential and a personal-data field directly from the database and confirm the raw value is ciphertext, not plaintext, even though the surrounding row is already encrypted at rest.","ac":4,"type":"Functional"},{"id":"TEID-103-T5","title":"Measure the added latency from enforcing TLS 1.2 or higher with the production cipher suite on the p99 API request path and confirm it adds no more than 10ms versus an unencrypted baseline.","ac":1,"type":"Non-functional"},{"id":"TEID-103-T6","title":"Attempt to connect to a public endpoint forcing a TLS 1.0 handshake or a weak cipher suite such as RC4 and confirm the connection is refused.","ac":1,"type":"Adversarial"},{"id":"TEID-103-T7","title":"Attempt to export or read a raw data-encryption key from the managed key service using an IAM role without explicit key-usage permission and confirm access is denied and the attempt is logged.","ac":3,"type":"Adversarial"}]},{"key":"TEID-104","epic":"TEID-87","summary":"Secrets management and production access control","desc":"As a Teideal engineer, I want secrets kept out of code and production access granted only when needed, so that a leaked repository or laptop cannot expose customer data.","priority":"Highest","points":5,"release":"mvp","area":"security","ac":["Automated scanning blocks any commit containing a secret.","All secrets live in a managed secrets store, and every access is logged.","No engineer has standing access to production data; access is granted just in time, with approval, a reason and an expiry.","All production access sessions are logged and reviewed monthly."],"provisional":true,"order":9,"tests":[{"id":"TEID-104-T1","title":"Attempt to commit a file containing a realistic dummy cloud access key pattern and confirm the automated secret scanner blocks the push before it reaches the shared branch.","ac":1,"type":"Functional"},{"id":"TEID-104-T2","title":"Retrieve a database credential from the managed secrets store and confirm the access is recorded in the audit log with requester identity, timestamp and secret name.","ac":2,"type":"Functional"},{"id":"TEID-104-T3","title":"Attempt to query production customer data with an engineer's standard credentials with no active access grant and confirm the request is denied, then request just-in-time access with a reason, confirm it requires approval, and confirm it auto-expires after the requested window.","ac":3,"type":"Functional"},{"id":"TEID-104-T4","title":"Pull the monthly production-access review record and confirm every session from the prior month appears with reviewer sign-off and no unreviewed entries older than 30 days.","ac":4,"type":"Functional"},{"id":"TEID-104-T5","title":"Time the just-in-time access request-to-approval flow for a standard on-call scenario and confirm an engineer can obtain approved access within 15 minutes during business hours.","ac":3,"type":"Non-functional"},{"id":"TEID-104-T6","title":"Attempt to commit a secret disguised as a base64-encoded string split across multiple lines to evade pattern matching and confirm the scanner's entropy-based detection still flags it.","ac":1,"type":"Adversarial"},{"id":"TEID-104-T7","title":"After a just-in-time access grant expires, attempt to reuse the previously issued production session token and confirm it is rejected rather than silently still working.","ac":3,"type":"Adversarial"}]},{"key":"TEID-105","epic":"TEID-87","summary":"Vulnerability and dependency management","desc":"As a Teideal engineer, I want known vulnerabilities found and fixed on a defined timeline, so that we do not ship or keep running exploitable code.","priority":"Highest","points":5,"release":"mvp","area":"security","ac":["Dependency, container and static code scanning run on every change.","Critical vulnerabilities are fixed within 7 days and high ones within 30 days; exceptions need a recorded approval.","Open vulnerabilities are tracked with owners and due dates.","A release with an unresolved critical vulnerability is blocked."],"provisional":true,"order":10,"tests":[{"id":"TEID-105-T1","title":"Open a pull request that introduces a dependency with a known CVE and confirm the CI pipeline automatically runs dependency scanning, container image scanning, and static analysis, all reporting results on that pull request.","ac":1,"type":"Functional"},{"id":"TEID-105-T2","title":"Introduce a synthetic critical-severity finding into a test dependency and confirm the remediation due date recorded is exactly 7 calendar days out, confirm a high-severity finding on the same day is due at 30 days, and confirm any exception beyond those windows requires a named approver and justification.","ac":2,"type":"Functional"},{"id":"TEID-105-T3","title":"Pull the open-vulnerabilities register and confirm every entry has an assigned owner and a due date, with zero unowned or undated entries.","ac":3,"type":"Functional"},{"id":"TEID-105-T4","title":"Attempt to build and tag a release while the synthetic critical vulnerability from the prior test remains unresolved and confirm the release pipeline blocks the tag and publish step.","ac":4,"type":"Functional"},{"id":"TEID-105-T5","title":"Run the full dependency and container scan suite against the largest service in the monorepo and confirm it completes in under 10 minutes so it does not bottleneck the CI pipeline.","ac":1,"type":"Non-functional"},{"id":"TEID-105-T6","title":"Attempt to bypass the release gate by force-merging or manually tagging a release outside the CI pipeline while a critical vulnerability is open and confirm a separate policy check still blocks the artifact from being published to the registry.","ac":4,"type":"Adversarial"},{"id":"TEID-105-T7","title":"Record an exception for a critical vulnerability with no approver field populated and confirm the tracking system rejects the exception as invalid rather than silently extending the due date.","ac":2,"type":"Adversarial"}]},{"key":"TEID-107","epic":"TEID-87","summary":"Security incident response","desc":"As a founder, I want a tested plan for handling security incidents, so that we respond quickly and meet our notification obligations.","priority":"Highest","points":3,"release":"mvp","area":"security","ac":["A written incident response plan defines severity levels, roles, escalation and communication.","Affected customers are notified without undue delay and within 72 hours of confirming a breach of their data, or sooner if their contract or local law requires it.","A tabletop exercise is run before the first design partner goes live and at least yearly.","Every incident has a written post-incident review with actions tracked to completion."],"provisional":true,"order":11,"tests":[{"id":"TEID-107-T1","title":"Review the published incident response plan and confirm it defines at least three severity levels, named on-call roles, an escalation path with contact times, and a customer communication template.","ac":1,"type":"Functional"},{"id":"TEID-107-T2","title":"Run a simulated confirmed data breach scenario and confirm the customer notification is drafted and sent within 72 hours of the confirmation timestamp, and confirm the plan flags a shorter deadline when a specific customer contract requires it.","ac":2,"type":"Functional"},{"id":"TEID-107-T3","title":"Confirm a tabletop exercise was completed and documented before the first design partner's go-live date, and confirm the exercise log shows at least one occurrence in each subsequent 12-month period.","ac":3,"type":"Functional"},{"id":"TEID-107-T4","title":"Pull the record for the most recent security incident and confirm it includes a written post-incident review with root cause, and confirm every listed corrective action has a status and is either completed or has an open tracking ticket.","ac":4,"type":"Functional"},{"id":"TEID-107-T5","title":"Survey tabletop exercise participants immediately afterward and confirm at least 90 percent correctly identify their role and the escalation contact for a SEV1 incident.","ac":3,"type":"Non-functional"},{"id":"TEID-107-T6","title":"Simulate an incident where the breach confirmation timestamp is disputed or delayed internally and confirm the 72-hour notification clock is measured from the earliest defensible confirmation evidence, not from a later administratively convenient time.","ac":2,"type":"Adversarial"},{"id":"TEID-107-T7","title":"Simulate a SEV1 incident occurring outside business hours and confirm the defined escalation path still reaches an on-call responder within the plan's stated response time via the paging system.","ac":1,"type":"Adversarial"}]},{"key":"TEID-30","epic":"TEID-3","summary":"Usage event ingestion API","desc":"As a developer at our customer, I want to send usage events one at a time or in batches, so that every billable action is recorded reliably.\n\n*Context*\nEach event carries an idempotency key, customer, metric, quantity, the time it happened and optional metadata.","priority":"Highest","points":8,"release":"mvp","area":"ledger","ac":["The API accepts single events and batches of up to 1,000 events.","An event is only acknowledged after it has been stored durably; an acknowledged event is never lost.","The system sustains 15,000 events per second (three times the customer's current peak) without errors or growing delay.","Invalid events are rejected with a specific reason per event; valid events in the same batch are still accepted.","Events are reflected in balances within 2 seconds of acknowledgement under normal load."],"order":12,"tests":[{"id":"TEID-30-T1","title":"Submit a single event via the ingestion API and confirm a 201 with an event ID, then submit one batch containing exactly 1,000 events and confirm all 1,000 are accepted with individual per-event statuses.","ac":1,"type":"Functional"},{"id":"TEID-30-T2","title":"Submit an event, capture the timestamp the acknowledgment is returned, and confirm the event is already durably committed and queryable in the store at that exact moment, with no async delay between ack and durability.","ac":2,"type":"Functional"},{"id":"TEID-30-T3","title":"Run a sustained load test at 15,000 events per second for 30 minutes and confirm zero ingestion errors and no growth in queue backlog or processing lag over the run.","ac":3,"type":"Functional"},{"id":"TEID-30-T4","title":"Submit a batch of 10 events where events 3 and 7 have an invalid metric name and a negative quantity respectively, and confirm the response lists a specific rejection reason for each of the two while the other 8 are accepted and stored.","ac":4,"type":"Functional"},{"id":"TEID-30-T5","title":"Submit an event under a steady background load of 1,000 events per second and poll the customer's balance every 100ms, confirming the balance reflects the new event within 2,000ms of acknowledgment.","ac":5,"type":"Functional"},{"id":"TEID-30-T6","title":"Run the 15,000 events/sec load test for 30 minutes and confirm p99 ingestion latency stays under 200ms throughout with no upward trend.","ac":3,"type":"Non-functional"},{"id":"TEID-30-T7","title":"Monitor the event-to-balance lag metric on the observability dashboard during steady 5,000 events/sec traffic and confirm the p99 lag never exceeds the 2-second alert threshold.","ac":5,"type":"Non-functional"},{"id":"TEID-30-T8","title":"Submit a batch of 1,001 events in a single request and confirm the API rejects the entire batch with a clear batch-size-exceeded error instead of silently processing only the first 1,000.","ac":1,"type":"Adversarial"},{"id":"TEID-30-T9","title":"Submit a batch containing one event with a negative quantity and one with SQL-injection-style characters in the metric name field, and confirm both are rejected with specific validation reasons without crashing the service or affecting the other valid events in the batch.","ac":4,"type":"Adversarial"}]},{"key":"TEID-94","epic":"TEID-3","summary":"Currency precision and rounding rules","desc":"As a finance lead, I want clear, configurable rules for how and when amounts are rounded, so that 'matched to the cent' means the same thing in Teideal as in our billing system.\n\n*Context*\nRounding differences are the most common source of false mismatches in verification (TEID-69).","priority":"Highest","points":5,"release":"mvp","area":"ledger","ac":["Each currency uses its official number of decimal places (for example 2 for USD and INR, 0 for JPY, 3 for KWD).","All calculations use exact decimal arithmetic; floating-point numbers are never used for money, and an automated check blocks code that does.","Rounding happens only at defined points: by default per invoice line, configurable to per invoice or per event.","The rounding method is configurable (round half up by default, or round half to even), per tenant and per imported billing system so Verify can match it.","The lines of an invoice always add up exactly to the invoice total, and any rounding difference is recorded as its own ledger entry."],"provisional":true,"order":13,"tests":[{"id":"TEID-94-T1","title":"Generate invoices for the same tenant in USD, JPY, and KWD and confirm amounts render with 2, 0, and 3 decimal places respectively, matching each currency's official minor-unit precision.","ac":1,"type":"Functional"},{"id":"TEID-94-T2","title":"Run the CI static-analysis rule against a branch that introduces a float-typed monetary field and confirm the build fails; confirm existing money fields all use a fixed-point or decimal type.","ac":2,"type":"Functional"},{"id":"TEID-94-T3","title":"Configure rounding-point to per-invoice-line for one test tenant and per-invoice-total for another, run the identical 3-line invoice with fractional cents through both, and confirm the two configurations produce the expected differing totals.","ac":3,"type":"Functional"},{"id":"TEID-94-T4","title":"Set tenant A to round-half-up and tenant B to round-half-to-even, run the same 0.125 USD line item through both, and confirm tenant A produces 0.13 while tenant B produces 0.12.","ac":4,"type":"Functional"},{"id":"TEID-94-T5","title":"Generate an invoice with 3 line items summing to 100.005 USD and confirm the displayed line amounts add up exactly to the displayed invoice total, with the 0.005 remainder posted as its own rounding-adjustment ledger entry.","ac":5,"type":"Functional"},{"id":"TEID-94-T6","title":"Audit the money-arithmetic module's call sites and confirm 100 percent of monetary calculation paths route through the decimal type, with zero direct float casts flagged by static analysis.","ac":2,"type":"Non-functional"},{"id":"TEID-94-T7","title":"Confirm a finance operator can change a tenant's rounding method from the tenant settings screen in 3 clicks or fewer, without engineering assistance.","ac":4,"type":"Non-functional"},{"id":"TEID-94-T8","title":"Attempt to set a rounding method value outside the allowed enum, such as round_down_always, via a direct API call and confirm the request is rejected with a validation error rather than silently applied.","ac":4,"type":"Adversarial"},{"id":"TEID-94-T9","title":"Configure a unit price using the classic floating-point-imprecise literal equivalent of 0.1 plus 0.2 and confirm the system stores and computes it as the exact decimal 0.30, not a value like 0.30000000000000004.","ac":2,"type":"Adversarial"}]},{"key":"TEID-95","epic":"TEID-3","summary":"Sub-cent unit prices and very large quantities","desc":"As a billing operator, I want to price usage at fractions of a cent and bill very large quantities accurately, so that per-token and per-request pricing is represented exactly.\n\n*Context*\nExample: 0.0000015 USD per token over billions of tokens.","priority":"Highest","points":3,"release":"mvp","area":"ledger","ac":["Unit prices support at least 12 decimal places.","Quantities up to one trillion units per event and per period are handled without overflow or loss of precision.","A test prices 3 billion tokens at 0.0000015 USD and produces exactly 4,500.00 USD.","Unit prices are shown in full precision in the console and exports, and rounded only on invoices."],"provisional":true,"order":14,"tests":[{"id":"TEID-95-T1","title":"Configure a unit price of 0.000000000001 USD, 12 decimal places, and confirm it is stored and retrieved without truncation or rounding.","ac":1,"type":"Functional"},{"id":"TEID-95-T2","title":"Submit a single usage event with a quantity of 1,000,000,000,000 units and confirm the ledger records the exact quantity with no overflow error and no precision loss.","ac":2,"type":"Functional"},{"id":"TEID-95-T3","title":"Price 3,000,000,000 tokens at 0.0000015 USD per token and confirm the computed line amount equals exactly 4,500.00 USD.","ac":3,"type":"Functional"},{"id":"TEID-95-T4","title":"View a SKU priced at 0.0000015 USD in the console and in a CSV export and confirm both show the full 0.0000015 value, then generate its invoice and confirm the invoice line is rounded to 2 decimal places.","ac":4,"type":"Functional"},{"id":"TEID-95-T5","title":"Load a customer account with 500 usage events each carrying quantities near 1 trillion within a single billing period and confirm aggregation completes within 5 seconds with no overflow or precision loss.","ac":2,"type":"Non-functional"},{"id":"TEID-95-T6","title":"Submit a usage event with quantity 1,000,000,000,001, one unit over the trillion cap, and confirm the API rejects it with an explicit quantity-exceeds-maximum error instead of silently overflowing or wrapping.","ac":2,"type":"Adversarial"},{"id":"TEID-95-T7","title":"Submit a unit price with 20 decimal places, exceeding the 12-place support, and confirm the system either rejects it with a clear precision-limit error or deterministically truncates at 12 places rather than silently corrupting the stored value.","ac":1,"type":"Adversarial"}]},{"key":"TEID-96","epic":"TEID-3","summary":"Billing periods, time zones and boundary rules","desc":"As a finance lead, I want billing periods to start and end at the right moment in each customer's time zone, so that events near midnight, month end or clock changes are always assigned to the correct period.","priority":"Highest","points":5,"release":"mvp","area":"ledger","ac":["All event times are stored in UTC.","Each customer has a billing time zone (default UTC), and period boundaries are calculated in that zone, including daylight-saving changes.","An event timestamped exactly on a boundary belongs to the new period; this rule is documented.","Month-end anchors are handled consistently (a subscription anchored on the 31st bills on the last day of shorter months).","Automated tests cover daylight-saving transition days, month ends, year ends and 29 February."],"provisional":true,"order":15,"tests":[{"id":"TEID-96-T1","title":"Submit an event with local timestamp 2026-03-10T02:30:00-05:00 and confirm it is persisted internally as 2026-03-10T07:30:00Z.","ac":1,"type":"Functional"},{"id":"TEID-96-T2","title":"Set a customer's billing timezone to America/New_York and confirm their monthly period boundary on the November DST fall-back date rolls over at local midnight, 05:00 UTC that day, rather than the 04:00 UTC offset used on adjacent days.","ac":2,"type":"Functional"},{"id":"TEID-96-T3","title":"Submit an event timestamped at exactly the period boundary instant in the customer's zone, 2026-04-01T00:00:00 local, and confirm it is allocated to the new period rather than the closing one.","ac":3,"type":"Functional"},{"id":"TEID-96-T4","title":"Create a subscription anchored on the 31st and confirm its February period closes on the last day of February and its April period closes on April 30, rather than rolling into the following month.","ac":4,"type":"Functional"},{"id":"TEID-96-T5","title":"Run the automated boundary regression suite covering the March DST spring-forward gap, the November DST fall-back overlap, the December 31 to January 1 year-end, and February 29 in a leap year, and confirm every case assigns events to the documented period.","ac":5,"type":"Functional"},{"id":"TEID-96-T6","title":"Confirm the DST and month-end boundary regression suite runs in CI with individually named test cases per scenario, so a failure identifies the exact broken boundary case rather than a single generic failure.","ac":5,"type":"Non-functional"},{"id":"TEID-96-T7","title":"Submit an event timestamped during the repeated local hour created by a fall-back DST transition and confirm the system deterministically assigns it to one specific period per the documented tie-break rule, rather than raising an ambiguous-time error or varying across retries.","ac":2,"type":"Adversarial"},{"id":"TEID-96-T8","title":"Submit the same event twice with UTC timestamps 1 millisecond apart, straddling a period boundary due to clock skew between two ingestion nodes, and confirm both attempts, sharing an idempotency key, resolve to the same period assignment.","ac":3,"type":"Adversarial"}]},{"key":"TEID-31","epic":"TEID-3","summary":"Enforced idempotency","desc":"As a developer at our customer, I want to safely retry sending any event without risk of double charging, so that network failures and retries never create duplicate charges.\n\n*Context*\nIdempotency must be guaranteed by the database, not by application code that can have bugs.","priority":"Highest","points":5,"release":"mvp","area":"ledger","ac":["An event with an idempotency key already seen is acknowledged but not applied again, and the response says it was a duplicate.","Keys are remembered for at least the longest billing period plus 7 days.","If a repeated key arrives with different contents, it is rejected and flagged for review rather than silently ignored.","Uniqueness is enforced by the data store itself; a test that sends the same event from 50 parallel workers results in exactly one ledger entry."],"order":16,"tests":[{"id":"TEID-31-T1","title":"Send an event with idempotency key abc-123, then resend the identical event and key, and confirm the second response returns success with a duplicate flag and no second ledger entry is created.","ac":1,"type":"Functional"},{"id":"TEID-31-T2","title":"For a customer whose longest billing period is annual, submit an event and confirm at day 371 a resend with the same key is still blocked as a duplicate, then confirm at day 372, 365 plus 7, the key has expired and can be reused.","ac":2,"type":"Functional"},{"id":"TEID-31-T3","title":"Send an event with idempotency key xyz-789 and quantity 100, then resend the same key with quantity 200, and confirm the second request is rejected with a conflict error and appears in the operator's review queue.","ac":3,"type":"Functional"},{"id":"TEID-31-T4","title":"From 50 concurrent worker threads, simultaneously send the identical event with the same idempotency key and payload, and confirm exactly one ledger entry is created and the other 49 responses indicate duplicate.","ac":4,"type":"Functional"},{"id":"TEID-31-T5","title":"Repeat the 50-way concurrent duplicate-send test 1,000 times in a loop and confirm zero flaky outcomes, exactly one ledger entry every time, demonstrating a database-level uniqueness constraint rather than an application-level race-prone check.","ac":4,"type":"Non-functional"},{"id":"TEID-31-T6","title":"Send the identical event, same idempotency key, to two different application server instances at the same instant and confirm the shared database constraint allows only one insert to succeed, with the loser returning a duplicate response rather than an unhandled error.","ac":4,"type":"Adversarial"},{"id":"TEID-31-T7","title":"Reuse an idempotency key with a payload that differs only in a floating-point rounding artifact, such as quantity 100.00 versus 100.0000001, and confirm the mismatch is still detected and flagged for review rather than treated as an identical duplicate.","ac":3,"type":"Adversarial"}]},{"key":"TEID-32","epic":"TEID-3","summary":"Append-only double-entry ledger","desc":"As a finance lead, I want every balance change recorded as a permanent entry that shows what caused it, so that every number we bill can be traced and audited.\n\n*Context*\nCorrections are made by adding reversing entries, never by editing or deleting.","priority":"Highest","points":13,"release":"mvp","area":"ledger","ac":["Ledger entries can be added but never edited or deleted, by anyone, including our own staff.","Each entry records the cause: the usage event, grant, reservation, rule and plan version involved.","Every transaction is double-entry: the amounts across its accounts always sum to zero.","Corrections appear as new reversing entries linked to the entry they correct.","A daily automated check confirms that every transaction balances; any failure pages the on-call engineer."],"order":17,"tests":[{"id":"TEID-32-T1","title":"Attempt to run an UPDATE or DELETE statement directly against the ledger_entries table using an administrative database role and confirm a database-level trigger or permission blocks it, not merely application-layer logic.","ac":1,"type":"Functional"},{"id":"TEID-32-T2","title":"Post a usage-driven ledger entry and confirm its record includes populated references to the source usage event ID, the applicable grant ID, reservation ID, pricing rule ID, and plan version ID.","ac":2,"type":"Functional"},{"id":"TEID-32-T3","title":"Post a transaction crediting a revenue account $50.00 and debiting a receivable account $50.00 and confirm the transaction's line amounts sum to exactly 0.00 across all accounts.","ac":3,"type":"Functional"},{"id":"TEID-32-T4","title":"Issue a correction for a $25.00 overcharge entry and confirm a new reversing entry of -$25.00 is created referencing the original entry's ID, while the original entry remains unchanged.","ac":4,"type":"Functional"},{"id":"TEID-32-T5","title":"Run the daily balance-integrity job against a dataset containing one intentionally unbalanced transaction and confirm the job flags it and pages the on-call engineer through the alerting integration.","ac":5,"type":"Functional"},{"id":"TEID-32-T6","title":"Confirm the daily ledger-integrity check completes within its nightly maintenance window, under 30 minutes, against a 50-million-entry ledger table without degrading concurrent write throughput.","ac":5,"type":"Non-functional"},{"id":"TEID-32-T7","title":"Using a database superuser session, attempt to delete a single ledger row directly, bypassing the application layer entirely, and confirm a database-level constraint prevents the deletion.","ac":1,"type":"Adversarial"},{"id":"TEID-32-T8","title":"Attempt to insert a transaction via the API with intentionally unbalanced debit and credit amounts summing to $0.01 instead of $0.00, and confirm the write is rejected atomically with no partial entries persisted.","ac":3,"type":"Adversarial"}]},{"key":"TEID-33","epic":"TEID-3","summary":"Balances derived from the ledger","desc":"As a finance lead, I want balances that are always calculated from the ledger rather than stored as a separate number, so that balances can never drift from the underlying record.\n\n*Context*\nFor speed, balances may be cached, but the ledger is always the source of truth.","priority":"Highest","points":8,"release":"mvp","area":"ledger","ac":["Any customer balance can be recalculated from the ledger alone.","An automated check at least every hour compares cached balances to recalculated ones for every customer.","Any mismatch pages on-call and is shown on an internal integrity dashboard.","Operators can trigger a recalculation for a single customer and see the result."],"order":18,"tests":[{"id":"TEID-33-T1","title":"Ignore a customer's cached balance entirely and recompute their balance by replaying every ledger entry from scratch, confirming the recomputed value matches the last known cached value.","ac":1,"type":"Functional"},{"id":"TEID-33-T2","title":"Confirm the reconciliation job's schedule runs at least every 60 minutes and observe one full run comparing cached versus recalculated balances across a test set of 10,000 customers within that hour.","ac":2,"type":"Functional"},{"id":"TEID-33-T3","title":"Manually offset one customer's cached balance by $0.50 relative to the ledger, run the reconciliation job, and confirm an on-call page fires and the mismatch appears on the integrity dashboard with customer ID and discrepancy amount.","ac":3,"type":"Functional"},{"id":"TEID-33-T4","title":"As an operator, trigger a manual recalculation for a single named customer through the admin UI and confirm the recalculated balance and a run timestamp are displayed on the same screen.","ac":4,"type":"Functional"},{"id":"TEID-33-T5","title":"Measure the hourly reconciliation job's runtime against a 1-million-customer dataset and confirm it completes in under 20 minutes, well inside its 60-minute window.","ac":2,"type":"Non-functional"},{"id":"TEID-33-T6","title":"As an operator, fire 20 concurrent recalculation requests for the same customer simultaneously and confirm they converge to one consistent recalculated balance rather than producing conflicting or corrupted cached values.","ac":4,"type":"Adversarial"},{"id":"TEID-33-T7","title":"Simulate the paging integration being unreachable at the moment a balance mismatch is detected and confirm the mismatch is still recorded and visible on the integrity dashboard rather than silently dropped.","ac":3,"type":"Adversarial"}]},{"key":"TEID-35","epic":"TEID-3","summary":"Same result regardless of event order","desc":"As a finance lead, I want balances to end up identical no matter what order events arrive in, so that network delays and retries never change what a customer pays.\n\n*Context*\n","priority":"Highest","points":5,"release":"mvp","area":"ledger","ac":["Processing the same set of events in any order produces identical final balances and invoice totals.","An automated test replays a real-sized sample of events in at least 100 random orders and compares the results.","Where order genuinely matters (for example, the event that exhausts a commit), the event's timestamp decides, with a documented tie-break rule."],"order":19,"tests":[{"id":"TEID-35-T1","title":"Process a fixed set of 500 usage events in forward order and again in reverse order and confirm the resulting customer balance and invoice total are identical in both runs.","ac":1,"type":"Functional"},{"id":"TEID-35-T2","title":"Run the order-independence regression suite that replays a 10,000-event real-sized sample in 100 randomly shuffled orders and confirm all 100 runs produce identical final balances.","ac":2,"type":"Functional"},{"id":"TEID-35-T3","title":"Construct two events with timestamps identical to the millisecond that would each exhaust the same $100 commitment if applied in different orders, and confirm the documented tie-break rule is applied consistently across repeated runs.","ac":3,"type":"Functional"},{"id":"TEID-35-T4","title":"Confirm the 100-random-order replay regression suite completes in under 15 minutes in CI so order-independence is verified on every merge without materially slowing the pipeline.","ac":2,"type":"Non-functional"},{"id":"TEID-35-T5","title":"Submit two commit-exhausting events with identical timestamps via two racing concurrent requests and confirm the system does not apply both, avoiding double-spending the commitment, and resolves per the documented tie-break rule.","ac":3,"type":"Adversarial"},{"id":"TEID-35-T6","title":"Deliver a 1,000-event batch out of order with randomized 0-5000ms network jitter via a chaos test and confirm the final balance matches the in-order baseline exactly.","ac":1,"type":"Adversarial"}]},{"key":"TEID-34","epic":"TEID-3","summary":"Handle late-arriving events","desc":"As a finance lead, I want usage that arrives after its billing period has closed to be handled visibly and with approval, so that invoices never change silently.\n\n*Context*\nThe time the event happened, not the time it arrived, decides which period it belongs to.","priority":"High","points":8,"release":"mvp","area":"ledger","ac":["An event is assigned to the billing period in which it happened.","If that period is still open, the event is applied normally.","If the period is closed, the event goes into an adjustments queue instead of changing the closed invoice.","An operator can approve or reject queued adjustments, and can set automatic approval below a value threshold.","Approved adjustments appear on the next invoice as clearly labelled prior-period lines."],"order":20,"tests":[{"id":"TEID-34-T1","title":"Submit an event timestamped for March 15 that arrives on April 3, after March's period has closed, and confirm it is assigned to the March period based on when it happened, not when it arrived.","ac":1,"type":"Functional"},{"id":"TEID-34-T2","title":"Submit a late-arriving event timestamped for the current, still-open period and confirm it is applied immediately to the live balance with no queueing.","ac":2,"type":"Functional"},{"id":"TEID-34-T3","title":"Submit an event for a period that closed 5 days ago and confirm the already-issued invoice's stored total is unchanged, with the event instead placed in the adjustments queue in a pending state.","ac":3,"type":"Functional"},{"id":"TEID-34-T4","title":"As an operator, approve one queued adjustment and reject another, confirming the approved one is scheduled for billing and the rejected one is excluded; then set an auto-approval threshold of $10 and confirm a $5 adjustment auto-approves while a $50 adjustment still requires manual review.","ac":4,"type":"Functional"},{"id":"TEID-34-T5","title":"After approving a $30 late adjustment originally for March, confirm it appears on the next invoice as a distinctly labeled Prior Period Adjustment line item rather than being blended into that period's regular usage charges.","ac":5,"type":"Functional"},{"id":"TEID-34-T6","title":"Confirm an operator can triage a queue of 50 pending adjustments, approve, reject, or view detail, in under 10 minutes using the adjustments review screen.","ac":4,"type":"Non-functional"},{"id":"TEID-34-T7","title":"Submit 200 late-arriving events for the same closed period simultaneously and confirm none of them mutate the closed invoice's stored totals, and all 200 land correctly in the adjustments queue with no data loss or duplication.","ac":3,"type":"Adversarial"},{"id":"TEID-34-T8","title":"Attempt to set the auto-approval threshold via direct API manipulation to an invalid value, such as -1 or 999999999, and confirm the system rejects it rather than silently auto-approving everything or nothing unexpectedly.","ac":4,"type":"Adversarial"}]},{"key":"TEID-97","epic":"TEID-3","summary":"Multi-currency pricing and exchange rates","desc":"As a finance lead, I want to bill customers in different currencies with exchange rates handled transparently, so that international customers are billed correctly and currency effects are not mistaken for billing errors.","priority":"High","points":8,"release":"mvp","area":"ledger","ac":["Each customer contract has one billing currency.","Prices can be set per currency, or converted from a base currency using a named exchange-rate source.","Every converted amount records the rate, its source and its timestamp on the ledger.","The rate policy is configurable: rate at the time of the event, or a single rate fixed at period close.","Verify compares amounts in the invoice currency and reports exchange-rate differences in their own category, separate from billing errors."],"provisional":true,"order":21,"tests":[{"id":"TEID-97-T1","title":"Attempt to configure two different billing currencies on a single customer contract and confirm the system enforces exactly one currency per contract, rejecting the second.","ac":1,"type":"Functional"},{"id":"TEID-97-T2","title":"Price a SKU directly in EUR for one customer and, for another customer billed in GBP, convert the same USD base price using the ECB-daily named exchange-rate source, confirming both produce correctly denominated line items.","ac":2,"type":"Functional"},{"id":"TEID-97-T3","title":"Convert a $1,000.00 USD charge to EUR and confirm the resulting ledger entry stores the exact exchange rate used, the source name, and the timestamp the rate was fetched.","ac":3,"type":"Functional"},{"id":"TEID-97-T4","title":"Configure tenant A for rate-at-event-time and tenant B for rate-fixed-at-period-close, process identical events for both across a period with a fluctuating exchange rate, and confirm tenant A's invoice reflects multiple per-event rates while tenant B's invoice uses one single rate for the whole period.","ac":4,"type":"Functional"},{"id":"TEID-97-T5","title":"Run Verify against a Stripe invoice and a Teideal invoice for the same customer where only exchange-rate timing differs, and confirm the discrepancy is reported under a distinct exchange-rate-difference category rather than lumped in with billing errors.","ac":5,"type":"Functional"},{"id":"TEID-97-T6","title":"Confirm the exchange-rate lookup service maintains 99.9 percent availability over a 30-day window, with cached last-known rates used as fallback so a rate-source outage never blocks invoice generation.","ac":2,"type":"Non-functional"},{"id":"TEID-97-T7","title":"Simulate the exchange-rate source returning a rate of 0 or a negative number and confirm the system rejects the conversion and flags it for review rather than posting a $0.00 or negative charge to the ledger.","ac":3,"type":"Adversarial"},{"id":"TEID-97-T8","title":"Attempt to change a tenant's rate policy from fixed-at-period-close to rate-at-event-time in the middle of an already-closed period and confirm the change only applies prospectively, never silently recalculating already-invoiced periods.","ac":4,"type":"Adversarial"}]},{"key":"TEID-81","epic":"TEID-14","summary":"Publish the core as open source","desc":"As a developer evaluating Teideal, I want to read and run the ledger and verification engine myself, so that I can trust how my money is calculated.\n\n*Context*\nThe licence choice (for example Apache 2.0 or AGPL) is a business decision to make and record before launch.","priority":"High","points":5,"release":"mvp","area":"open-source","ac":["The ledger, re-rating and matching engine are published in a public repository.","The licence decision and its reasons are recorded in the repository.","Every change runs the full test suite in public CI.","A contribution guide and security reporting process are published."],"order":22,"tests":[{"id":"TEID-81-T1","title":"Clone the public repository anonymously and confirm the ledger, re-rating, and matching engine source directories are present and build successfully with no private submodule dependencies.","ac":1,"type":"Functional"},{"id":"TEID-81-T2","title":"Open the LICENSE file and its accompanying decision record in the repo root and confirm they name the chosen licence (for example Apache 2.0) and document the business reasons behind it.","ac":2,"type":"Functional"},{"id":"TEID-81-T3","title":"Push a trivial co
